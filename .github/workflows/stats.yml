name: Refresh GitHub stats

# Redraws assets/stats.svg from live data once a day.
# Uses the built-in token, which sees public activity. To include private
# contributions, add a fine-grained token as the STATS_TOKEN repo secret.

on:
  schedule:
    - cron: "17 2 * * *" # daily, 07:47 IST
  workflow_dispatch:
  push:
    paths:
      - scripts/stats.py
      - scripts/build.py
      - .github/workflows/stats.yml

permissions:
  contents: write

concurrency:
  group: stats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: scripts/.fonts
          key: profile-fonts-v1
      - run: pip install fonttools uharfbuzz
      - run: python scripts/stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: refresh GitHub stats"
          git push
