name: Refresh GitHub stats

# Redraws assets/stats.svg from live data once a day.
# Uses the built-in token, which sees public activity. To include private
# contributions, add a fine-grained token as the STATS_TOKEN repo secret.

on:
  schedule:
    # Every 6 hours: 00:04, 06:04, 12:04 and 18:04 IST (off the :00/:30 peak).
    # GitHub sometimes delays or skips scheduled runs, so one run a day can
    # leave the image a day behind. Commits only happen when the data changed.
    - cron: "34 0,6,12,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/stats.py
      - scripts/build.py
      - .github/workflows/stats.yml

permissions:
  contents: write

concurrency:
  group: stats-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: scripts/.fonts
          key: profile-fonts-v1
      - run: pip install fonttools uharfbuzz
      - run: python scripts/stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: refresh GitHub stats"
          # main may have moved since checkout (a re-run checks out its
          # original SHA; another run may have pushed). Replay on top of the
          # tip, keeping this run's freshly generated svg on conflict.
          for i in 1 2 3; do
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" \
              && git push && exit 0
            sleep $((i * 5))
          done
          echo "::error::push failed after 3 attempts"; exit 1
