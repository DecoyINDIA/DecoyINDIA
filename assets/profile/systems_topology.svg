    <line x1="0" y1="0" x2="146" y2="0" stroke="#00F2FE" stroke-width="1.5" />
    <circle cx="10" cy="14" r="3" fill="#00F2FE" />
    <text x="18" y="17" fill="#F8FAFC" font-size="10.5" font-weight="700" letter-spacing="0.08em" class="mono theme-text-head">BMD</text>
    <text x="10" y="31" fill="#94A3B8" font-size="7.5" font-weight="600" class="mono theme-text-body">Rust / Tokio Async</text>
    <text x="10" y="42" fill="#475569" font-size="7" font-weight="500" class="sans theme-text-dim">High-Throughput Downloader</text>
