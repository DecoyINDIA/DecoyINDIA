    <text x="18" y="17" fill="#F8FAFC" font-size="10.5" font-weight="700" letter-spacing="0.08em" class="mono theme-text-head">FORMSPEAR</text>
    <text x="10" y="31" fill="#94A3B8" font-size="7.5" font-weight="600" class="mono theme-text-body">Bare Node 20 / 39-Table SQL</text>
    <text x="10" y="42" fill="#475569" font-size="7" font-weight="500" class="sans theme-text-dim">Feedback Telemetry OS</text>
