    <path d="M 200 120 Q 150 215 210 315" fill="none" stroke="#FF8C00" stroke-opacity="0.4" stroke-dasharray="3 5" class="flow-stream-fast" />
    <path d="M 760 120 Q 620 60 550 70" fill="none" stroke="#00F2FE" stroke-opacity="0.4" stroke-dasharray="3 5" class="flow-stream-rev" />
    <path d="M 140 200 Q 480 130 760 120" fill="none" stroke="#00F2FE" stroke-opacity="0.25" stroke-dasharray="2 6" />
    <path d="M 820 245 Q 810 300 750 320" fill="none" stroke="#00E599" stroke-opacity="0.4" stroke-dasharray="3 5" class="flow-stream-fast" />
  </g>

