    <line x1="480" y1="210" x2="200" y2="90" stroke="#FF8C00" stroke-opacity="0.9" class="flow-stream" />
    <!-- Data Bus to OCTAPDF -->
    <line x1="480" y1="210" x2="760" y2="90" stroke="#00F2FE" stroke-opacity="0.35" />
