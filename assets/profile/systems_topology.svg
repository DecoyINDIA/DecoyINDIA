    <text x="10" y="31" fill="#94A3B8" font-size="7.5" font-weight="600" class="mono theme-text-body">Java 21 / Loom / Air-Gap</text>
    <text x="10" y="42" fill="#475569" font-size="7" font-weight="500" class="sans theme-text-dim">Local-First PDF OS</text>
