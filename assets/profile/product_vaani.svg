  <rect width="880" height="260" rx="6" fill="none" stroke="#21262D" stroke-width="1.2" class="theme-border" />
  <line x1="0" y1="0" x2="880" y2="0" stroke="#FF8C00" stroke-width="2" class="theme-amber-stroke" />

  <!-- Corner Crosshairs -->
  <g stroke="#30363D" stroke-width="0.8" opacity="0.7" class="theme-border-accent">
    <path d="M 10 14 L 18 14 M 14 10 L 14 18" />
    <path d="M 862 14 L 870 14 M 866 10 L 866 18" />
    <path d="M 10 246 L 18 246 M 14 242 L 14 250" />
    <path d="M 862 246 L 870 246 M 866 242 L 866 250" />
  </g>

