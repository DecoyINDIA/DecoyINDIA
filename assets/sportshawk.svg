<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" width="440" height="200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="shBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06120e" />
      <stop offset="60%" stop-color="#081e16" />
      <stop offset="100%" stop-color="#040a08" />
    </linearGradient>

    <linearGradient id="shBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FF6B00" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00D9F5" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="trajGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="60%" stop-color="#FFAE00" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>

    <pattern id="pitchGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#102e23" stroke-width="0.5" stroke-opacity="0.6" />
    </pattern>

    <filter id="shGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    @keyframes trackPulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
    }
    @keyframes trajectoryRun {
      0% { stroke-dashoffset: 140; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes targetBlink {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 0.3; }
    }

    .cv-bbox { animation: trackPulse 2.5s ease-in-out infinite; transform-origin: 345px 65px; }
    .trajectory-line {
      stroke-dasharray: 8 4;
      animation: trajectoryRun 1.5s linear infinite;
    }
    .cv-cross { animation: targetBlink 1.8s ease-in-out infinite; }
  </style>

  <!-- Background Canvas -->
  <rect width="440" height="200" rx="12" fill="url(#shBg)" />
  <rect width="440" height="200" rx="12" fill="url(#pitchGrid)" />
  <rect width="440" height="200" rx="12" fill="none" stroke="url(#shBorder)" stroke-width="1.2" />

  <!-- Corner Brackets -->
  <path d="M 12 25 L 12 12 L 25 12" fill="none" stroke="#00F5A0" stroke-width="1.5" />
  <path d="M 428 25 L 428 12 L 415 12" fill="none" stroke="#FF6B00" stroke-width="1.5" />
  <path d="M 12 175 L 12 188 L 25 188" fill="none" stroke="#00D9F5" stroke-width="1.5" />
  <path d="M 428 175 L 428 188 L 415 188" fill="none" stroke="#00F5A0" stroke-width="1.5" />

  <!-- Ambient Light Orbs -->
  <circle cx="345" cy="75" r="55" fill="#00F5A0" opacity="0.08" filter="url(#shGlow)" />

  <!-- Left Header & Info -->
  <g transform="translate(24, 28)">
    <!-- Category Pill -->
    <rect width="144" height="20" rx="4" fill="#0d291e" stroke="#00F5A0" stroke-width="0.8" />
    <text x="72" y="14" fill="#00F5A0" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1" class="mono">COMPUTER VISION // AI</text>

    <!-- Title -->
    <text x="0" y="48" fill="#ffffff" font-size="22" font-weight="800" letter-spacing="0.5" class="sans">SportsHawk</text>
    <text x="135" y="47" fill="#64748b" font-size="11" font-weight="600" class="mono">v3.0</text>

    <!-- Description -->
    <text x="0" y="70" fill="#94a3b8" font-size="11.5" font-weight="400" class="sans">Grassroots football CV tracking &amp; kinetic drills</text>

    <!-- Telemetry Box -->
    <g transform="translate(0, 92)">
      <rect width="210" height="48" rx="6" fill="#081813" stroke="#123b2c" stroke-width="1" />
      
      <text x="10" y="16" fill="#64748b" font-size="8.5" font-weight="600" letter-spacing="0.8" class="mono">REAL-TIME INFERENCE</text>
      <text x="10" y="36" fill="#00F5A0" font-size="13" font-weight="700" class="mono">60 FPS</text>
      <text x="68" y="35" fill="#FFB020" font-size="9.5" font-weight="600" class="mono">| 94.8% DRILL ACC</text>
      <text x="10" y="45" fill="#64748b" font-size="8" font-weight="500" class="mono">POSE DETECT // BALL TRACKER</text>
    </g>
  </g>

  <!-- Right Visual: Computer Vision Football Pitch & Tracking Array -->
  <g transform="translate(345, 75)">
    <!-- Pitch Perspective Outline -->
    <polygon points="-55,35 55,35 40,-40 -40,-40" fill="#061811" stroke="#164e37" stroke-width="1.2" />
    <!-- Pitch Center Circle -->
    <ellipse cx="0" cy="0" rx="20" ry="10" fill="none" stroke="#1a5a40" stroke-width="1" />
    <line x1="-48" y1="0" x2="48" y2="0" stroke="#1a5a40" stroke-width="1" />
    <!-- Goal Box Top -->
    <rect x="-18" y="-40" width="36" height="12" fill="none" stroke="#1a5a40" stroke-width="1" />

    <!-- Kinetic Trajectory Curve -->
    <path d="M -30 25 Q 5 -20 25 -32" fill="none" stroke="url(#trajGrad)" stroke-width="2" class="trajectory-line" />

    <!-- Ball at endpoint with glow -->
    <circle cx="25" cy="-32" r="4.5" fill="#FF6B00" filter="url(#shGlow)" />
    <circle cx="25" cy="-32" r="2.5" fill="#FFFFFF" />

    <!-- AI Bounding Box on Player -->
    <g class="cv-bbox">
      <rect x="-18" y="-12" width="28" height="34" fill="none" stroke="#00F5A0" stroke-width="1.2" stroke-dasharray="4 2" />
      <!-- Target Reticle Ticks -->
      <path d="M -18 -8 L -18 -12 L -14 -12" fill="none" stroke="#00F5A0" stroke-width="1.5" />
      <path d="M 10 -12 L 10 -8 M 6 -12 L 10 -12" fill="none" stroke="#00F5A0" stroke-width="1.5" />
      <path d="M -18 18 L -18 22 L -14 22" fill="none" stroke="#00F5A0" stroke-width="1.5" />
      <path d="M 10 18 L 10 22 M 6 22 L 10 22" fill="none" stroke="#00F5A0" stroke-width="1.5" />
      
      <!-- Label Tag -->
      <rect x="-18" y="-22" width="40" height="9" fill="#00F5A0" rx="1" />
      <text x="2" y="-15" fill="#040f0a" font-size="6.5" font-weight="800" text-anchor="middle" class="mono">FWD #09</text>
    </g>

    <!-- Crosshair Target -->
    <g class="cv-cross">
      <circle cx="-4" cy="5" r="6" fill="none" stroke="#FF6B00" stroke-width="0.8" />
      <line x1="-4" y1="-3" x2="-4" y2="13" stroke="#FF6B00" stroke-width="0.8" />
      <line x1="-12" y1="5" x2="4" y2="5" stroke="#FF6B00" stroke-width="0.8" />
    </g>

    <!-- Telemetry Coordinates -->
    <text x="0" y="52" fill="#64748b" font-size="8" font-weight="600" text-anchor="middle" class="mono">POS: [X:142 Y:88] // VEL: 24 km/h</text>
  </g>

  <!-- Bottom Tag Bar -->
  <g transform="translate(24, 172)">
    <circle cx="4" cy="5" r="3" fill="#00F5A0" />
    <text x="14" y="8" fill="#64748b" font-size="9" font-weight="600" class="mono">TRACK: COMPUTER VISION ENGINE</text>
    <text x="210" y="8" fill="#64748b" font-size="9" font-weight="600" class="mono">SPORTS TELEMETRY</text>
  </g>
</svg>
