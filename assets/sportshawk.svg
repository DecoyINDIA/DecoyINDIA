<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" width="440" height="220" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="spBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B10" />
      <stop offset="100%" stop-color="#0E121A" />
    </linearGradient>
    <pattern id="spGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#141824" stroke-width="0.75" />
    </pattern>
  </defs>
  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', 'Inter', sans-serif; }
    @keyframes trackPulse {
      0%, 100% { r: 3px; opacity: 0.6; }
      50% { r: 4.5px; opacity: 1; }
    }
    .joint-node { animation: trackPulse 2s ease-in-out infinite; }
  </style>

  <rect width="440" height="220" rx="8" fill="url(#spBg)" />
  <rect width="440" height="220" rx="8" fill="url(#spGrid)" />
  <rect width="440" height="220" rx="8" fill="none" stroke="#1E2435" stroke-width="1.2" />

  <!-- Header Section -->
  <g transform="translate(24, 28)">
    <circle cx="4" cy="4" r="3.5" fill="#10B981" />
    <text x="14" y="8" fill="#94A3B8" font-size="9" font-weight="600" letter-spacing="1.5" class="mono">SYSTEM // 06 · EDGE COMPUTER VISION</text>
    <text x="0" y="32" fill="#F8FAFC" font-size="18" font-weight="700" letter-spacing="-0.3" class="sans">SportsHawk</text>
    <text x="108" y="32" fill="#10B981" font-size="11" font-weight="600" letter-spacing="1" class="mono">[GRASSROOTS AI COACH]</text>
  </g>

  <!-- Edge Computer Vision Kinematics & Player Card Radar -->
  <g transform="translate(24, 82)">
    <text x="0" y="0" fill="#64748B" font-size="8.5" font-weight="600" letter-spacing="1.2" class="mono">100% ON-DEVICE VISION // ZERO CLOUD EGRESS</text>
    <text x="280" y="0" fill="#10B981" font-size="8.5" font-weight="600" letter-spacing="0.8" class="mono">9 INDIC DIALECTS</text>

    <!-- Kinematic Joint Tracking Mesh Visual -->
    <g transform="translate(10, 12)">
      <!-- Head -->
      <circle cx="36" cy="6" r="3.5" fill="#FF5522" />
      <!-- Torso -->
      <line x1="36" y1="9.5" x2="36" y2="28" stroke="#38BDF8" stroke-width="1.2" />
      <!-- Shoulders & Arms -->
      <line x1="20" y1="16" x2="52" y2="16" stroke="#38BDF8" stroke-width="1.2" />
      <line x1="20" y1="16" x2="14" y2="28" stroke="#38BDF8" stroke-width="1" />
      <line x1="52" y1="16" x2="60" y2="24" stroke="#38BDF8" stroke-width="1" />
      <!-- Legs -->
      <line x1="36" y1="28" x2="24" y2="44" stroke="#10B981" stroke-width="1.2" />
      <line x1="36" y1="28" x2="48" y2="44" stroke="#10B981" stroke-width="1.2" />

      <!-- Ball Kinematic Arc -->
      <path d="M 64 42 Q 80 20 96 38" fill="none" stroke="#FF5522" stroke-width="1.2" stroke-dasharray="2 3" />
      <circle cx="96" cy="38" r="4" fill="#FF5522" />
    </g>

    <!-- Player Card Performance Metrics Deck -->
    <g transform="translate(140, 12)">
      <rect width="240" height="42" rx="4" fill="#121624" stroke="#252E46" stroke-width="1" />
      <text x="14" y="16" fill="#64748B" font-size="8" font-weight="600" letter-spacing="1" class="mono">BALL VELOCITY</text>
      <text x="14" y="32" fill="#F1F5F9" font-size="12" font-weight="600" class="mono">84.2 KM/H</text>

      <text x="130" y="16" fill="#64748B" font-size="8" font-weight="600" letter-spacing="1" class="mono">CONE AGILITY</text>
      <text x="130" y="32" fill="#10B981" font-size="12" font-weight="600" class="mono">GRADE A+ (94%)</text>
    </g>
  </g>

  <!-- Technical Spec Footer -->
  <g transform="translate(24, 180)">
    <line x1="0" y1="0" x2="392" y2="0" stroke="#1B2130" stroke-width="1" />
    <text x="0" y="18" fill="#64748B" font-size="8.5" font-weight="500" class="mono">
      JavaScript · MediaPipe · TensorFlow.js · Edge Computer Vision · PWA · Zero Player Fees
    </text>
  </g>
</svg>