<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" width="440" height="200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Base Canvas -->
    <linearGradient id="shBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040e0a" />
      <stop offset="55%" stop-color="#071c14" />
      <stop offset="100%" stop-color="#030806" />
    </linearGradient>

    <!-- 1px Specular Border -->
    <linearGradient id="shGlassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="30%" stop-color="#00F5A0" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#FF6B00" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00D9F5" stop-opacity="0.5" />
    </linearGradient>

    <!-- Border Comet Gradient -->
    <linearGradient id="shComet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0" />
      <stop offset="60%" stop-color="#00F5A0" stop-opacity="0.85" />
      <stop offset="90%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0" />
    </linearGradient>

    <!-- Trajectory Parabolic Gradient -->
    <linearGradient id="trajGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="50%" stop-color="#FFAE00" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>

    <pattern id="shGrid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#0f2b20" stroke-width="0.5" stroke-opacity="0.5" />
      <circle cx="0" cy="0" r="0.7" fill="#00F5A0" fill-opacity="0.3" />
    </pattern>

    <!-- Liquid Glass Specular Filter -->
    <filter id="glassRefractSh" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur" />
      <feSpecularLighting in="blur" surfaceScale="2.5" specularConstant="1.5" specularExponent="24" lighting-color="#ffffff" result="specular">
        <feDistantLight azimuth="225" elevation="50" />
      </feSpecularLighting>
      <feComposite in="SourceGraphic" in2="specular" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" />
    </filter>

    <filter id="softGlowSh" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    @keyframes shCometRun {
      0% { stroke-dashoffset: 1240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes trajectoryFlow {
      0% { stroke-dashoffset: 160; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes cvTargetPulse {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    @keyframes sparkFloat {
      0%, 100% { transform: translate(0, 0); opacity: 0.4; }
      50% { transform: translate(3px, -4px); opacity: 0.9; }
    }

    .card-comet-sh {
      stroke-dasharray: 80 1160;
      animation: shCometRun 5.8s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
    }
    .traj-laser {
      stroke-dasharray: 8 5;
      animation: trajectoryFlow 1.6s linear infinite;
    }
    .cv-reticle {
      animation: cvTargetPulse 2.4s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      transform-origin: 345px 65px;
    }
    .spark-node {
      animation: sparkFloat 2.1s ease-in-out infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="440" height="200" rx="12" fill="url(#shBg2)" />
  <rect width="440" height="200" rx="12" fill="url(#shGrid2)" />
  <rect width="440" height="200" rx="12" fill="none" stroke="url(#shGlassBorder)" stroke-width="1.2" />

  <!-- React-Bits Border Comet -->
  <rect width="440" height="200" rx="12" fill="none" stroke="url(#shComet)" stroke-width="2" class="card-comet-sh" />

  <!-- Corner Brackets -->
  <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8" />
  <path d="M 428 24 L 428 12 L 416 12" fill="none" stroke="#FF6B00" stroke-width="1.5" />
  <path d="M 12 176 L 12 188 L 24 188" fill="none" stroke="#00D9F5" stroke-width="1.5" />
  <path d="M 428 176 L 428 188 L 416 188" fill="none" stroke="#00F5A0" stroke-width="1.5" />

  <!-- Ambient Light Spotlight -->
  <circle cx="345" cy="75" r="70" fill="#00F5A0" opacity="0.08" filter="url(#softGlowSh)" />

  <!-- Left Header and Info -->
  <g transform="translate(24, 26)">
    <!-- Glass Category Pill -->
    <rect width="144" height="22" rx="6" fill="#0c251b" fill-opacity="0.85" stroke="url(#shGlassBorder)" stroke-width="0.9" filter="url(#glassRefractSh)" />
    <path d="M 6 2 L 138 2" stroke="#ffffff" stroke-opacity="0.4" stroke-width="0.6" stroke-linecap="round" />
    <text x="72" y="15" fill="#00F5A0" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1" class="mono">COMPUTER VISION // AI</text>

    <!-- Title with Specular Lighting -->
    <text x="0" y="52" fill="#ffffff" font-size="24" font-weight="900" letter-spacing="0.5" class="sans" filter="url(#glassRefractSh)">SportsHawk</text>
    <text x="145" y="50" fill="#64748b" font-size="11" font-weight="600" class="mono">v3.0</text>

    <!-- Description -->
    <text x="0" y="73" fill="#94a3b8" font-size="11.5" font-weight="400" class="sans">Grassroots football CV tracking &amp; kinetic drills</text>

    <!-- Frosted Glass Telemetry Box -->
    <g transform="translate(0, 92)">
      <rect width="210" height="48" rx="7" fill="#081813" fill-opacity="0.8" stroke="url(#shGlassBorder)" stroke-width="0.9" filter="url(#glassRefractSh)" />
      <path d="M 6 2 L 204 2" stroke="#ffffff" stroke-opacity="0.3" stroke-width="0.6" stroke-linecap="round" />
      
      <text x="10" y="16" fill="#64748b" font-size="8.5" font-weight="600" letter-spacing="0.8" class="mono">REAL-TIME INFERENCE</text>
      <text x="10" y="36" fill="#00F5A0" font-size="13" font-weight="700" class="mono">60 FPS</text>
      <text x="68" y="35" fill="#FFAE00" font-size="9.5" font-weight="600" class="mono">| 94.8% DRILL ACC</text>
      <text x="10" y="45" fill="#64748b" font-size="8" font-weight="500" class="mono">POSE DETECT // BALL TRACKER</text>
    </g>
  </g>

  <!-- Right Visual: 3D Perspective Pitch Wireframe and Kinetic Trajectory Arc -->
  <g transform="translate(345, 75)">
    <!-- 3D Perspective Pitch Ground Plane -->
    <polygon points="-56,36 56,36 42,-42 -42,-42" fill="#071912" stroke="#164d36" stroke-width="1.2" />
    <ellipse cx="0" cy="-2" rx="22" ry="11" fill="none" stroke="#1c5d42" stroke-width="1" />
    <line x1="-50" y1="-2" x2="50" y2="-2" stroke="#1c5d42" stroke-width="1" />
    <!-- Goal Box Top -->
    <rect x="-18" y="-42" width="36" height="12" fill="none" stroke="#1c5d42" stroke-width="1" />

    <!-- Kinetic Trajectory Parabolic Arc -->
    <path d="M -32 26 Q 5 -24 26 -34" fill="none" stroke="url(#trajGrad2)" stroke-width="2.4" class="traj-laser" />

    <!-- Trajectory Endpoint / Ball Spark -->
    <circle cx="26" cy="-34" r="5" fill="#FF6B00" filter="url(#softGlowSh)" />
    <circle cx="26" cy="-34" r="2.5" fill="#ffffff" />

    <!-- Spark Particles -->
    <circle cx="0" cy="-14" r="1.5" fill="#FFAE00" class="spark-node" />
    <circle cx="14" cy="-24" r="1.5" fill="#00F5A0" class="spark-node" />

    <!-- AI Bounding Box and Target Reticle -->
    <g class="cv-reticle">
      <rect x="-18" y="-12" width="28" height="34" fill="none" stroke="#00F5A0" stroke-width="1.3" stroke-dasharray="4 2" />
      <!-- Target Corner Brackets -->
      <path d="M -18 -8 L -18 -12 L -14 -12" fill="none" stroke="#ffffff" stroke-width="1.5" />
      <path d="M 6 -12 L 10 -12 L 10 -8" fill="none" stroke="#ffffff" stroke-width="1.5" />
      <path d="M -18 18 L -18 22 L -14 22" fill="none" stroke="#ffffff" stroke-width="1.5" />
      <path d="M 6 22 L 10 22 L 10 18" fill="none" stroke="#ffffff" stroke-width="1.5" />

      <!-- Player HUD Tag -->
      <rect x="-18" y="-22" width="42" height="9" fill="#00F5A0" rx="2" />
      <text x="3" y="-15" fill="#040e0a" font-size="6.5" font-weight="800" text-anchor="middle" class="mono">FWD #09</text>
    </g>

    <!-- Telemetry Coordinates -->
    <text x="0" y="54" fill="#64748b" font-size="8" font-weight="600" text-anchor="middle" class="mono">POS: [X:142 Y:88] // VEL: 24 km/h</text>
  </g>

  <!-- Bottom Tag Bar -->
  <g transform="translate(24, 172)">
    <circle cx="4" cy="5" r="3" fill="#00F5A0" />
    <text x="14" y="8" fill="#64748b" font-size="9" font-weight="600" class="mono">TRACK: COMPUTER VISION ENGINE</text>
    <text x="210" y="8" fill="#64748b" font-size="9" font-weight="600" class="mono">SPORTS TELEMETRY</text>
  </g>
</svg>
