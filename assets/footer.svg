<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Base Canvas -->
    <linearGradient id="ftBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060f" />
      <stop offset="50%" stop-color="#080e1c" />
      <stop offset="100%" stop-color="#030409" />
    </linearGradient>

    <!-- 1px Specular Border -->
    <linearGradient id="ftGlassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="25%" stop-color="#7F00FF" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.4" />
      <stop offset="75%" stop-color="#FF007F" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00F5A0" stop-opacity="0.6" />
    </linearGradient>

    <!-- Border Comet Gradient -->
    <linearGradient id="ftComet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F00FF" stop-opacity="0" />
      <stop offset="60%" stop-color="#00F2FE" stop-opacity="0.85" />
      <stop offset="90%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#00F5A0" stop-opacity="0" />
    </linearGradient>

    <!-- Holographic Signature Gradient -->
    <linearGradient id="ftHoloSig" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#00F2FE" />
      <stop offset="65%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#00F5A0" />
    </linearGradient>

    <!-- ECG Laser Pulse Gradient -->
    <linearGradient id="ecgLaserPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0" />
      <stop offset="40%" stop-color="#00F2FE" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#00F5A0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7F00FF" stop-opacity="0" />
    </linearGradient>

    <!-- Sweeping Aurora Horizon Gradient -->
    <linearGradient id="ftAuroraHorizon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F00FF" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00F5A0" stop-opacity="0.08" />
    </linearGradient>

    <pattern id="ftGrid2" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#132035" stroke-width="0.5" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="0.75" fill="#00F2FE" fill-opacity="0.25" />
    </pattern>

    <!-- Liquid Glass Specular Filter -->
    <filter id="glassRefractFt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur" />
      <feSpecularLighting in="blur" surfaceScale="2.5" specularConstant="1.4" specularExponent="24" lighting-color="#ffffff" result="specular">
        <feDistantLight azimuth="225" elevation="50" />
      </feSpecularLighting>
      <feComposite in="SourceGraphic" in2="specular" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" />
    </filter>

    <filter id="softGlowFt" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    @keyframes ftCometRun {
      0% { stroke-dashoffset: 2180; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes ecgTravelFlow {
      0% { stroke-dashoffset: 480; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes ftLedBreathe {
      0%, 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 2px #00F5A0); }
      50% { opacity: 0.45; transform: scale(0.9); filter: drop-shadow(0 0 7px #00F5A0); }
    }
    @keyframes auroraHorizonWave {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-14px) scale(1.04); }
    }
    @keyframes prismFringeFt {
      0%, 100% { transform: translate(0, 0); opacity: 0.5; }
      50% { transform: translate(1px, -1px); opacity: 0.85; }
    }

    .card-comet-ft {
      stroke-dasharray: 120 2060;
      animation: ftCometRun 7.2s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
    }
    .ecg-laser {
      stroke-dasharray: 70 140;
      animation: ecgTravelFlow 2.8s linear infinite;
    }
    .ft-led {
      animation: ftLedBreathe 2.2s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      transform-origin: center;
    }
    .aurora-horizon {
      animation: auroraHorizonWave 10.5s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      transform-origin: 450px 180px;
    }
    .sig-fringe {
      animation: prismFringeFt 3.8s ease-in-out infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="900" height="220" rx="14" fill="url(#ftBg2)" />
  <rect width="900" height="220" rx="14" fill="url(#ftGrid2)" />

  <!-- Sweeping Aurora Horizon -->
  <path d="M -50 160 Q 220 90 480 190 T 950 140 L 950 220 L -50 220 Z" fill="url(#ftAuroraHorizon)" class="aurora-horizon" filter="url(#softGlowFt)" />

  <!-- 1px Specular Border -->
  <rect width="900" height="220" rx="14" fill="none" stroke="url(#ftGlassBorder)" stroke-width="1.2" />

  <!-- React-Bits Border Comet -->
  <rect width="900" height="220" rx="14" fill="none" stroke="url(#ftComet)" stroke-width="2.2" class="card-comet-ft" />

  <!-- Corner Brackets -->
  <path d="M 14 26 L 14 14 L 26 14" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.8" />
  <path d="M 886 26 L 886 14 L 874 14" fill="none" stroke="#00F2FE" stroke-width="1.6" />
  <path d="M 14 194 L 14 206 L 26 206" fill="none" stroke="#00F5A0" stroke-width="1.6" />
  <path d="M 886 194 L 886 206 L 874 206" fill="none" stroke="#7F00FF" stroke-width="1.6" />

  <!-- Ambient Light Orbs -->
  <circle cx="160" cy="110" r="110" fill="#7F00FF" opacity="0.08" filter="url(#softGlowFt)" />
  <circle cx="700" cy="110" r="110" fill="#00F2FE" opacity="0.06" filter="url(#softGlowFt)" />

  <!-- Left Content Block -->
  <g transform="translate(42, 38)">
    <!-- Eyebrow Tag -->
    <text x="0" y="10" fill="#64748b" font-size="9.5" font-weight="700" letter-spacing="2" class="mono">// DECOY // CLOSING TRANSMISSION</text>

    <!-- Monumental Holographic Signature Title -->
    <g transform="translate(0, 44)">
      <!-- Chromatic Underlayer -->
      <text x="-1" y="1" fill="#FF007F" font-size="29" font-weight="900" letter-spacing="1.5" class="sans sig-fringe" opacity="0.4">BUILDING THE UNREASONABLE.</text>
      <text x="1" y="-1" fill="#00F2FE" font-size="29" font-weight="900" letter-spacing="1.5" class="sans sig-fringe" opacity="0.4">BUILDING THE UNREASONABLE.</text>
      <!-- Main Specular Title -->
      <text x="0" y="0" fill="url(#ftHoloSig)" font-size="29" font-weight="900" letter-spacing="1.5" class="sans" filter="url(#glassRefractFt)">BUILDING THE UNREASONABLE.</text>
    </g>

    <!-- Subtitle -->
    <text x="0" y="70" fill="#94a3b8" font-size="12" font-weight="400" class="sans">Crafting high-leverage sovereign systems, agentic architectures &amp; resilient foundations.</text>

    <!-- Pulse ECG Heartbeat Trace with Traveling Laser -->
    <g transform="translate(0, 105)">
      <line x1="0" y1="0" x2="480" y2="0" stroke="#16253c" stroke-width="1" />
      <path d="M 0 0 L 140 0 L 155 -12 L 165 14 L 175 -8 L 185 4 L 195 0 L 480 0" fill="none" stroke="url(#ecgLaserPulse)" stroke-width="2.2" class="ecg-laser" />
      <circle cx="165" cy="14" r="2.8" fill="#00F5A0" filter="url(#softGlowFt)" />
    </g>

    <!-- Micro Readout Coordinates -->
    <g transform="translate(0, 126)">
      <circle cx="4" cy="5" r="3" fill="#00F5A0" />
      <text x="14" y="9" fill="#64748b" font-size="9" font-weight="600" class="mono">NEW DELHI CLUSTER (28.6139° N, 77.2090° E) // SOVEREIGN ENGINE</text>
    </g>
  </g>

  <!-- Right Dispatch / Liquid Glass Telemetry Console -->
  <g transform="translate(560, 36)">
    <rect width="300" height="148" rx="8" fill="#060c18" fill-opacity="0.85" stroke="url(#ftGlassBorder)" stroke-width="1" filter="url(#glassRefractFt)" />
    <path d="M 8 2 L 292 2" stroke="#ffffff" stroke-opacity="0.4" stroke-width="0.7" stroke-linecap="round" />
    
    <!-- Console Header -->
    <g transform="translate(16, 20)">
      <circle cx="4" cy="5" r="4.5" fill="#00F5A0" class="ft-led" />
      <text x="16" y="9" fill="#00F5A0" font-size="10" font-weight="700" letter-spacing="1" class="mono">STATUS: ACTIVE // DEPLOYED</text>
    </g>

    <!-- Divider Line -->
    <line x1="16" y1="36" x2="284" y2="36" stroke="#16243a" stroke-width="1" />

    <!-- Details List -->
    <g transform="translate(16, 52)">
      <!-- Item 1: Secure Dispatch -->
      <text x="0" y="10" fill="#64748b" font-size="8.5" font-weight="600" class="mono">SECURE DISPATCH:</text>
      <text x="0" y="24" fill="#00F2FE" font-size="11" font-weight="700" class="mono">lawflow.india@gmail.com</text>

      <!-- Item 2: Organization -->
      <text x="0" y="46" fill="#64748b" font-size="8.5" font-weight="600" class="mono">ORGANIZATION / LAB:</text>
      <text x="0" y="60" fill="#c084fc" font-size="11" font-weight="700" class="mono">XolverLabs</text>

      <!-- Item 3: Direct Connect -->
      <text x="165" y="46" fill="#64748b" font-size="8.5" font-weight="600" class="mono">GITHUB PROTOCOL:</text>
      <text x="165" y="60" fill="#ffffff" font-size="11" font-weight="700" class="mono">DecoyINDIA</text>
    </g>

    <!-- Bottom Status Bar in Console -->
    <rect x="0" y="126" width="300" height="22" rx="0 0 8 8" fill="#0c1527" />
    <text x="150" y="141" fill="#475569" font-size="8.5" font-weight="600" text-anchor="middle" letter-spacing="1" class="mono">CORE RUNTIME: 2026 // ALL RIGHTS RESERVED</text>
  </g>
</svg>
