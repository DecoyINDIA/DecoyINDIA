<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="ftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B12" />
      <stop offset="50%" stop-color="#0A0E18" />
      <stop offset="100%" stop-color="#06080E" />
    </linearGradient>

    <!-- 1px Hairline Border -->
    <linearGradient id="ftBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F00FF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00F5A0" stop-opacity="0.5" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="ftTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#A78BFA" />
    </linearGradient>

    <!-- ECG Laser Gradient -->
    <linearGradient id="ecgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0" />
      <stop offset="40%" stop-color="#00F2FE" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#00F5A0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#7F00FF" stop-opacity="0" />
    </linearGradient>

    <!-- Precision Dot Grid -->
    <pattern id="ftGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#162338" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    @keyframes ecgTravel {
      0% { stroke-dashoffset: 480; }
      100% { stroke-dashoffset: 0; }
    }
    .ecg-line {
      stroke-dasharray: 70 140;
      animation: ecgTravel 2.8s linear infinite;
    }
  </style>

  <!-- Background Surface -->
  <rect width="900" height="220" rx="14" fill="url(#ftBg)" />
  <rect width="900" height="220" rx="14" fill="url(#ftGrid)" />
  <rect width="900" height="220" rx="14" fill="none" stroke="url(#ftBorder)" stroke-width="1.2" />

  <!-- Corner Brackets -->
  <path d="M 14 26 L 14 14 L 26 14" fill="none" stroke="#7F00FF" stroke-width="1.6" />
  <path d="M 886 26 L 886 14 L 874 14" fill="none" stroke="#00F2FE" stroke-width="1.6" />
  <path d="M 14 194 L 14 206 L 26 206" fill="none" stroke="#00F5A0" stroke-width="1.6" />
  <path d="M 886 194 L 886 206 L 874 206" fill="none" stroke="#7F00FF" stroke-width="1.6" />

  <!-- Left Content Block -->
  <g transform="translate(42, 38)">
    <!-- Eyebrow Tag -->
    <text x="0" y="10" fill="#64748B" font-size="9.5" font-weight="700" letter-spacing="2" class="mono">// DECOY // CLOSING TRANSMISSION</text>

    <!-- Monumental Clean Single-Layer Title -->
    <g transform="translate(0, 44)">
      <text x="0" y="0" fill="url(#ftTitle)" font-size="28" font-weight="900" letter-spacing="1.5" class="sans">BUILDING THE UNREASONABLE.</text>
    </g>

    <!-- Subtitle -->
    <text x="0" y="70" fill="#94A3B8" font-size="12" font-weight="400" class="sans">Crafting high-leverage sovereign systems, agentic architectures and resilient foundations.</text>

    <!-- Pulse ECG Heartbeat Trace with Traveling Laser -->
    <g transform="translate(0, 105)">
      <line x1="0" y1="0" x2="480" y2="0" stroke="#16253C" stroke-width="1" />
      <path d="M 0 0 L 140 0 L 155 -12 L 165 14 L 175 -8 L 185 4 L 195 0 L 480 0" fill="none" stroke="url(#ecgGrad)" stroke-width="2" class="ecg-line" />
      <circle cx="165" cy="14" r="2.8" fill="#00F5A0" />
    </g>

    <!-- Micro Readout Coordinates -->
    <g transform="translate(0, 126)">
      <circle cx="4" cy="5" r="3" fill="#00F5A0" />
      <text x="14" y="9" fill="#64748B" font-size="9" font-weight="600" class="mono">NEW DELHI CLUSTER (28.6139° N, 77.2090° E) // SOVEREIGN ENGINE</text>
    </g>
  </g>

  <!-- Right Dispatch Telemetry Console Box -->
  <g transform="translate(560, 36)">
    <rect width="300" height="148" rx="8" fill="#0A0F1D" stroke="#1E2A3E" stroke-width="1" />
    
    <!-- Console Header -->
    <g transform="translate(16, 20)">
      <circle cx="4" cy="5" r="4.5" fill="#00F5A0">
        <animate attributeName="opacity" values="1; 0.35; 1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="16" y="9" fill="#00F5A0" font-size="10" font-weight="700" letter-spacing="1" class="mono">STATUS: ACTIVE // DEPLOYED</text>
    </g>

    <!-- Divider Line -->
    <line x1="16" y1="36" x2="284" y2="36" stroke="#16243A" stroke-width="1" />

    <!-- Details List -->
    <g transform="translate(16, 52)">
      <!-- Item 1: Secure Dispatch -->
      <text x="0" y="10" fill="#64748B" font-size="8.5" font-weight="600" class="mono">SECURE DISPATCH:</text>
      <text x="0" y="24" fill="#00F2FE" font-size="11" font-weight="700" class="mono">lawflow.india@gmail.com</text>

      <!-- Item 2: Organization -->
      <text x="0" y="46" fill="#64748B" font-size="8.5" font-weight="600" class="mono">ORGANIZATION / LAB:</text>
      <text x="0" y="60" fill="#C084FC" font-size="11" font-weight="700" class="mono">XolverLabs</text>

      <!-- Item 3: Direct Connect -->
      <text x="165" y="46" fill="#64748B" font-size="8.5" font-weight="600" class="mono">GITHUB PROTOCOL:</text>
      <text x="165" y="60" fill="#FFFFFF" font-size="11" font-weight="700" class="mono">DecoyINDIA</text>
    </g>

    <!-- Bottom Status Bar in Console -->
    <rect x="0" y="126" width="300" height="22" rx="0 0 8 8" fill="#0E1424" />
    <text x="150" y="141" fill="#64748B" font-size="8.5" font-weight="600" text-anchor="middle" letter-spacing="1" class="mono">CORE RUNTIME: 2026 // ALL RIGHTS RESERVED</text>
  </g>
</svg>
