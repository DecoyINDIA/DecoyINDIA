<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="ftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a101f" />
      <stop offset="100%" stop-color="#04060b" />
    </linearGradient>

    <linearGradient id="ftBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F00FF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00F5A0" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="ftTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#7F00FF" />
    </linearGradient>

    <linearGradient id="ecgGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0" />
      <stop offset="40%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#00F5A0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7F00FF" stop-opacity="0" />
    </linearGradient>

    <pattern id="ftGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#162238" stroke-width="0.5" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="0.75" fill="#00F2FE" fill-opacity="0.25" />
    </pattern>

    <filter id="ftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    @keyframes ecgTravel {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes ledBlink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }
    @keyframes signatureGlow {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(0, 242, 254, 0.4)); }
      50% { filter: drop-shadow(0 0 12px rgba(127, 0, 255, 0.7)); }
    }

    .ecg-line {
      stroke-dasharray: 60 120;
      animation: ecgTravel 3s linear infinite;
    }
    .status-led {
      animation: ledBlink 1.8s ease-in-out infinite;
      transform-origin: center;
    }
    .sig-glow {
      animation: signatureGlow 4s ease-in-out infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="900" height="220" rx="14" fill="url(#ftBg)" />
  <rect width="900" height="220" rx="14" fill="url(#ftGrid)" />
  <rect width="900" height="220" rx="14" fill="none" stroke="url(#ftBorder)" stroke-width="1.2" />

  <!-- Corner Brackets -->
  <path d="M 14 28 L 14 14 L 28 14" fill="none" stroke="#7F00FF" stroke-width="1.5" />
  <path d="M 886 28 L 886 14 L 872 14" fill="none" stroke="#00F2FE" stroke-width="1.5" />
  <path d="M 14 192 L 14 206 L 28 206" fill="none" stroke="#00F5A0" stroke-width="1.5" />
  <path d="M 886 192 L 886 206 L 872 206" fill="none" stroke="#00F2FE" stroke-width="1.5" />

  <!-- Ambient Light Orbs -->
  <circle cx="160" cy="110" r="100" fill="#7F00FF" opacity="0.08" filter="url(#ftGlow)" />
  <circle cx="700" cy="110" r="100" fill="#00F2FE" opacity="0.06" filter="url(#ftGlow)" />

  <!-- Left Content Block -->
  <g transform="translate(42, 38)">
    <!-- Eyebrow -->
    <text x="0" y="10" fill="#64748b" font-size="9.5" font-weight="700" letter-spacing="2" class="mono">// DECOY // CLOSING TRANSMISSION</text>

    <!-- Main Title -->
    <text x="0" y="44" fill="url(#ftTitleGrad)" font-size="28" font-weight="900" letter-spacing="1.5" class="sans sig-glow">BUILDING THE UNREASONABLE.</text>

    <!-- Subtitle -->
    <text x="0" y="70" fill="#94a3b8" font-size="12" font-weight="400" class="sans">Crafting high-leverage sovereign systems, agentic architectures &amp; resilient foundations.</text>

    <!-- Pulse ECG Heartbeat Trace -->
    <g transform="translate(0, 105)">
      <line x1="0" y1="0" x2="480" y2="0" stroke="#16253d" stroke-width="1" />
      <path d="M 0 0 L 140 0 L 155 -12 L 165 14 L 175 -8 L 185 4 L 195 0 L 480 0" fill="none" stroke="url(#ecgGrad)" stroke-width="1.8" class="ecg-line" />
      <circle cx="165" cy="14" r="2.5" fill="#00F5A0" />
    </g>

    <!-- Micro Readout -->
    <g transform="translate(0, 126)">
      <circle cx="4" cy="5" r="3" fill="#00F5A0" />
      <text x="14" y="9" fill="#64748b" font-size="9" font-weight="600" class="mono">NEW DELHI CLUSTER (28.6139° N, 77.2090° E) // SOVEREIGN ENGINE</text>
    </g>
  </g>

  <!-- Right Dispatch / Telemetry Console -->
  <g transform="translate(560, 36)">
    <rect width="300" height="148" rx="8" fill="#070c17" stroke="#1b2a44" stroke-width="1" />
    
    <!-- Console Header -->
    <g transform="translate(16, 20)">
      <circle cx="4" cy="5" r="4" fill="#00F5A0" class="status-led" filter="url(#ftGlow)" />
      <text x="16" y="9" fill="#00F5A0" font-size="10" font-weight="700" letter-spacing="1" class="mono">STATUS: ACTIVE // DEPLOYED</text>
    </g>

    <!-- Divider Line -->
    <line x1="16" y1="36" x2="284" y2="36" stroke="#16253d" stroke-width="1" />

    <!-- Details List -->
    <g transform="translate(16, 52)">
      <!-- Item 1: Secure Dispatch -->
      <text x="0" y="10" fill="#64748b" font-size="8.5" font-weight="600" class="mono">SECURE DISPATCH:</text>
      <text x="0" y="24" fill="#00F2FE" font-size="11" font-weight="700" class="mono">lawflow.india@gmail.com</text>

      <!-- Item 2: Organization -->
      <text x="0" y="46" fill="#64748b" font-size="8.5" font-weight="600" class="mono">ORGANIZATION / LAB:</text>
      <text x="0" y="60" fill="#c084fc" font-size="11" font-weight="700" class="mono">XolverLabs</text>

      <!-- Item 3: Direct Connect -->
      <text x="165" y="46" fill="#64748b" font-size="8.5" font-weight="600" class="mono">GITHUB PROTOCOL:</text>
      <text x="165" y="60" fill="#e2e8f0" font-size="11" font-weight="700" class="mono">DecoyINDIA</text>
    </g>

    <!-- Bottom Status Bar in Console -->
    <rect x="0" y="126" width="300" height="22" rx="0 0 8 8" fill="#0c1527" />
    <text x="150" y="141" fill="#475569" font-size="8.5" font-weight="600" text-anchor="middle" letter-spacing="1" class="mono">CORE RUNTIME: 2026 // ALL RIGHTS RESERVED</text>
  </g>
</svg>
