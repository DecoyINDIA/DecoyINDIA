<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 120" width="920" height="120" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="ftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0F" />
      <stop offset="100%" stop-color="#06070B" />
    </linearGradient>
    <pattern id="ftGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#141824" stroke-width="0.75" />
    </pattern>
  </defs>
  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', 'Inter', sans-serif; }
    @keyframes ftPulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .ft-glow { animation: ftPulse 3s ease-in-out infinite; }
  </style>

  <rect width="920" height="120" rx="8" fill="url(#ftBg)" />
  <rect width="920" height="120" rx="8" fill="url(#ftGrid)" />
  <rect width="920" height="120" rx="8" fill="none" stroke="#1D2334" stroke-width="1.2" />

  <!-- Corner Precision Crosshairs -->
  <g stroke="#3A4460" stroke-width="1" opacity="0.6">
    <path d="M 10 14 L 18 14 M 14 10 L 14 18" />
    <path d="M 902 14 L 910 14 M 906 10 L 906 18" />
    <path d="M 10 106 L 18 106 M 14 102 L 14 110" />
    <path d="M 902 106 L 910 106 M 906 102 L 906 110" />
  </g>

  <!-- Center Signature Statement -->
  <g transform="translate(460, 50)" text-anchor="middle">
    <!-- Breathing Phosphor Reticle -->
    <circle cx="0" cy="-14" r="3" fill="#FF5522" class="ft-glow" />
    <circle cx="0" cy="-14" r="8" fill="none" stroke="#FF5522" stroke-width="0.8" opacity="0.4" />

    <text x="0" y="12" fill="#F8FAFC" font-size="14" font-weight="700" letter-spacing="2" class="sans">
      BUILT AS DETERMINISTIC INSTRUMENTS
    </text>
    <text x="0" y="32" fill="#64748B" font-size="9.5" font-weight="500" letter-spacing="1.5" class="mono">
      XOLVERLABS // SUBHAM JENA (DECOYINDIA) // CRAFTED IN INDIA FOR THE WORLD
    </text>
  </g>
</svg>