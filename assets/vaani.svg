<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" width="440" height="200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Base Canvas -->
    <linearGradient id="vaaniBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080512" />
      <stop offset="55%" stop-color="#140924" />
      <stop offset="100%" stop-color="#05030c" />
    </linearGradient>

    <!-- 1px Specular Border -->
    <linearGradient id="vaaniGlassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="30%" stop-color="#E100FF" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#7F00FF" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#25D366" stop-opacity="0.5" />
    </linearGradient>

    <!-- Border Comet Gradient -->
    <linearGradient id="vaaniComet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F00FF" stop-opacity="0" />
      <stop offset="60%" stop-color="#E100FF" stop-opacity="0.85" />
      <stop offset="90%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#25D366" stop-opacity="0" />
    </linearGradient>

    <!-- Liquid Mercury Wave Gradient -->
    <linearGradient id="vaaniMercury" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#E100FF" />
      <stop offset="70%" stop-color="#7F00FF" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <pattern id="vaaniGrid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#221138" stroke-width="0.5" stroke-opacity="0.5" />
      <circle cx="0" cy="0" r="0.7" fill="#E100FF" fill-opacity="0.3" />
    </pattern>

    <!-- Liquid Glass Specular Filter -->
    <filter id="glassRefractVn" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur" />
      <feSpecularLighting in="blur" surfaceScale="2.5" specularConstant="1.5" specularExponent="24" lighting-color="#ffffff" result="specular">
        <feDistantLight azimuth="225" elevation="50" />
      </feSpecularLighting>
      <feComposite in="SourceGraphic" in2="specular" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" />
    </filter>

    <filter id="softGlowVn" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    @keyframes vnCometRun {
      0% { stroke-dashoffset: 1240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes waveBar1 { 0%, 100% { height: 14px; y: -7px; } 50% { height: 46px; y: -23px; } }
    @keyframes waveBar2 { 0%, 100% { height: 28px; y: -14px; } 50% { height: 62px; y: -31px; } }
    @keyframes waveBar3 { 0%, 100% { height: 44px; y: -22px; } 50% { height: 20px; y: -10px; } }
    @keyframes waveBar4 { 0%, 100% { height: 56px; y: -28px; } 50% { height: 34px; y: -17px; } }
    @keyframes waveBar5 { 0%, 100% { height: 32px; y: -16px; } 50% { height: 68px; y: -34px; } }

    .card-comet-vn {
      stroke-dasharray: 80 1160;
      animation: vnCometRun 5.8s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
    }
    .wb-1 { animation: waveBar1 1.4s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .wb-2 { animation: waveBar2 1.7s cubic-bezier(0.16, 1, 0.3, 1) infinite 0.2s; }
    .wb-3 { animation: waveBar3 1.3s cubic-bezier(0.16, 1, 0.3, 1) infinite 0.4s; }
    .wb-4 { animation: waveBar4 1.8s cubic-bezier(0.16, 1, 0.3, 1) infinite 0.1s; }
    .wb-5 { animation: waveBar5 1.5s cubic-bezier(0.16, 1, 0.3, 1) infinite 0.3s; }
  </style>

  <!-- Background Canvas -->
  <rect width="440" height="200" rx="12" fill="url(#vaaniBg2)" />
  <rect width="440" height="200" rx="12" fill="url(#vaaniGrid2)" />
  <rect width="440" height="200" rx="12" fill="none" stroke="url(#vaaniGlassBorder)" stroke-width="1.2" />

  <!-- React-Bits Border Comet -->
  <rect width="440" height="200" rx="12" fill="none" stroke="url(#vaaniComet)" stroke-width="2" class="card-comet-vn" />

  <!-- Corner Brackets -->
  <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8" />
  <path d="M 428 24 L 428 12 L 416 12" fill="none" stroke="#25D366" stroke-width="1.5" />
  <path d="M 12 176 L 12 188 L 24 188" fill="none" stroke="#7F00FF" stroke-width="1.5" />
  <path d="M 428 176 L 428 188 L 416 188" fill="none" stroke="#E100FF" stroke-width="1.5" />

  <!-- Ambient Light Spotlight -->
  <circle cx="345" cy="78" r="70" fill="#7F00FF" opacity="0.12" filter="url(#softGlowVn)" />

  <!-- Left Header and Info -->
  <g transform="translate(24, 26)">
    <!-- Glass Category Pill -->
    <rect width="148" height="22" rx="6" fill="#1b0a2e" fill-opacity="0.85" stroke="url(#vaaniGlassBorder)" stroke-width="0.9" filter="url(#glassRefractVn)" />
    <path d="M 6 2 L 142 2" stroke="#ffffff" stroke-opacity="0.4" stroke-width="0.6" stroke-linecap="round" />
    <text x="74" y="15" fill="#E100FF" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1" class="mono">VOICE // AGENTIC AI</text>

    <!-- Title with Specular Lighting -->
    <text x="0" y="52" fill="#ffffff" font-size="24" font-weight="900" letter-spacing="0.5" class="sans" filter="url(#glassRefractVn)">Vaani</text>
    <text x="76" y="50" fill="#64748b" font-size="11" font-weight="600" class="mono">वाणी // v1.2</text>

    <!-- Description -->
    <text x="0" y="73" fill="#94a3b8" font-size="11.5" font-weight="400" class="sans">Conversational voice AI and WhatsApp dispatch</text>

    <!-- Clean 2-Line Frosted Glass Telemetry Box (Zero Overlap) -->
    <g transform="translate(0, 92)">
      <rect width="210" height="48" rx="7" fill="#0d081e" fill-opacity="0.8" stroke="url(#vaaniGlassBorder)" stroke-width="0.9" filter="url(#glassRefractVn)" />
      <path d="M 6 2 L 204 2" stroke="#ffffff" stroke-opacity="0.3" stroke-width="0.6" stroke-linecap="round" />
      
      <!-- Line 1: Label -->
      <text x="12" y="18" fill="#64748b" font-size="8.5" font-weight="600" letter-spacing="0.8" class="mono">PIPELINE LATENCY // INDIC</text>
      
      <!-- Line 2: Value + Inline Secondary Tag -->
      <text x="12" y="38" fill="#25D366" font-size="13" font-weight="700" class="mono">140ms</text>
      <text x="70" y="38" fill="#c084fc" font-size="9.5" font-weight="600" class="mono">| 12 INDIC LANGS</text>
    </g>
  </g>

  <!-- Right Visual: Holographic Acoustic Orb and Fluid Mercury Waves (Pure Native Expansions) -->
  <g transform="translate(345, 78)">
    <!-- Expanding Mercury Ripple Rings (Native Radius and Opacity - Zero Orbit Drift) -->
    <circle cx="0" cy="0" r="16" fill="none" stroke="#25D366" stroke-width="1.2">
      <animate attributeName="r" values="16; 52" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9; 0" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#E100FF" stroke-width="1">
      <animate attributeName="r" values="16; 52" begin="1.4s" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9; 0" begin="1.4s" dur="2.8s" repeatCount="indefinite" />
    </circle>

    <!-- Multi-Frequency Waveform Bars (Mirrored vertically) -->
    <g transform="translate(-50, 0)">
      <rect x="0" y="-10" width="4" height="20" rx="2" fill="url(#vaaniMercury)" class="wb-1" />
      <rect x="8" y="-16" width="4" height="32" rx="2" fill="url(#vaaniMercury)" class="wb-2" />
      <rect x="16" y="-24" width="4" height="48" rx="2" fill="url(#vaaniMercury)" class="wb-3" />
      <rect x="24" y="-32" width="4" height="64" rx="2" fill="url(#vaaniMercury)" class="wb-4" />
      <rect x="32" y="-22" width="4" height="44" rx="2" fill="url(#vaaniMercury)" class="wb-5" />

      <!-- Center Holographic Acoustic Glass Orb -->
      <g filter="url(#glassRefractVn)">
        <circle cx="50" cy="0" r="16" fill="#14092b" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.4" />
        <circle cx="50" cy="0" r="14" fill="#1a0b38" stroke="#E100FF" stroke-width="1.2" />
        <path d="M 47 -4 L 53 -4 C 55 -4 55 -1 53 -1 L 47 -1 Z M 50 -1 L 50 4 M 47 4 L 53 4" stroke="#25D366" stroke-width="1.5" stroke-linecap="round" />
      </g>

      <rect x="64" y="-22" width="4" height="44" rx="2" fill="url(#vaaniMercury)" class="wb-5" />
      <rect x="72" y="-32" width="4" height="64" rx="2" fill="url(#vaaniMercury)" class="wb-4" />
      <rect x="80" y="-24" width="4" height="48" rx="2" fill="url(#vaaniMercury)" class="wb-3" />
      <rect x="88" y="-16" width="4" height="32" rx="2" fill="url(#vaaniMercury)" class="wb-2" />
      <rect x="96" y="-10" width="4" height="20" rx="2" fill="url(#vaaniMercury)" class="wb-1" />
    </g>

    <!-- Indic Dialect Frosted Badges -->
    <g transform="translate(-56, 48)">
      <rect width="34" height="15" rx="4" fill="#1a0c32" fill-opacity="0.8" stroke="url(#vaaniGlassBorder)" stroke-width="0.8" />
      <text x="17" y="11" fill="#c084fc" font-size="8.5" font-weight="700" text-anchor="middle" class="mono">हिन्दी</text>
    </g>
    <g transform="translate(-16, 48)">
      <rect width="34" height="15" rx="4" fill="#0d2419" fill-opacity="0.8" stroke="url(#vaaniGlassBorder)" stroke-width="0.8" />
      <text x="17" y="11" fill="#25D366" font-size="8.5" font-weight="700" text-anchor="middle" class="mono">தமிழ்</text>
    </g>
    <g transform="translate(24, 48)">
      <rect width="34" height="15" rx="4" fill="#1a0c32" fill-opacity="0.8" stroke="url(#vaaniGlassBorder)" stroke-width="0.8" />
      <text x="17" y="11" fill="#E100FF" font-size="8.5" font-weight="700" text-anchor="middle" class="mono">ENG</text>
    </g>
  </g>

  <!-- Bottom Tag Bar -->
  <g transform="translate(24, 172)">
    <circle cx="4" cy="5" r="3" fill="#25D366" />
    <text x="14" y="8" fill="#64748b" font-size="9" font-weight="600" class="mono">DISPATCH: WHATSAPP CLOUD API</text>
    <text x="210" y="8" fill="#64748b" font-size="9" font-weight="600" class="mono">STREAMING WEBSOCKET</text>
  </g>
</svg>
