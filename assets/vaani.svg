<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" width="440" height="200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="vaaniBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090614" />
      <stop offset="50%" stop-color="#120A20" />
      <stop offset="100%" stop-color="#06040F" />
    </linearGradient>

    <!-- 1px Hairline Border -->
    <linearGradient id="vaaniBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F00FF" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#E100FF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#25D366" stop-opacity="0.4" />
    </linearGradient>

    <!-- Waveform Frequency Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7F00FF" />
      <stop offset="50%" stop-color="#E100FF" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <!-- Precision Dot Grid -->
    <pattern id="vaaniGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#1E1430" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Background Surface -->
  <rect width="440" height="200" rx="12" fill="url(#vaaniBg)" />
  <rect width="440" height="200" rx="12" fill="url(#vaaniGrid)" />
  <rect width="440" height="200" rx="12" fill="none" stroke="url(#vaaniBorder)" stroke-width="1.2" />

  <!-- Corner Brackets -->
  <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#E100FF" stroke-width="1.5" />
  <path d="M 428 24 L 428 12 L 416 12" fill="none" stroke="#25D366" stroke-width="1.5" />
  <path d="M 12 176 L 12 188 L 24 188" fill="none" stroke="#7F00FF" stroke-width="1.5" />
  <path d="M 428 176 L 428 188 L 416 188" fill="none" stroke="#E100FF" stroke-width="1.5" />

  <!-- Left Header and Info -->
  <g transform="translate(24, 28)">
    <!-- Category Pill -->
    <rect width="144" height="20" rx="4" fill="#1C0D2E" stroke="#4C1D95" stroke-width="1" />
    <text x="72" y="14" fill="#E100FF" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1" class="mono">VOICE // AGENTIC AI</text>

    <!-- Title -->
    <text x="0" y="48" fill="#FFFFFF" font-size="22" font-weight="800" letter-spacing="0.5" class="sans">Vaani</text>
    <text x="74" y="47" fill="#64748B" font-size="11" font-weight="600" class="mono">वाणी // v1.2</text>

    <!-- Description -->
    <text x="0" y="68" fill="#94A3B8" font-size="11.5" font-weight="400" class="sans">Conversational voice AI and WhatsApp dispatch</text>

    <!-- Clean 2-Line Telemetry Box (Zero Overlap) -->
    <g transform="translate(0, 88)">
      <rect width="210" height="46" rx="6" fill="#0E081A" stroke="#281740" stroke-width="1" />
      <text x="12" y="17" fill="#64748B" font-size="8.5" font-weight="600" letter-spacing="0.8" class="mono">PIPELINE LATENCY // INDIC</text>
      <text x="12" y="35" fill="#25D366" font-size="13" font-weight="700" class="mono">140ms</text>
      <text x="70" y="35" fill="#C084FC" font-size="9.5" font-weight="600" class="mono">| 12 INDIC LANGS</text>
    </g>
  </g>

  <!-- Right Visual: Voice Waveforms and Acoustic Dispatch Node (Pure Vector) -->
  <g transform="translate(345, 78)">
    <!-- Expanding Mercury Ripple Rings (Native Concentric Radii) -->
    <circle cx="0" cy="0" r="16" fill="none" stroke="#25D366" stroke-width="1.2">
      <animate attributeName="r" values="16; 50" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8; 0" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#E100FF" stroke-width="1">
      <animate attributeName="r" values="16; 50" begin="1.2s" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8; 0" begin="1.2s" dur="2.4s" repeatCount="indefinite" />
    </circle>

    <!-- Waveform Frequency Bars (Symmetric, Native Attribute Animation) -->
    <g transform="translate(-50, 0)">
      <!-- Left Bars -->
      <rect x="0" y="-8" width="4" height="16" rx="2" fill="url(#waveGrad)">
        <animate attributeName="height" values="14; 36; 14" dur="1.2s" repeatCount="indefinite" />
        <animate attributeName="y" values="-7; -18; -7" dur="1.2s" repeatCount="indefinite" />
      </rect>
      <rect x="8" y="-14" width="4" height="28" rx="2" fill="url(#waveGrad)">
        <animate attributeName="height" values="24; 52; 24" dur="1.5s" repeatCount="indefinite" />
        <animate attributeName="y" values="-12; -26; -12" dur="1.5s" repeatCount="indefinite" />
      </rect>
      <rect x="16" y="-20" width="4" height="40" rx="2" fill="url(#waveGrad)">
        <animate attributeName="height" values="36; 18; 36" dur="1.3s" repeatCount="indefinite" />
        <animate attributeName="y" values="-18; -9; -18" dur="1.3s" repeatCount="indefinite" />
      </rect>
      <rect x="24" y="-26" width="4" height="52" rx="2" fill="url(#waveGrad)">
        <animate attributeName="height" values="48; 30; 48" dur="1.6s" repeatCount="indefinite" />
        <animate attributeName="y" values="-24; -15; -24" dur="1.6s" repeatCount="indefinite" />
      </rect>
      <rect x="32" y="-18" width="4" height="36" rx="2" fill="url(#waveGrad)">
        <animate attributeName="height" values="28; 56; 28" dur="1.4s" repeatCount="indefinite" />
        <animate attributeName="y" values="-14; -28; -14" dur="1.4s" repeatCount="indefinite" />
      </rect>

      <!-- Center Acoustic Core Hub -->
      <circle cx="50" cy="0" r="16" fill="#140924" stroke="#E100FF" stroke-width="1.8" />
      <!-- Mic Icon -->
      <path d="M 47 -4 L 53 -4 C 55 -4 55 -1 53 -1 L 47 -1 Z M 50 -1 L 50 4 M 47 4 L 53 4" stroke="#25D366" stroke-width="1.5" stroke-linecap="round" />

      <!-- Right Bars -->
      <rect x="64" y="-18" width="4" height="36" rx="2" fill="url(#waveGrad)">
        <animate attributeName="height" values="28; 56; 28" dur="1.4s" repeatCount="indefinite" />
        <animate attributeName="y" values="-14; -28; -14" dur="1.4s" repeatCount="indefinite" />
      </rect>
      <rect x="72" y="-26" width="4" height="52" rx="2" fill="url(#waveGrad)">
        <animate attributeName="height" values="48; 30; 48" dur="1.6s" repeatCount="indefinite" />
        <animate attributeName="y" values="-24; -15; -24" dur="1.6s" repeatCount="indefinite" />
      </rect>
      <rect x="80" y="-20" width="4" height="40" rx="2" fill="url(#waveGrad)">
        <animate attributeName="height" values="36; 18; 36" dur="1.3s" repeatCount="indefinite" />
        <animate attributeName="y" values="-18; -9; -18" dur="1.3s" repeatCount="indefinite" />
      </rect>
      <rect x="88" y="-14" width="4" height="28" rx="2" fill="url(#waveGrad)">
        <animate attributeName="height" values="24; 52; 24" dur="1.5s" repeatCount="indefinite" />
        <animate attributeName="y" values="-12; -26; -12" dur="1.5s" repeatCount="indefinite" />
      </rect>
      <rect x="96" y="-8" width="4" height="16" rx="2" fill="url(#waveGrad)">
        <animate attributeName="height" values="14; 36; 14" dur="1.2s" repeatCount="indefinite" />
        <animate attributeName="y" values="-7; -18; -7" dur="1.2s" repeatCount="indefinite" />
      </rect>
    </g>

    <!-- Indic Dialect Badges -->
    <g transform="translate(-56, 46)">
      <rect width="34" height="16" rx="3" fill="#140924" stroke="#4C1D95" stroke-width="0.8" />
      <text x="17" y="11.5" fill="#C084FC" font-size="8.5" font-weight="700" text-anchor="middle" class="mono">हिन्दी</text>
    </g>
    <g transform="translate(-16, 46)">
      <rect width="34" height="16" rx="3" fill="#0C1B14" stroke="#165B3B" stroke-width="0.8" />
      <text x="17" y="11.5" fill="#25D366" font-size="8.5" font-weight="700" text-anchor="middle" class="mono">தமிழ்</text>
    </g>
    <g transform="translate(24, 46)">
      <rect width="34" height="16" rx="3" fill="#140924" stroke="#4C1D95" stroke-width="0.8" />
      <text x="17" y="11.5" fill="#E100FF" font-size="8.5" font-weight="700" text-anchor="middle" class="mono">ENG</text>
    </g>
  </g>

  <!-- Bottom Tag Bar -->
  <g transform="translate(24, 172)">
    <circle cx="4" cy="5" r="3" fill="#25D366" />
    <text x="14" y="8" fill="#64748B" font-size="9" font-weight="600" class="mono">DISPATCH: WHATSAPP CLOUD API</text>
    <text x="210" y="8" fill="#64748B" font-size="9" font-weight="600" class="mono">STREAMING WEBSOCKET</text>
  </g>
</svg>
