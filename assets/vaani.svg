<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" width="440" height="220" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="vBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B10" />
      <stop offset="100%" stop-color="#0D1018" />
    </linearGradient>
    <linearGradient id="vAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5522" />
      <stop offset="100%" stop-color="#FFAA33" />
    </linearGradient>
    <pattern id="vGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#141824" stroke-width="0.75" />
    </pattern>
  </defs>
  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', 'Inter', sans-serif; }
    @keyframes barDance {
      0%, 100% { height: 12px; y: 114px; }
      50% { height: 38px; y: 88px; }
    }
    @keyframes pulseGate {
      0%, 100% { stroke-opacity: 0.3; }
      50% { stroke-opacity: 1; }
    }
    .bar-1 { animation: barDance 1.6s ease-in-out infinite; }
    .bar-2 { animation: barDance 2.1s ease-in-out infinite 0.2s; }
    .bar-3 { animation: barDance 1.8s ease-in-out infinite 0.4s; }
    .bar-4 { animation: barDance 2.4s ease-in-out infinite 0.1s; }
    .gate-line { animation: pulseGate 3s ease-in-out infinite; }
  </style>

  <rect width="440" height="220" rx="8" fill="url(#vBg)" />
  <rect width="440" height="220" rx="8" fill="url(#vGrid)" />
  <rect width="440" height="220" rx="8" fill="none" stroke="#1E2435" stroke-width="1.2" />

  <!-- Header Section -->
  <g transform="translate(24, 28)">
    <circle cx="4" cy="4" r="3.5" fill="#FF5522" />
    <text x="14" y="8" fill="#94A3B8" font-size="9" font-weight="600" letter-spacing="1.5" class="mono">SYSTEM // 01 · VOICE &amp; TELEPHONY</text>
    <text x="0" y="32" fill="#F8FAFC" font-size="18" font-weight="700" letter-spacing="-0.3" class="sans">Vaani</text>
    <text x="58" y="32" fill="#FF5522" font-size="11" font-weight="600" letter-spacing="1" class="mono">[INDIC FRONT DESK]</text>
  </g>

  <!-- Vernacular Waveform & Spectrogram Deck -->
  <g transform="translate(24, 80)">
    <!-- Channel Label -->
    <text x="0" y="0" fill="#64748B" font-size="8.5" font-weight="600" letter-spacing="1.2" class="mono">INDIC SPEECH DUAL-GATE PIPELINE</text>
    <text x="260" y="0" fill="#38BDF8" font-size="8.5" font-weight="600" letter-spacing="0.8" class="mono">&lt; 3.0s DISPATCH</text>

    <!-- Waveform Frequency Bars (Multi-lingual STT simulation) -->
    <g transform="translate(0, 16)">
      <!-- Channel 1: Hindi -->
      <rect x="0" y="10" width="3" height="20" rx="1.5" fill="#FF5522" opacity="0.8" class="bar-1" />
      <rect x="7" y="6" width="3" height="28" rx="1.5" fill="#FF5522" opacity="0.8" class="bar-3" />
      <rect x="14" y="12" width="3" height="16" rx="1.5" fill="#FF5522" opacity="0.8" class="bar-2" />
      <rect x="21" y="2" width="3" height="36" rx="1.5" fill="#FFAA33" class="bar-4" />
      <rect x="28" y="8" width="3" height="24" rx="1.5" fill="#FF5522" opacity="0.8" class="bar-1" />
      <rect x="35" y="14" width="3" height="12" rx="1.5" fill="#FF5522" opacity="0.6" class="bar-2" />

      <!-- Channel 2: Odia -->
      <rect x="48" y="8" width="3" height="24" rx="1.5" fill="#38BDF8" opacity="0.8" class="bar-3" />
      <rect x="55" y="4" width="3" height="32" rx="1.5" fill="#38BDF8" class="bar-4" />
      <rect x="62" y="12" width="3" height="16" rx="1.5" fill="#38BDF8" opacity="0.8" class="bar-1" />
      <rect x="69" y="6" width="3" height="28" rx="1.5" fill="#38BDF8" class="bar-2" />

      <!-- Channel 3: Hinglish -->
      <rect x="82" y="10" width="3" height="20" rx="1.5" fill="#10B981" opacity="0.8" class="bar-2" />
      <rect x="89" y="2" width="3" height="36" rx="1.5" fill="#10B981" class="bar-1" />
      <rect x="96" y="8" width="3" height="24" rx="1.5" fill="#10B981" opacity="0.8" class="bar-4" />
      <rect x="103" y="14" width="3" height="12" rx="1.5" fill="#10B981" opacity="0.6" class="bar-3" />
    </g>

    <!-- State Machine Gate Diagram (LangGraph DAG) -->
    <g transform="translate(136, 12)">
      <!-- Node A: Intent Classify -->
      <rect x="0" y="6" width="68" height="28" rx="4" fill="#111522" stroke="#252D42" stroke-width="1" />
      <text x="34" y="23" fill="#E2E8F0" font-size="8.5" font-weight="600" text-anchor="middle" class="mono">SCOPE GATE</text>

      <!-- Connecting Wire -->
      <line x1="68" y1="20" x2="94" y2="20" stroke="#FF5522" stroke-width="1.2" stroke-dasharray="3 3" class="gate-line" />

      <!-- Node B: Grounded RAG -->
      <rect x="94" y="6" width="74" height="28" rx="4" fill="#111522" stroke="#252D42" stroke-width="1" />
      <text x="131" y="23" fill="#E2E8F0" font-size="8.5" font-weight="600" text-anchor="middle" class="mono">TENANT RAG</text>

      <!-- Connecting Wire -->
      <line x1="168" y1="20" x2="194" y2="20" stroke="#10B981" stroke-width="1.2" stroke-dasharray="3 3" class="gate-line" />

      <!-- Node C: Atomic Booking -->
      <rect x="194" y="6" width="62" height="28" rx="4" fill="#111522" stroke="#10B981" stroke-width="1" />
      <text x="225" y="23" fill="#10B981" font-size="8.5" font-weight="600" text-anchor="middle" class="mono">ATOMIC</text>
    </g>
  </g>

  <!-- Technical Spec Footer -->
  <g transform="translate(24, 180)">
    <line x1="0" y1="0" x2="392" y2="0" stroke="#1B2130" stroke-width="1" />
    <text x="0" y="18" fill="#64748B" font-size="8.5" font-weight="500" class="mono">
      Python 3.12 · LangGraph · FastAPI · MongoDB 7 Replica · Redis · DPDP Act 2025
    </text>
  </g>
</svg>