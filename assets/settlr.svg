<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" width="440" height="200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="settlrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060b13" />
      <stop offset="60%" stop-color="#0a1526" />
      <stop offset="100%" stop-color="#04070d" />
    </linearGradient>

    <linearGradient id="settlrBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00F5A0" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="ringGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <pattern id="settlrGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#12253d" stroke-width="0.5" stroke-opacity="0.6" />
    </pattern>

    <filter id="settlrGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    @keyframes rotateClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes rotateCounter {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes sigPulse {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.08); }
    }

    .ring-cw { animation: rotateClockwise 18s linear infinite; transform-origin: 340px 75px; }
    .ring-ccw { animation: rotateCounter 14s linear infinite; transform-origin: 340px 75px; }
    .sig-lock { animation: sigPulse 2.5s ease-in-out infinite; transform-origin: 340px 75px; }
  </style>

  <!-- Background Canvas -->
  <rect width="440" height="200" rx="12" fill="url(#settlrBg)" />
  <rect width="440" height="200" rx="12" fill="url(#settlrGrid)" />
  <rect width="440" height="200" rx="12" fill="none" stroke="url(#settlrBorder)" stroke-width="1.2" />

  <!-- Corner Brackets -->
  <path d="M 12 25 L 12 12 L 25 12" fill="none" stroke="#00F2FE" stroke-width="1.5" />
  <path d="M 428 25 L 428 12 L 415 12" fill="none" stroke="#00F5A0" stroke-width="1.5" />
  <path d="M 12 175 L 12 188 L 25 188" fill="none" stroke="#3B82F6" stroke-width="1.5" />
  <path d="M 428 175 L 428 188 L 415 188" fill="none" stroke="#00F2FE" stroke-width="1.5" />

  <!-- Ambient Light Orbs -->
  <circle cx="340" cy="75" r="60" fill="#00F2FE" opacity="0.08" filter="url(#settlrGlow)" />

  <!-- Left Header & Info -->
  <g transform="translate(24, 28)">
    <!-- Category Pill -->
    <rect width="144" height="20" rx="4" fill="#0b1b30" stroke="#00F2FE" stroke-width="0.8" />
    <text x="72" y="14" fill="#00F2FE" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1" class="mono">TRUST // DATA PROTOCOL</text>

    <!-- Title -->
    <text x="0" y="48" fill="#ffffff" font-size="22" font-weight="800" letter-spacing="0.5" class="sans">Settlr</text>
    <text x="66" y="47" fill="#64748b" font-size="11" font-weight="600" class="mono">v1.0-PROD</text>

    <!-- Description -->
    <text x="0" y="70" fill="#94a3b8" font-size="11.5" font-weight="400" class="sans">Ownership-gated rental trust ledger &amp; dual-sig</text>

    <!-- Telemetry Box -->
    <g transform="translate(0, 92)">
      <rect width="210" height="48" rx="6" fill="#071220" stroke="#173152" stroke-width="1" />
      
      <text x="10" y="16" fill="#64748b" font-size="8.5" font-weight="600" letter-spacing="0.8" class="mono">CONSENSUS VERIFICATION</text>
      <!-- Dual consent badges -->
      <g transform="translate(10, 22)">
        <rect width="66" height="18" rx="3" fill="#0d243b" stroke="#00F2FE" stroke-width="0.7" />
        <text x="33" y="12" fill="#00F2FE" font-size="8" font-weight="700" text-anchor="middle" class="mono">OWNER: ✓</text>
      </g>
      <g transform="translate(82, 22)">
        <rect width="70" height="18" rx="3" fill="#0d2e26" stroke="#00F5A0" stroke-width="0.7" />
        <text x="35" y="12" fill="#00F5A0" font-size="8" font-weight="700" text-anchor="middle" class="mono">TENANT: ✓</text>
      </g>

      <text x="158" y="34" fill="#64748b" font-size="8" font-weight="600" class="mono">DELHI-NCR</text>
    </g>
  </g>

  <!-- Right Visual: Cryptographic Dual Rings & Ledger Shield -->
  <g transform="translate(340, 75)">
    <!-- Outer Interlocking Ring (Counter-Clockwise) -->
    <circle cx="0" cy="0" r="46" fill="none" stroke="url(#ringGrad1)" stroke-width="1.8" stroke-dasharray="24 16 8 16" class="ring-ccw" />
    
    <!-- Inner Interlocking Ring (Clockwise) -->
    <circle cx="0" cy="0" r="34" fill="none" stroke="url(#ringGrad2)" stroke-width="1.5" stroke-dasharray="18 12" class="ring-cw" />

    <!-- Ledger Block Hash Points -->
    <circle cx="-34" cy="0" r="3.5" fill="#00F2FE" />
    <circle cx="34" cy="0" r="3.5" fill="#00F5A0" />
    <circle cx="0" cy="-34" r="3" fill="#3B82F6" />
    <circle cx="0" cy="34" r="3" fill="#00F2FE" />

    <!-- Central Security Shield / Lock Core -->
    <g class="sig-lock">
      <polygon points="0,-18 16,-8 16,8 0,18 -16,8 -16,-8" fill="#081426" stroke="#00F2FE" stroke-width="1.5" filter="url(#settlrGlow)" />
      <!-- Cryptographic Lock Icon -->
      <path d="M -5 -3 L -5 -6 C -5 -9 5 -9 5 -6 L 5 -3 M -7 -3 L 7 -3 L 7 6 L -7 6 Z" fill="none" stroke="#00F5A0" stroke-width="1.3" />
      <circle cx="0" cy="1.5" r="1.2" fill="#00F5A0" />
    </g>

    <!-- Cluster Node Coordinates -->
    <text x="0" y="58" fill="#64748b" font-size="8" font-weight="600" text-anchor="middle" class="mono">BLOCK #841029 // DEL-01</text>
  </g>

  <!-- Bottom Tag Bar -->
  <g transform="translate(24, 172)">
    <circle cx="4" cy="5" r="3" fill="#00F2FE" />
    <text x="14" y="8" fill="#64748b" font-size="9" font-weight="600" class="mono">HASH: SHA-256 SOVEREIGN</text>
    <text x="180" y="8" fill="#64748b" font-size="9" font-weight="600" class="mono">DUAL-CONSENT LEDGER</text>
  </g>
</svg>
