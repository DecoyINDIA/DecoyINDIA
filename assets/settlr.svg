<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" width="440" height="220" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="sBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B10" />
      <stop offset="100%" stop-color="#0E121A" />
    </linearGradient>
    <pattern id="sGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#141824" stroke-width="0.75" />
    </pattern>
  </defs>
  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', 'Inter', sans-serif; }
  </style>

  <rect width="440" height="220" rx="8" fill="url(#sBg)" />
  <rect width="440" height="220" rx="8" fill="url(#sGrid)" />
  <rect width="440" height="220" rx="8" fill="none" stroke="#1E2435" stroke-width="1.2" />

  <!-- Header Section -->
  <g transform="translate(24, 28)">
    <circle cx="4" cy="4" r="3.5" fill="#38BDF8" />
    <text x="14" y="8" fill="#94A3B8" font-size="9" font-weight="600" letter-spacing="1.5" class="mono">SYSTEM // 05 · SOVEREIGN TRUST INFRASTRUCTURE</text>
    <text x="0" y="32" fill="#F8FAFC" font-size="18" font-weight="700" letter-spacing="-0.3" class="sans">Settlr</text>
    <text x="56" y="32" fill="#38BDF8" font-size="11" font-weight="600" letter-spacing="1" class="mono">[DUAL-CONSENT LEDGER]</text>
  </g>

  <!-- Cryptographic Dual-Consent & Municipal Registry Deck -->
  <g transform="translate(24, 82)">
    <text x="0" y="0" fill="#64748B" font-size="8.5" font-weight="600" letter-spacing="1.2" class="mono">OWNERSHIP-GATED REGISTRY // DELHI PILOT</text>
    <text x="270" y="0" fill="#10B981" font-size="8.5" font-weight="600" letter-spacing="0.8" class="mono">TITLE: VERIFIED</text>

    <!-- Escrow Milestone & Cryptographic Co-Signatures Visual -->
    <g transform="translate(0, 16)">
      <!-- Landlord Signature -->
      <rect x="0" y="6" width="108" height="32" rx="4" fill="#121624" stroke="#252E46" stroke-width="1" />
      <circle cx="14" cy="22" r="4" fill="#38BDF8" />
      <text x="26" y="25" fill="#E2E8F0" font-size="8.5" font-weight="600" class="mono">OWNER SIG</text>

      <!-- Central Interlocking Escrow Lock -->
      <path d="M 108 22 L 140 22" stroke="#38BDF8" stroke-width="1.2" />
      <rect x="140" y="6" width="112" height="32" rx="4" fill="#151C2C" stroke="#38BDF8" stroke-width="1" />
      <text x="196" y="25" fill="#38BDF8" font-size="9" font-weight="600" text-anchor="middle" class="mono">ESCROW LOCK</text>
      <path d="M 252 22 L 284 22" stroke="#10B981" stroke-width="1.2" />

      <!-- Tenant Co-Signature -->
      <rect x="284" y="6" width="108" height="32" rx="4" fill="#121624" stroke="#252E46" stroke-width="1" />
      <circle cx="298" cy="22" r="4" fill="#10B981" />
      <text x="310" y="25" fill="#E2E8F0" font-size="8.5" font-weight="600" class="mono">TENANT SIG</text>
    </g>
  </g>

  <!-- Technical Spec Footer -->
  <g transform="translate(24, 180)">
    <line x1="0" y1="0" x2="392" y2="0" stroke="#1B2130" stroke-width="1" />
    <text x="0" y="18" fill="#64748B" font-size="8.5" font-weight="500" class="mono">
      Python · FastAPI · PostgreSQL · Dual-Consent Cryptography · Escrow Milestones
    </text>
  </g>
</svg>