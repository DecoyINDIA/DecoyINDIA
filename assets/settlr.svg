<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" width="440" height="200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="settlrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="50%" stop-color="#0A1120" />
      <stop offset="100%" stop-color="#05080E" />
    </linearGradient>

    <!-- 1px Hairline Border -->
    <linearGradient id="settlrBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00F5A0" stop-opacity="0.4" />
    </linearGradient>

    <!-- Vault Ring Gradients -->
    <linearGradient id="ring1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="ring2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <!-- Precision Dot Grid -->
    <pattern id="settlrGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#142135" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Background Surface -->
  <rect width="440" height="200" rx="12" fill="url(#settlrBg)" />
  <rect width="440" height="200" rx="12" fill="url(#settlrGrid)" />
  <rect width="440" height="200" rx="12" fill="none" stroke="url(#settlrBorder)" stroke-width="1.2" />

  <!-- Corner Brackets -->
  <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#00F2FE" stroke-width="1.5" />
  <path d="M 428 24 L 428 12 L 416 12" fill="none" stroke="#00F5A0" stroke-width="1.5" />
  <path d="M 12 176 L 12 188 L 24 188" fill="none" stroke="#3B82F6" stroke-width="1.5" />
  <path d="M 428 176 L 428 188 L 416 188" fill="none" stroke="#00F2FE" stroke-width="1.5" />

  <!-- Left Header and Info -->
  <g transform="translate(24, 28)">
    <!-- Category Pill -->
    <rect width="144" height="20" rx="4" fill="#0C1B2E" stroke="#1D4ED8" stroke-width="1" />
    <text x="72" y="14" fill="#00F2FE" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1" class="mono">TRUST // DATA PROTOCOL</text>

    <!-- Title -->
    <text x="0" y="48" fill="#FFFFFF" font-size="22" font-weight="800" letter-spacing="0.5" class="sans">Settlr</text>
    <text x="68" y="47" fill="#64748B" font-size="11" font-weight="600" class="mono">v1.0-PROD</text>

    <!-- Description -->
    <text x="0" y="68" fill="#94A3B8" font-size="11.5" font-weight="400" class="sans">Ownership-gated rental trust ledger and dual-sig</text>

    <!-- Clean 2-Line Telemetry Box (Zero Overlap) -->
    <g transform="translate(0, 88)">
      <rect width="210" height="46" rx="6" fill="#0A111E" stroke="#1E2A3E" stroke-width="1" />
      <text x="12" y="17" fill="#64748B" font-size="8.5" font-weight="600" letter-spacing="0.8" class="mono">CONSENSUS VERIFICATION</text>
      <!-- Dual consent indicators -->
      <g transform="translate(12, 23)">
        <rect width="64" height="16" rx="3" fill="#0C2035" stroke="#00F2FE" stroke-width="0.8" />
        <text x="32" y="11.5" fill="#00F2FE" font-size="8" font-weight="700" text-anchor="middle" class="mono">OWNER: ✓</text>
      </g>
      <g transform="translate(80, 23)">
        <rect width="68" height="16" rx="3" fill="#0C241E" stroke="#00F5A0" stroke-width="0.8" />
        <text x="34" y="11.5" fill="#00F5A0" font-size="8" font-weight="700" text-anchor="middle" class="mono">TENANT: ✓</text>
      </g>
      <text x="156" y="34.5" fill="#64748B" font-size="8.5" font-weight="600" class="mono">DEL-01</text>
    </g>
  </g>

  <!-- Right Visual: Cryptographic Vault and Precision Rings (Native SVG Rotation - Zero Orbit Bug) -->
  <g transform="translate(345, 75)">
    <!-- Outer Ring CCW -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="14s" repeatCount="indefinite" />
      <circle cx="0" cy="0" r="46" fill="none" stroke="url(#ring1)" stroke-width="1.8" stroke-dasharray="26 16 8 16" />
    </g>

    <!-- Inner Ring CW -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="11s" repeatCount="indefinite" />
      <circle cx="0" cy="0" r="34" fill="none" stroke="url(#ring2)" stroke-width="1.5" stroke-dasharray="18 12" />
    </g>

    <!-- Node Points -->
    <circle cx="-34" cy="0" r="3" fill="#00F2FE" />
    <circle cx="34" cy="0" r="3" fill="#00F5A0" />
    <circle cx="0" cy="-34" r="3" fill="#3B82F6" />
    <circle cx="0" cy="34" r="3" fill="#00F2FE" />

    <!-- Center Security Shield -->
    <g>
      <polygon points="0,-18 16,-8 16,8 0,18 -16,8 -16,-8" fill="#0A1628" stroke="#00F2FE" stroke-width="1.6" />
      <path d="M -5 -3 L -5 -6 C -5 -9 5 -9 5 -6 L 5 -3 M -7 -3 L 7 -3 L 7 6 L -7 6 Z" fill="none" stroke="#00F5A0" stroke-width="1.4" />
      <circle cx="0" cy="1.5" r="1.2" fill="#00F5A0" />
    </g>

    <!-- Cluster Node Coordinates -->
    <text x="0" y="58" fill="#64748B" font-size="8" font-weight="600" text-anchor="middle" class="mono">BLOCK #841029 // DEL-01</text>
  </g>

  <!-- Bottom Tag Bar -->
  <g transform="translate(24, 172)">
    <circle cx="4" cy="5" r="3" fill="#00F2FE" />
    <text x="14" y="8" fill="#64748B" font-size="9" font-weight="600" class="mono">HASH: SHA-256 SOVEREIGN</text>
    <text x="180" y="8" fill="#64748B" font-size="9" font-weight="600" class="mono">DUAL-CONSENT LEDGER</text>
  </g>
</svg>
