<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" width="440" height="200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bmdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120804" />
      <stop offset="60%" stop-color="#1c0e06" />
      <stop offset="100%" stop-color="#080402" />
    </linearGradient>

    <linearGradient id="bmdBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FFAE00" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5722" />
      <stop offset="50%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FFAE00" />
    </linearGradient>

    <pattern id="bmdGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2b1409" stroke-width="0.5" stroke-opacity="0.6" />
    </pattern>

    <filter id="bmdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    @keyframes chunkFlow {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes speedPulse {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
    @keyframes gearRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .chunk-stream-1 { stroke-dasharray: 8 6; animation: chunkFlow 0.8s linear infinite; }
    .chunk-stream-2 { stroke-dasharray: 6 5; animation: chunkFlow 0.6s linear infinite; }
    .chunk-stream-3 { stroke-dasharray: 10 7; animation: chunkFlow 1.0s linear infinite; }
    .chunk-stream-4 { stroke-dasharray: 5 4; animation: chunkFlow 0.7s linear infinite; }
    .rust-gear { animation: gearRotate 16s linear infinite; transform-origin: 345px 75px; }
    .speed-glow { animation: speedPulse 2s ease-in-out infinite; transform-origin: 345px 75px; }
  </style>

  <!-- Background Canvas -->
  <rect width="440" height="200" rx="12" fill="url(#bmdBg)" />
  <rect width="440" height="200" rx="12" fill="url(#bmdGrid)" />
  <rect width="440" height="200" rx="12" fill="none" stroke="url(#bmdBorder)" stroke-width="1.2" />

  <!-- Corner Brackets -->
  <path d="M 12 25 L 12 12 L 25 12" fill="none" stroke="#FF6B00" stroke-width="1.5" />
  <path d="M 428 25 L 428 12 L 415 12" fill="none" stroke="#FFAE00" stroke-width="1.5" />
  <path d="M 12 175 L 12 188 L 25 188" fill="none" stroke="#FF5722" stroke-width="1.5" />
  <path d="M 428 175 L 428 188 L 415 188" fill="none" stroke="#00F2FE" stroke-width="1.5" />

  <!-- Ambient Light Orbs -->
  <circle cx="345" cy="75" r="55" fill="#FF6B00" opacity="0.1" filter="url(#bmdGlow)" />

  <!-- Left Header & Info -->
  <g transform="translate(24, 28)">
    <!-- Category Pill -->
    <rect width="146" height="20" rx="4" fill="#2b1104" stroke="#FF6B00" stroke-width="0.8" />
    <text x="73" y="14" fill="#FFAE00" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1" class="mono">RUST // HIGH-THROUGHPUT</text>

    <!-- Title -->
    <text x="0" y="48" fill="#ffffff" font-size="22" font-weight="800" letter-spacing="0.5" class="sans">BMD</text>
    <text x="56" y="47" fill="#64748b" font-size="11" font-weight="600" class="mono">BLACK MARLIN</text>

    <!-- Description -->
    <text x="0" y="70" fill="#94a3b8" font-size="11.5" font-weight="400" class="sans">Multi-threaded chunked downloader &amp; zero-copy</text>

    <!-- Telemetry Box -->
    <g transform="translate(0, 92)">
      <rect width="210" height="48" rx="6" fill="#140a04" stroke="#3d1d0c" stroke-width="1" />
      
      <text x="10" y="16" fill="#64748b" font-size="8.5" font-weight="600" letter-spacing="0.8" class="mono">TRANSFER BANDWIDTH</text>
      <text x="10" y="36" fill="#FFAE00" font-size="13" font-weight="700" class="mono">1.4 GB/s</text>
      <text x="82" y="35" fill="#FF6B00" font-size="9.5" font-weight="600" class="mono">| 16x CHUNKS</text>
      <text x="10" y="45" fill="#64748b" font-size="8" font-weight="500" class="mono">ZERO-COPY RING BUFFER</text>
    </g>
  </g>

  <!-- Right Visual: Multi-threaded Packet Streams & Rust Cog -->
  <g transform="translate(345, 75)">
    <!-- Rust Gear Outer Mechanism -->
    <g class="rust-gear">
      <circle cx="0" cy="0" r="42" fill="none" stroke="#FF6B00" stroke-width="1.2" stroke-opacity="0.4" stroke-dasharray="6 4" />
      <polygon points="0,-45 4,-42 -4,-42" fill="#FFAE00" />
      <polygon points="45,0 42,4 42,-4" fill="#FFAE00" />
      <polygon points="0,45 4,42 -4,42" fill="#FFAE00" />
      <polygon points="-45,0 -42,4 -42,-4" fill="#FFAE00" />
    </g>

    <!-- 4 Parallel Chunk Streams -->
    <g transform="translate(-55, -24)">
      <!-- Stream 1 -->
      <line x1="0" y1="0" x2="60" y2="0" stroke="#FF6B00" stroke-width="2" class="chunk-stream-1" />
      <circle cx="64" cy="0" r="2.5" fill="#FFAE00" />
      <!-- Stream 2 -->
      <line x1="0" y1="14" x2="60" y2="14" stroke="#FFAE00" stroke-width="2" class="chunk-stream-2" />
      <circle cx="64" cy="14" r="2.5" fill="#00F2FE" />
      <!-- Stream 3 -->
      <line x1="0" y1="28" x2="60" y2="28" stroke="#FF5722" stroke-width="2" class="chunk-stream-3" />
      <circle cx="64" cy="28" r="2.5" fill="#FFAE00" />
      <!-- Stream 4 -->
      <line x1="0" y1="42" x2="60" y2="42" stroke="#00F2FE" stroke-width="2" class="chunk-stream-4" />
      <circle cx="64" cy="42" r="2.5" fill="#FF6B00" />
    </g>

    <!-- Speed Core Engine Hub -->
    <g class="speed-glow" transform="translate(25, 0)">
      <circle cx="0" cy="0" r="18" fill="#1a0c04" stroke="#FF6B00" stroke-width="1.5" filter="url(#bmdGlow)" />
      <!-- Lightning Bolt Bolt Icon -->
      <path d="M 2 -9 L -6 1 L 0 1 L -2 9 L 6 -1 L 0 -1 Z" fill="url(#flameGrad)" />
    </g>

    <!-- Status Sub-label -->
    <text x="0" y="55" fill="#64748b" font-size="8" font-weight="600" text-anchor="middle" class="mono">TOKIO ASYNC // ZERO HEAP</text>
  </g>

  <!-- Bottom Tag Bar -->
  <g transform="translate(24, 172)">
    <circle cx="4" cy="5" r="3" fill="#FF6B00" />
    <text x="14" y="8" fill="#64748b" font-size="9" font-weight="600" class="mono">RUNTIME: RUST NATIVE</text>
    <text x="175" y="8" fill="#64748b" font-size="9" font-weight="600" class="mono">PARALLEL CHUNKS</text>
  </g>
</svg>
