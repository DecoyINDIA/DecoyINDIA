<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" width="440" height="200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Base Canvas -->
    <linearGradient id="bmdBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120603" />
      <stop offset="55%" stop-color="#1e0c05" />
      <stop offset="100%" stop-color="#080301" />
    </linearGradient>

    <!-- 1px Specular Border -->
    <linearGradient id="bmdGlassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="30%" stop-color="#FF6B00" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#FFAE00" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.5" />
    </linearGradient>

    <!-- Border Comet Gradient -->
    <linearGradient id="bmdComet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0" />
      <stop offset="60%" stop-color="#FFAE00" stop-opacity="0.85" />
      <stop offset="90%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </linearGradient>

    <!-- Liquid Metal Core Gradient -->
    <linearGradient id="liquidMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#FFAE00" />
      <stop offset="70%" stop-color="#FF6B00" />
      <stop offset="100%" stop-color="#FF5722" />
    </linearGradient>

    <pattern id="bmdGrid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#2b1408" stroke-width="0.5" stroke-opacity="0.5" />
      <circle cx="0" cy="0" r="0.7" fill="#FFAE00" fill-opacity="0.3" />
    </pattern>

    <!-- Liquid Glass Specular Filter -->
    <filter id="glassRefractBmd" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur" />
      <feSpecularLighting in="blur" surfaceScale="2.5" specularConstant="1.5" specularExponent="24" lighting-color="#ffffff" result="specular">
        <feDistantLight azimuth="225" elevation="50" />
      </feSpecularLighting>
      <feComposite in="SourceGraphic" in2="specular" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" />
    </filter>

    <filter id="softGlowBmd" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    @keyframes bmdCometRun {
      0% { stroke-dashoffset: 1240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes chunkStreamSpeed {
      0% { stroke-dashoffset: 48; }
      100% { stroke-dashoffset: 0; }
    }

    .card-comet-bmd {
      stroke-dasharray: 80 1160;
      animation: bmdCometRun 5.8s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
    }
    .c-pipe-1 { stroke-dasharray: 8 6; animation: chunkStreamSpeed 0.7s linear infinite; }
    .c-pipe-2 { stroke-dasharray: 6 5; animation: chunkStreamSpeed 0.5s linear infinite; }
    .c-pipe-3 { stroke-dasharray: 10 7; animation: chunkStreamSpeed 0.9s linear infinite; }
    .c-pipe-4 { stroke-dasharray: 5 4; animation: chunkStreamSpeed 0.6s linear infinite; }
  </style>

  <!-- Background Canvas -->
  <rect width="440" height="200" rx="12" fill="url(#bmdBg2)" />
  <rect width="440" height="200" rx="12" fill="url(#bmdGrid2)" />
  <rect width="440" height="200" rx="12" fill="none" stroke="url(#bmdGlassBorder)" stroke-width="1.2" />

  <!-- React-Bits Border Comet -->
  <rect width="440" height="200" rx="12" fill="none" stroke="url(#bmdComet)" stroke-width="2" class="card-comet-bmd" />

  <!-- Corner Brackets -->
  <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8" />
  <path d="M 428 24 L 428 12 L 416 12" fill="none" stroke="#FFAE00" stroke-width="1.5" />
  <path d="M 12 176 L 12 188 L 24 188" fill="none" stroke="#FF5722" stroke-width="1.5" />
  <path d="M 428 176 L 428 188 L 416 188" fill="none" stroke="#00F2FE" stroke-width="1.5" />

  <!-- Ambient Light Spotlight -->
  <circle cx="345" cy="75" r="70" fill="#FF6B00" opacity="0.1" filter="url(#softGlowBmd)" />

  <!-- Left Header and Info -->
  <g transform="translate(24, 26)">
    <!-- Glass Category Pill -->
    <rect width="148" height="22" rx="6" fill="#2b1104" fill-opacity="0.85" stroke="url(#bmdGlassBorder)" stroke-width="0.9" filter="url(#glassRefractBmd)" />
    <path d="M 6 2 L 142 2" stroke="#ffffff" stroke-opacity="0.4" stroke-width="0.6" stroke-linecap="round" />
    <text x="74" y="15" fill="#FFAE00" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1" class="mono">RUST // HIGH-THROUGHPUT</text>

    <!-- Title with Specular Lighting -->
    <text x="0" y="52" fill="#ffffff" font-size="24" font-weight="900" letter-spacing="0.5" class="sans" filter="url(#glassRefractBmd)">BMD</text>
    <text x="64" y="50" fill="#64748b" font-size="11" font-weight="600" class="mono">BLACK MARLIN</text>

    <!-- Description -->
    <text x="0" y="73" fill="#94a3b8" font-size="11.5" font-weight="400" class="sans">Multi-threaded chunked downloader and zero-copy</text>

    <!-- Clean 2-Line Frosted Glass Telemetry Box (Zero Overlap) -->
    <g transform="translate(0, 92)">
      <rect width="210" height="48" rx="7" fill="#140803" fill-opacity="0.8" stroke="url(#bmdGlassBorder)" stroke-width="0.9" filter="url(#glassRefractBmd)" />
      <path d="M 6 2 L 204 2" stroke="#ffffff" stroke-opacity="0.3" stroke-width="0.6" stroke-linecap="round" />
      
      <!-- Line 1: Label -->
      <text x="12" y="18" fill="#64748b" font-size="8.5" font-weight="600" letter-spacing="0.8" class="mono">TRANSFER BANDWIDTH // RUST</text>
      
      <!-- Line 2: Value + Inline Secondary Tag -->
      <text x="12" y="38" fill="#FFAE00" font-size="13" font-weight="700" class="mono">1.4 GB/s</text>
      <text x="88" y="38" fill="#FF6B00" font-size="9.5" font-weight="600" class="mono">| 16x CHUNKS</text>
    </g>
  </g>

  <!-- Right Visual: Liquid-Metal Packet Accelerator (Strict Native (0,0,0) Pivot - Zero Orbit Bug) -->
  <g transform="translate(345, 75)">
    <!-- Expanding Supersonic Shockwaves (Native Radius and Opacity) -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#FF6B00" stroke-width="1.4">
      <animate attributeName="r" values="18; 56" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9; 0" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#FFAE00" stroke-width="1.2">
      <animate attributeName="r" values="18; 56" begin="1.2s" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9; 0" begin="1.2s" dur="2.4s" repeatCount="indefinite" />
    </circle>

    <!-- Rotating Rust Mechanical Glass Gear (Native SVG Rotate on (0,0,0)) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="18s" repeatCount="indefinite" />
      <circle cx="0" cy="0" r="44" fill="none" stroke="#FF6B00" stroke-width="1.4" stroke-opacity="0.5" stroke-dasharray="8 5" />
      <polygon points="0,-47 4,-44 -4,-44" fill="#FFAE00" />
      <polygon points="47,0 44,4 44,-4" fill="#FFAE00" />
      <polygon points="0,47 4,44 -4,44" fill="#FFAE00" />
      <polygon points="-47,0 -42,4 -42,-4" fill="#FFAE00" />
    </g>

    <!-- 4 Tokio Parallel Packet Pipelines -->
    <g transform="translate(-56, -24)">
      <line x1="0" y1="0" x2="60" y2="0" stroke="#FF6B00" stroke-width="2.2" class="c-pipe-1" />
      <circle cx="64" cy="0" r="3" fill="#ffffff" filter="url(#softGlowBmd)" />
      
      <line x1="0" y1="14" x2="60" y2="14" stroke="#FFAE00" stroke-width="2.2" class="c-pipe-2" />
      <circle cx="64" cy="14" r="3" fill="#00F2FE" />
      
      <line x1="0" y1="28" x2="60" y2="28" stroke="#FF5722" stroke-width="2.2" class="c-pipe-3" />
      <circle cx="64" cy="28" r="3" fill="#ffffff" filter="url(#softGlowBmd)" />
      
      <line x1="0" y1="42" x2="60" y2="42" stroke="#00F2FE" stroke-width="2.2" class="c-pipe-4" />
      <circle cx="64" cy="42" r="3" fill="#FF6B00" />
    </g>

    <!-- Center Liquid-Metal Accelerator Hub -->
    <g filter="url(#glassRefractBmd)" transform="translate(26, 0)">
      <circle cx="0" cy="0" r="20" fill="#200d05" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.6" />
      <circle cx="0" cy="0" r="17" fill="#2b1106" stroke="#FF6B00" stroke-width="1.2" />
      <path d="M 2 -10 L -7 1 L 0 1 L -2 10 L 7 -1 L 0 -1 Z" fill="url(#liquidMetal)" />
    </g>

    <!-- Telemetry Coordinates -->
    <text x="0" y="56" fill="#64748b" font-size="8" font-weight="600" text-anchor="middle" class="mono">TOKIO ASYNC // ZERO HEAP</text>
  </g>

  <!-- Bottom Tag Bar -->
  <g transform="translate(24, 172)">
    <circle cx="4" cy="5" r="3" fill="#FF6B00" />
    <text x="14" y="8" fill="#64748b" font-size="9" font-weight="600" class="mono">RUNTIME: RUST NATIVE</text>
    <text x="175" y="8" fill="#64748b" font-size="9" font-weight="600" class="mono">PARALLEL CHUNKS</text>
  </g>
</svg>
