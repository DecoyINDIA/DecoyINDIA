<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" width="440" height="220" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B10" />
      <stop offset="100%" stop-color="#0E1119" />
    </linearGradient>
    <pattern id="bGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#141824" stroke-width="0.75" />
    </pattern>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5522" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', 'Inter', sans-serif; }
    @keyframes streamProgress {
      0% { width: 0%; opacity: 0.2; }
      50% { width: 75%; opacity: 1; }
      100% { width: 100%; opacity: 0.8; }
    }
    .chunk-fill-1 { animation: streamProgress 3.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .chunk-fill-2 { animation: streamProgress 3.6s cubic-bezier(0.4, 0, 0.2, 1) infinite 0.4s; }
    .chunk-fill-3 { animation: streamProgress 2.9s cubic-bezier(0.4, 0, 0.2, 1) infinite 0.8s; }
  </style>

  <rect width="440" height="220" rx="8" fill="url(#bBg)" />
  <rect width="440" height="220" rx="8" fill="url(#bGrid)" />
  <rect width="440" height="220" rx="8" fill="none" stroke="#1E2435" stroke-width="1.2" />

  <!-- Header Section -->
  <g transform="translate(24, 28)">
    <circle cx="4" cy="4" r="3.5" fill="#38BDF8" />
    <text x="14" y="8" fill="#94A3B8" font-size="9" font-weight="600" letter-spacing="1.5" class="mono">SYSTEM // 03 · SYSTEMS CONCURRENCY</text>
    <text x="0" y="32" fill="#F8FAFC" font-size="18" font-weight="700" letter-spacing="-0.3" class="sans">BMD (Black Marlin)</text>
    <text x="194" y="32" fill="#38BDF8" font-size="11" font-weight="600" letter-spacing="1" class="mono">[RUST ENGINE]</text>
  </g>

  <!-- 8-Chunk Parallel Stream Saturation Deck -->
  <g transform="translate(24, 82)">
    <text x="0" y="0" fill="#64748B" font-size="8.5" font-weight="600" letter-spacing="1.2" class="mono">PARALLEL HTTP RANGE CHUNKS // LINE-RATE</text>
    <text x="280" y="0" fill="#38BDF8" font-size="8.5" font-weight="600" letter-spacing="0.8" class="mono">SATURATION: 100%</text>

    <!-- Chunk Rails (Visualizing 8 Segmented byte streams) -->
    <g transform="translate(0, 16)">
      <!-- Chunk Track 1 -->
      <rect x="0" y="0" width="392" height="7" rx="3.5" fill="#141824" />
      <rect x="0" y="0" width="310" height="7" rx="3.5" fill="url(#streamGrad)" opacity="0.85" />

      <!-- Chunk Track 2 -->
      <rect x="0" y="12" width="392" height="7" rx="3.5" fill="#141824" />
      <rect x="0" y="12" width="260" height="7" rx="3.5" fill="#38BDF8" opacity="0.75" />

      <!-- Chunk Track 3 -->
      <rect x="0" y="24" width="392" height="7" rx="3.5" fill="#141824" />
      <rect x="0" y="24" width="365" height="7" rx="3.5" fill="#FF5522" opacity="0.75" />

      <!-- Chunk Track 4 -->
      <rect x="0" y="36" width="392" height="7" rx="3.5" fill="#141824" />
      <rect x="0" y="36" width="290" height="7" rx="3.5" fill="#10B981" opacity="0.75" />
    </g>
  </g>

  <!-- Technical Spec Footer -->
  <g transform="translate(24, 180)">
    <line x1="0" y1="0" x2="392" y2="0" stroke="#1B2130" stroke-width="1" />
    <text x="0" y="18" fill="#64748B" font-size="8.5" font-weight="500" class="mono">
      Rust · Tokio Async · Parallel Byte Streams · Torrent Magnets · Zero-Bloat GUI
    </text>
  </g>
</svg>