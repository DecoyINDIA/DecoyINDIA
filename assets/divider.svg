<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 32" width="900" height="32" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Left Rail Gradient -->
    <linearGradient id="railL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0" />
      <stop offset="60%" stop-color="#00F2FE" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7F00FF" stop-opacity="0.8" />
    </linearGradient>

    <!-- Right Rail Gradient -->
    <linearGradient id="railR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F00FF" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#00F2FE" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </linearGradient>

    <!-- Light Pulse Packet -->
    <linearGradient id="packetGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="1" />
      <stop offset="100%" stop-color="#7F00FF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Left Main Rail -->
  <line x1="40" y1="16" x2="434" y2="16" stroke="url(#railL)" stroke-width="1.5" />
  <line x1="120" y1="12" x2="390" y2="12" stroke="#00F2FE" stroke-opacity="0.2" stroke-width="0.75" stroke-dasharray="6 10" />
  <line x1="260" y1="20" x2="420" y2="20" stroke="#7F00FF" stroke-opacity="0.25" stroke-width="0.75" />

  <!-- Left Nodes and Ticks -->
  <circle cx="200" cy="16" r="1.5" fill="#00F2FE" opacity="0.6" />
  <circle cx="330" cy="16" r="2" fill="#00F2FE" opacity="0.8" />
  <rect x="424" y="14" width="4" height="4" fill="#7F00FF" />

  <!-- Left Traveling Light Pulse (Pure Vector animate) -->
  <ellipse cy="16" rx="28" ry="2" fill="url(#packetGlow)">
    <animate attributeName="cx" values="40; 430" dur="3.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.2; 0.8; 1" dur="3.8s" repeatCount="indefinite" />
  </ellipse>

  <!-- Right Main Rail -->
  <line x1="466" y1="16" x2="860" y2="16" stroke="url(#railR)" stroke-width="1.5" />
  <line x1="510" y1="12" x2="780" y2="12" stroke="#00F2FE" stroke-opacity="0.2" stroke-width="0.75" stroke-dasharray="6 10" />
  <line x1="480" y1="20" x2="640" y2="20" stroke="#7F00FF" stroke-opacity="0.25" stroke-width="0.75" />

  <!-- Right Nodes and Ticks -->
  <circle cx="700" cy="16" r="1.5" fill="#00F2FE" opacity="0.6" />
  <circle cx="570" cy="16" r="2" fill="#00F2FE" opacity="0.8" />
  <rect x="472" y="14" width="4" height="4" fill="#7F00FF" />

  <!-- Right Traveling Light Pulse (Pure Vector animate) -->
  <ellipse cy="16" rx="28" ry="2" fill="url(#packetGlow)">
    <animate attributeName="cx" values="470; 860" dur="3.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.2; 0.8; 1" dur="3.8s" repeatCount="indefinite" />
  </ellipse>

  <!-- Center Diamond Array (Native Local Scale - Zero Drift) -->
  <g transform="translate(450, 16)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1; 1.15; 1" keyTimes="0; 0.5; 1" dur="3s" repeatCount="indefinite" />
      <polygon points="0,-12 12,0 0,12 -12,0" fill="#0A0F1D" stroke="#00F2FE" stroke-width="1.5" />
      <polygon points="0,-7 7,0 0,7 -7,0" fill="#131B2E" stroke="#7F00FF" stroke-width="1" />
      <polygon points="0,-3 3,0 0,3 -3,0" fill="#00F2FE" />
    </g>
  </g>

  <!-- Flanking Reticle Dots -->
  <circle cx="434" cy="16" r="1.2" fill="#00F2FE" opacity="0.7" />
  <circle cx="466" cy="16" r="1.2" fill="#7F00FF" opacity="0.7" />
</svg>
