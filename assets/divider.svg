<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 28" width="920" height="28" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="divPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B202E" />
      <stop offset="45%" stop-color="#1B202E" />
      <stop offset="50%" stop-color="#FF5522" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#1B202E" />
      <stop offset="100%" stop-color="#1B202E" />
      <animate attributeName="x1" values="-100%; 100%" dur="8s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%; 200%" dur="8s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
  </style>

  <!-- Baseline Hairline -->
  <line x1="20" y1="14" x2="900" y2="14" stroke="url(#divPulse)" stroke-width="1" />

  <!-- Center Crosshair & Coordinate Mark -->
  <g transform="translate(460, 14)">
    <circle cx="0" cy="0" r="3" fill="#FF5522">
      <animate attributeName="r" values="2.5; 3.5; 2.5" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7; 1; 0.7" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="7" fill="none" stroke="#2D3748" stroke-width="0.8" />
    <line x1="-12" y1="0" x2="-6" y2="0" stroke="#FF5522" stroke-width="1" />
    <line x1="6" y1="0" x2="12" y2="0" stroke="#FF5522" stroke-width="1" />
  </g>
</svg>