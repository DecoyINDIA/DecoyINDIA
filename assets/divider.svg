<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 32" width="900" height="32" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="divLineL" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0" />
      <stop offset="60%" stop-color="#00F2FE" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#7F00FF" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="divLineR" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F00FF" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#00F2FE" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="pulseGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="1" />
      <stop offset="100%" stop-color="#7F00FF" stop-opacity="0" />
    </linearGradient>

    <filter id="divGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseMoveL {
      0% { transform: translateX(0); opacity: 0; }
      30% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(400px); opacity: 0; }
    }
    @keyframes pulseMoveR {
      0% { transform: translateX(0); opacity: 0; }
      30% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(400px); opacity: 0; }
    }
    @keyframes diamondBreathe {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #00F2FE); }
      50% { transform: scale(1.15); filter: drop-shadow(0 0 8px #7F00FF); }
    }
    .diamond-center {
      animation: diamondBreathe 3s ease-in-out infinite;
      transform-origin: 450px 16px;
    }
    .pulse-packet-l {
      animation: pulseMoveL 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .pulse-packet-r {
      animation: pulseMoveR 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
  </style>

  <!-- Left Main Line -->
  <line x1="40" y1="16" x2="432" y2="16" stroke="url(#divLineL)" stroke-width="1.5" />
  <!-- Left Accent Rail -->
  <line x1="120" y1="12" x2="380" y2="12" stroke="#00F2FE" stroke-opacity="0.25" stroke-width="0.75" stroke-dasharray="8 12" />
  <line x1="260" y1="20" x2="410" y2="20" stroke="#7F00FF" stroke-opacity="0.3" stroke-width="0.75" />

  <!-- Left Circuit Nodes & Ticks -->
  <circle cx="200" cy="16" r="1.5" fill="#00F2FE" opacity="0.6" />
  <circle cx="320" cy="16" r="2" fill="#00F2FE" opacity="0.8" />
  <rect x="420" y="14" width="4" height="4" fill="#7F00FF" opacity="0.8" />
  <line x1="280" y1="13" x2="280" y2="19" stroke="#00F2FE" stroke-opacity="0.5" stroke-width="1" />
  <line x1="360" y1="13" x2="360" y2="19" stroke="#7F00FF" stroke-opacity="0.6" stroke-width="1" />

  <!-- Traveling Light Pulse Left -->
  <g class="pulse-packet-l">
    <ellipse cx="40" cy="16" rx="28" ry="2.5" fill="url(#pulseGlow)" filter="url(#divGlow)" />
  </g>

  <!-- Right Main Line -->
  <line x1="468" y1="16" x2="860" y2="16" stroke="url(#divLineR)" stroke-width="1.5" />
  <!-- Right Accent Rail -->
  <line x1="520" y1="12" x2="780" y2="12" stroke="#00F2FE" stroke-opacity="0.25" stroke-width="0.75" stroke-dasharray="8 12" />
  <line x1="490" y1="20" x2="640" y2="20" stroke="#7F00FF" stroke-opacity="0.3" stroke-width="0.75" />

  <!-- Right Circuit Nodes & Ticks -->
  <circle cx="700" cy="16" r="1.5" fill="#00F2FE" opacity="0.6" />
  <circle cx="580" cy="16" r="2" fill="#00F2FE" opacity="0.8" />
  <rect x="476" y="14" width="4" height="4" fill="#7F00FF" opacity="0.8" />
  <line x1="620" y1="13" x2="620" y2="19" stroke="#7F00FF" stroke-opacity="0.6" stroke-width="1" />
  <line x1="540" y1="13" x2="540" y2="19" stroke="#00F2FE" stroke-opacity="0.5" stroke-width="1" />

  <!-- Traveling Light Pulse Right -->
  <g class="pulse-packet-r">
    <ellipse cx="468" cy="16" rx="28" ry="2.5" fill="url(#pulseGlow)" filter="url(#divGlow)" />
  </g>

  <!-- Center Diamond & Geometric Array -->
  <g class="diamond-center">
    <!-- Outer Diamond -->
    <polygon points="450,4 462,16 450,28 438,16" fill="#0a0f1d" stroke="#00F2FE" stroke-width="1.5" />
    <!-- Mid Diamond -->
    <polygon points="450,8 458,16 450,24 442,16" fill="#131b2e" stroke="#7F00FF" stroke-width="1" />
    <!-- Core Diamond Glow -->
    <polygon points="450,12 454,16 450,20 446,16" fill="#00F2FE" />
  </g>

  <!-- Micro Coordinate Ticks around Center -->
  <circle cx="434" cy="16" r="1" fill="#00F2FE" opacity="0.5" />
  <circle cx="466" cy="16" r="1" fill="#00F2FE" opacity="0.5" />
</svg>
