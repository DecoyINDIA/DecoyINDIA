<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" width="440" height="200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="opdfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060d14" />
      <stop offset="60%" stop-color="#0a1926" />
      <stop offset="100%" stop-color="#04080e" />
    </linearGradient>

    <linearGradient id="opdfBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#00D9F5" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="opdfAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="100%" stop-color="#00D9F5" />
    </linearGradient>

    <pattern id="opdfGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#12283a" stroke-width="0.5" stroke-opacity="0.5" />
    </pattern>

    <filter id="opdfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    @keyframes threadPulse1 {
      0% { stroke-dashoffset: 60; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes meterGrow {
      0%, 100% { width: 140px; }
      50% { width: 185px; }
    }
    @keyframes parseBeacon {
      0%, 100% { opacity: 0.3; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    .data-thread {
      stroke-dasharray: 6 10;
      animation: threadPulse1 1.8s linear infinite;
    }
    .meter-bar {
      animation: meterGrow 4s ease-in-out infinite;
    }
    .beacon {
      animation: parseBeacon 2s ease-in-out infinite;
      transform-origin: 350px 70px;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="440" height="200" rx="12" fill="url(#opdfBg)" />
  <rect width="440" height="200" rx="12" fill="url(#opdfGrid)" />
  <rect width="440" height="200" rx="12" fill="none" stroke="url(#opdfBorder)" stroke-width="1.2" />

  <!-- Corner Tech Accents -->
  <path d="M 12 25 L 12 12 L 25 12" fill="none" stroke="#00F5A0" stroke-width="1.5" />
  <path d="M 428 25 L 428 12 L 415 12" fill="none" stroke="#00D9F5" stroke-width="1.5" />
  <path d="M 12 175 L 12 188 L 25 188" fill="none" stroke="#1e3a5f" stroke-width="1.5" />
  <path d="M 428 175 L 428 188 L 415 188" fill="none" stroke="#00F5A0" stroke-width="1.5" />

  <!-- Ambient Light Orbs -->
  <circle cx="340" cy="70" r="60" fill="#00F5A0" opacity="0.08" filter="url(#opdfGlow)" />

  <!-- Left Header & Info -->
  <g transform="translate(24, 28)">
    <!-- Category Pill -->
    <rect width="138" height="20" rx="4" fill="#092520" stroke="#00F5A0" stroke-width="0.8" />
    <text x="69" y="14" fill="#00F5A0" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1" class="mono">JAVA // SYSTEMS ENGINE</text>

    <!-- Title -->
    <text x="0" y="48" fill="#ffffff" font-size="22" font-weight="800" letter-spacing="0.5" class="sans">OctaPDF</text>
    <text x="100" y="47" fill="#64748b" font-size="11" font-weight="600" class="mono">v2.4.0</text>

    <!-- Description -->
    <text x="0" y="70" fill="#94a3b8" font-size="11.5" font-weight="400" class="sans">Multi-threaded document parsing &amp; OCR stream</text>

    <!-- Performance Telemetry Box -->
    <g transform="translate(0, 92)">
      <rect width="210" height="48" rx="6" fill="#07131e" stroke="#132e47" stroke-width="1" />
      
      <text x="10" y="16" fill="#64748b" font-size="8.5" font-weight="600" letter-spacing="0.8" class="mono">JVM VIRTUAL THREADS</text>
      <!-- Meter Track -->
      <rect x="10" y="24" width="190" height="6" rx="3" fill="#0f2233" />
      <rect x="10" y="24" width="165" height="6" rx="3" fill="url(#opdfAccent)" class="meter-bar" />
      
      <text x="10" y="41" fill="#00F5A0" font-size="9.5" font-weight="700" class="mono">1.2M OPS/SEC</text>
      <text x="145" y="41" fill="#64748b" font-size="9" font-weight="600" class="mono">HEAP: 18MB</text>
    </g>
  </g>

  <!-- Right Visual: Document Parsing Multi-thread Lattice -->
  <g transform="translate(340, 70)">
    <!-- Document Glyph / Polygon Wireframe -->
    <path d="M -30 -35 L 15 -35 L 30 -20 L 30 35 L -30 35 Z" fill="#091826" stroke="#00D9F5" stroke-width="1.5" />
    <path d="M 15 -35 L 15 -20 L 30 -20" fill="none" stroke="#00D9F5" stroke-width="1.5" />
    
    <!-- PDF Text Lines in Wireframe -->
    <line x1="-20" y1="-15" x2="6" y2="-15" stroke="#00F5A0" stroke-width="1.5" opacity="0.8" />
    <line x1="-20" y1="-5" x2="18" y2="-5" stroke="#64748b" stroke-width="1.2" opacity="0.6" />
    <line x1="-20" y1="5" x2="14" y2="5" stroke="#64748b" stroke-width="1.2" opacity="0.6" />
    <line x1="-20" y1="15" x2="20" y2="15" stroke="#00F5A0" stroke-width="1.5" opacity="0.8" />
    <line x1="-20" y1="25" x2="0" y2="25" stroke="#64748b" stroke-width="1.2" opacity="0.6" />

    <!-- Outer Thread Node Network -->
    <!-- Thread 1 -->
    <line x1="-40" y1="-45" x2="-30" y2="-35" stroke="#00F5A0" stroke-width="1.2" class="data-thread" />
    <circle cx="-40" cy="-45" r="3" fill="#00F5A0" />

    <!-- Thread 2 -->
    <line x1="45" y1="-40" x2="30" y2="-20" stroke="#00D9F5" stroke-width="1.2" class="data-thread" />
    <circle cx="45" cy="-40" r="3" fill="#00D9F5" />

    <!-- Thread 3 -->
    <line x1="-50" y1="25" x2="-30" y2="25" stroke="#00F5A0" stroke-width="1.2" class="data-thread" />
    <circle cx="-50" cy="25" r="3" fill="#00F5A0" />

    <!-- Thread 4 -->
    <line x1="50" y1="30" x2="30" y2="30" stroke="#00D9F5" stroke-width="1.2" class="data-thread" />
    <circle cx="50" cy="30" r="3" fill="#00D9F5" />

    <!-- Central Beacon -->
    <circle cx="0" cy="0" r="14" fill="none" stroke="#00F5A0" stroke-width="1" class="beacon" />
  </g>

  <!-- Bottom Tag Bar -->
  <g transform="translate(24, 172)">
    <circle cx="4" cy="5" r="3" fill="#00F5A0" />
    <text x="14" y="8" fill="#64748b" font-size="9" font-weight="600" class="mono">PARSER: ZERO-COPY</text>
    <text x="160" y="8" fill="#64748b" font-size="9" font-weight="600" class="mono">XOLVERLABS ECOSYSTEM</text>
  </g>
</svg>
