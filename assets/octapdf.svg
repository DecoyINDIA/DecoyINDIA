<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" width="440" height="220" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="oBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B10" />
      <stop offset="100%" stop-color="#0E121A" />
    </linearGradient>
    <pattern id="oGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#141824" stroke-width="0.75" />
    </pattern>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', 'Inter', sans-serif; }
    @keyframes pageBreakout {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .sheet-hover { animation: pageBreakout 3.5s ease-in-out infinite; }
  </style>

  <rect width="440" height="220" rx="8" fill="url(#oBg)" />
  <rect width="440" height="220" rx="8" fill="url(#oGrid)" />
  <rect width="440" height="220" rx="8" fill="none" stroke="#1E2435" stroke-width="1.2" />

  <!-- Header Section -->
  <g transform="translate(24, 28)">
    <circle cx="4" cy="4" r="3.5" fill="#10B981" />
    <text x="14" y="8" fill="#94A3B8" font-size="9" font-weight="600" letter-spacing="1.5" class="mono">SYSTEM // 02 · LOCAL-FIRST WORKSPACE</text>
    <text x="0" y="32" fill="#F8FAFC" font-size="18" font-weight="700" letter-spacing="-0.3" class="sans">OctaPDF</text>
    <text x="82" y="32" fill="#10B981" font-size="11" font-weight="600" letter-spacing="1" class="mono">[AIR-GAPPED DESK]</text>
  </g>

  <!-- Axonometric Document Deck & Zero-Egress Perimeter -->
  <g transform="translate(24, 82)">
    <text x="0" y="0" fill="#64748B" font-size="8.5" font-weight="600" letter-spacing="1.2" class="mono">ZERO-EGRESS AIR GAP // LOOM THREADING</text>
    <text x="270" y="0" fill="#10B981" font-size="8.5" font-weight="600" letter-spacing="0.8" class="mono">WAN: ISOLATED</text>

    <!-- Visual: Layered PDF Sheets with Command Palette -->
    <g transform="translate(10, 16)">
      <!-- Backing Sheet 3 -->
      <rect x="24" y="16" width="60" height="44" rx="3" fill="#151A27" stroke="#252F47" stroke-width="1" />
      <!-- Mid Sheet 2 -->
      <rect x="12" y="8" width="60" height="44" rx="3" fill="#1A2132" stroke="#2E3B59" stroke-width="1" />
      <!-- Front Sheet 1 (Active Page Breakout) -->
      <g class="sheet-hover">
        <rect x="0" y="0" width="60" height="44" rx="3" fill="#202A3F" stroke="#38BDF8" stroke-width="1.2" />
        <line x1="8" y1="12" x2="38" y2="12" stroke="#F1F5F9" stroke-width="1.5" />
        <line x1="8" y1="20" x2="48" y2="20" stroke="#64748B" stroke-width="1" />
        <line x1="8" y1="28" x2="42" y2="28" stroke="#64748B" stroke-width="1" />
        <circle cx="50" cy="34" r="3" fill="#10B981" />
      </g>
    </g>

    <!-- Zero-Egress Perimeter Fence -->
    <g transform="translate(140, 16)">
      <rect width="240" height="48" rx="4" fill="#0C1017" stroke="#1D2A22" stroke-width="1" />
      <text x="12" y="18" fill="#10B981" font-size="8.5" font-weight="600" letter-spacing="1.2" class="mono">SECURITY PERIMETER</text>
      <text x="12" y="36" fill="#E2E8F0" font-size="11" font-weight="500" class="sans">Read-Only Root · Zero Outbound Sockets</text>
      <circle cx="220" cy="24" r="4" fill="#10B981">
        <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
      </circle>
    </g>
  </g>

  <!-- Technical Spec Footer -->
  <g transform="translate(24, 180)">
    <line x1="0" y1="0" x2="392" y2="0" stroke="#1B2130" stroke-width="1" />
    <text x="0" y="18" fill="#64748B" font-size="8.5" font-weight="500" class="mono">
      Java 21 · Project Loom · 50+ Command Palette Tools · Atomic Redactions · Docker
    </text>
  </g>
</svg>