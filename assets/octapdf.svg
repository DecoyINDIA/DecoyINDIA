<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" width="440" height="200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Canvas -->
    <linearGradient id="opdfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D14" />
      <stop offset="50%" stop-color="#0A121E" />
      <stop offset="100%" stop-color="#06090F" />
    </linearGradient>

    <!-- 1px Hairline Border -->
    <linearGradient id="opdfBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#00D9F5" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1E3A5F" stop-opacity="0.4" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="opdfAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0" />
      <stop offset="100%" stop-color="#00D9F5" />
    </linearGradient>

    <!-- Laser Beam -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F5A0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00F5A0" stop-opacity="0" />
    </linearGradient>

    <!-- Precision Dot Grid -->
    <pattern id="opdfGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.75" fill="#132338" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    @keyframes conduitPulse {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }
    .thread-stream {
      stroke-dasharray: 6 8;
      animation: conduitPulse 1.2s linear infinite;
    }
  </style>

  <!-- Background Surface -->
  <rect width="440" height="200" rx="12" fill="url(#opdfBg)" />
  <rect width="440" height="200" rx="12" fill="url(#opdfGrid)" />
  <rect width="440" height="200" rx="12" fill="none" stroke="url(#opdfBorder)" stroke-width="1.2" />

  <!-- Corner Brackets -->
  <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#00F5A0" stroke-width="1.5" />
  <path d="M 428 24 L 428 12 L 416 12" fill="none" stroke="#00D9F5" stroke-width="1.5" />
  <path d="M 12 176 L 12 188 L 24 188" fill="none" stroke="#1E3A5F" stroke-width="1.5" />
  <path d="M 428 176 L 428 188 L 416 188" fill="none" stroke="#00F5A0" stroke-width="1.5" />

  <!-- Left Header and Info -->
  <g transform="translate(24, 28)">
    <!-- Category Pill -->
    <rect width="144" height="20" rx="4" fill="#0C1B1A" stroke="#174A3D" stroke-width="1" />
    <text x="72" y="14" fill="#00F5A0" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1" class="mono">JAVA 21 // VIRTUAL LOOM</text>

    <!-- Title -->
    <text x="0" y="48" fill="#FFFFFF" font-size="22" font-weight="800" letter-spacing="0.5" class="sans">OctaPDF</text>
    <text x="96" y="47" fill="#64748B" font-size="11" font-weight="600" class="mono">v2.4.0</text>

    <!-- Description -->
    <text x="0" y="68" fill="#94A3B8" font-size="11.5" font-weight="400" class="sans">Multi-threaded document parsing and OCR stream</text>

    <!-- Clean 2-Line Telemetry Box (Zero Overlap) -->
    <g transform="translate(0, 88)">
      <rect width="210" height="46" rx="6" fill="#0A111D" stroke="#1E2B3E" stroke-width="1" />
      <text x="12" y="17" fill="#64748B" font-size="8.5" font-weight="600" letter-spacing="0.8" class="mono">JVM VIRTUAL THREADS</text>
      <text x="12" y="35" fill="#00F5A0" font-size="13" font-weight="700" class="mono">1.2M OPS/SEC</text>
      <text x="120" y="35" fill="#64748B" font-size="9.5" font-weight="600" class="mono">| HEAP: 18MB</text>
    </g>
  </g>

  <!-- Right Visual: Document Parsing Multi-thread Lattice (Pure Vector) -->
  <g transform="translate(345, 75)">
    <!-- Document Isometric Slate -->
    <path d="M -30 -36 L 14 -36 L 30 -20 L 30 36 L -30 36 Z" fill="#0B1524" stroke="#00D9F5" stroke-width="1.5" />
    <path d="M 14 -36 L 14 -20 L 30 -20" fill="none" stroke="#00D9F5" stroke-width="1.5" />

    <!-- Document Text Lines -->
    <line x1="-20" y1="-16" x2="6" y2="-16" stroke="#00F5A0" stroke-width="1.5" opacity="0.9" />
    <line x1="-20" y1="-6" x2="20" y2="-6" stroke="#64748B" stroke-width="1.2" opacity="0.6" />
    <line x1="-20" y1="4" x2="14" y2="4" stroke="#64748B" stroke-width="1.2" opacity="0.6" />
    <line x1="-20" y1="14" x2="22" y2="14" stroke="#00D9F5" stroke-width="1.5" opacity="0.85" />
    <line x1="-20" y1="24" x2="0" y2="24" stroke="#64748B" stroke-width="1.2" opacity="0.6" />

    <!-- Laser OCR Scanner Line (Pure Vector) -->
    <line x1="-36" y1="-28" x2="36" y2="-28" stroke="url(#laserGrad)" stroke-width="2">
      <animate attributeName="y1" values="-28; 30; -28" dur="3s" repeatCount="indefinite" />
      <animate attributeName="y2" values="-28; 30; -28" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="3s" repeatCount="indefinite" />
    </line>

    <!-- 4 Thread Ingestion Nodes -->
    <line x1="-48" y1="-42" x2="-30" y2="-32" stroke="#00F5A0" stroke-width="1.2" class="thread-stream" />
    <circle cx="-48" cy="-42" r="3" fill="#00F5A0" />

    <line x1="48" y1="-38" x2="30" y2="-20" stroke="#00D9F5" stroke-width="1.2" class="thread-stream" />
    <circle cx="48" cy="-38" r="3" fill="#00D9F5" />

    <line x1="-52" y1="26" x2="-30" y2="26" stroke="#00F5A0" stroke-width="1.2" class="thread-stream" />
    <circle cx="-52" cy="26" r="3" fill="#00F5A0" />

    <line x1="52" y1="28" x2="30" y2="28" stroke="#00D9F5" stroke-width="1.2" class="thread-stream" />
    <circle cx="52" cy="28" r="3" fill="#00D9F5" />
  </g>

  <!-- Bottom Tag Bar -->
  <g transform="translate(24, 172)">
    <circle cx="4" cy="5" r="3" fill="#00F5A0" />
    <text x="14" y="8" fill="#64748B" font-size="9" font-weight="600" class="mono">PARSER: ZERO-COPY</text>
    <text x="160" y="8" fill="#64748B" font-size="9" font-weight="600" class="mono">XOLVERLABS ECOSYSTEM</text>
  </g>
</svg>
