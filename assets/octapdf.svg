<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" width="440" height="200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Base Canvas -->
    <linearGradient id="opdfBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04090f" />
      <stop offset="55%" stop-color="#081824" />
      <stop offset="100%" stop-color="#03060a" />
    </linearGradient>

    <!-- 1px Specular Border -->
    <linearGradient id="opdfGlassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="30%" stop-color="#00F5A0" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#00D9F5" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0.5" />
    </linearGradient>

    <!-- Border Comet Gradient -->
    <linearGradient id="opdfComet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0" />
      <stop offset="60%" stop-color="#00F5A0" stop-opacity="0.8" />
      <stop offset="90%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#00D9F5" stop-opacity="0" />
    </linearGradient>

    <!-- Glass Slab Surface -->
    <linearGradient id="glassSlabFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="40%" stop-color="#00F5A0" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00D9F5" stop-opacity="0.04" />
    </linearGradient>

    <!-- OCR Laser Beam Gradient -->
    <linearGradient id="ocrLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0" />
      <stop offset="30%" stop-color="#00F5A0" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="70%" stop-color="#00D9F5" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00F5A0" stop-opacity="0" />
    </linearGradient>

    <pattern id="opdfGrid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#102538" stroke-width="0.5" stroke-opacity="0.5" />
      <circle cx="0" cy="0" r="0.7" fill="#00F5A0" fill-opacity="0.3" />
    </pattern>

    <!-- Liquid Glass Specular Filter -->
    <filter id="glassRefractOp" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur" />
      <feSpecularLighting in="blur" surfaceScale="2.5" specularConstant="1.4" specularExponent="24" lighting-color="#ffffff" result="specular">
        <feDistantLight azimuth="225" elevation="50" />
      </feSpecularLighting>
      <feComposite in="SourceGraphic" in2="specular" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" />
    </filter>

    <filter id="softGlowOp" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    @keyframes opdfCometRun {
      0% { stroke-dashoffset: 1240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes conduitFlow {
      0% { stroke-dashoffset: 50; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes meterOrganic {
      0%, 100% { width: 135px; }
      50% { width: 175px; }
    }

    .card-comet-op {
      stroke-dasharray: 80 1160;
      animation: opdfCometRun 5.8s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
    }
    .conduit-stream {
      stroke-dasharray: 6 8;
      animation: conduitFlow 1.1s linear infinite;
    }
    .meter-fill {
      animation: meterOrganic 4.7s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="440" height="200" rx="12" fill="url(#opdfBg2)" />
  <rect width="440" height="200" rx="12" fill="url(#opdfGrid2)" />
  <rect width="440" height="200" rx="12" fill="none" stroke="url(#opdfGlassBorder)" stroke-width="1.2" />

  <!-- React-Bits Border Comet -->
  <rect width="440" height="200" rx="12" fill="none" stroke="url(#opdfComet)" stroke-width="2" class="card-comet-op" />

  <!-- Corner Brackets -->
  <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8" />
  <path d="M 428 24 L 428 12 L 416 12" fill="none" stroke="#00F5A0" stroke-width="1.5" />
  <path d="M 12 176 L 12 188 L 24 188" fill="none" stroke="#00D9F5" stroke-width="1.5" />
  <path d="M 428 176 L 428 188 L 416 188" fill="none" stroke="#00F5A0" stroke-width="1.5" />

  <!-- Ambient Light Spotlight -->
  <circle cx="345" cy="75" r="70" fill="#00F5A0" opacity="0.08" filter="url(#softGlowOp)" />

  <!-- Left Header and Info -->
  <g transform="translate(24, 26)">
    <!-- Glass Category Pill -->
    <rect width="144" height="22" rx="6" fill="#071b1e" fill-opacity="0.85" stroke="url(#opdfGlassBorder)" stroke-width="0.9" filter="url(#glassRefractOp)" />
    <path d="M 6 2 L 138 2" stroke="#ffffff" stroke-opacity="0.4" stroke-width="0.6" stroke-linecap="round" />
    <text x="72" y="15" fill="#00F5A0" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1" class="mono">JAVA 21 // VIRTUAL LOOM</text>

    <!-- Title with Specular Lighting -->
    <text x="0" y="52" fill="#ffffff" font-size="24" font-weight="900" letter-spacing="0.5" class="sans" filter="url(#glassRefractOp)">OctaPDF</text>
    <text x="110" y="50" fill="#64748b" font-size="11" font-weight="600" class="mono">v2.4</text>

    <!-- Description -->
    <text x="0" y="73" fill="#94a3b8" font-size="11.5" font-weight="400" class="sans">High-throughput document parsing and OCR stream</text>

    <!-- Clean 2-Line Frosted Glass Telemetry Box (Zero Overlap) -->
    <g transform="translate(0, 92)">
      <rect width="210" height="48" rx="7" fill="#061320" fill-opacity="0.8" stroke="url(#opdfGlassBorder)" stroke-width="0.9" filter="url(#glassRefractOp)" />
      <path d="M 6 2 L 204 2" stroke="#ffffff" stroke-opacity="0.3" stroke-width="0.6" stroke-linecap="round" />
      
      <!-- Line 1: Label -->
      <text x="12" y="18" fill="#64748b" font-size="8.5" font-weight="600" letter-spacing="0.8" class="mono">JVM VIRTUAL THREADS // OCR</text>
      
      <!-- Line 2: Value + Inline Secondary Tag -->
      <text x="12" y="38" fill="#00F5A0" font-size="13" font-weight="700" class="mono">1.2M OPS/SEC</text>
      <text x="120" y="38" fill="#64748b" font-size="9.5" font-weight="600" class="mono">| HEAP: 18MB</text>
    </g>
  </g>

  <!-- Right Visual: 3D Floating Glass Document Slab and Native OCR Laser Scanner -->
  <g transform="translate(345, 75)">
    <!-- 3D Liquid Glass Document Slab -->
    <g filter="url(#glassRefractOp)">
      <path d="M -32 -38 L 14 -38 L 32 -20 L 32 38 L -32 38 Z" fill="url(#glassSlabFace)" stroke="url(#opdfGlassBorder)" stroke-width="1.6" />
      <path d="M 14 -38 L 14 -20 L 32 -20" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.2" />
    </g>

    <!-- Holographic Document Text Lines -->
    <g>
      <line x1="-22" y1="-18" x2="6" y2="-18" stroke="#00F5A0" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />
      <line x1="-22" y1="-8" x2="22" y2="-8" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.2" stroke-linecap="round" />
      <line x1="-22" y1="2" x2="16" y2="2" stroke="#64748b" stroke-width="1.2" stroke-linecap="round" />
      <line x1="-22" y1="12" x2="24" y2="12" stroke="#00D9F5" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />
      <line x1="-22" y1="22" x2="4" y2="22" stroke="#64748b" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- Dynamic Laser OCR Scanner Beam (Native SVG Translate - Zero Orbit Drift) -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -26; 0 26; 0 -26" keyTimes="0; 0.5; 1" dur="3.4s" repeatCount="indefinite" />
      <line x1="-38" y1="0" x2="38" y2="0" stroke="url(#ocrLaser)" stroke-width="2.2" filter="url(#softGlowOp)" />
      <circle cx="-38" cy="0" r="2" fill="#00F5A0" />
      <circle cx="38" cy="0" r="2" fill="#00D9F5" />
    </g>

    <!-- 4 Fiber-Optic Virtual Thread Conduits -->
    <line x1="-48" y1="-46" x2="-32" y2="-34" stroke="#00F5A0" stroke-width="1.4" class="conduit-stream" />
    <circle cx="-48" cy="-46" r="3" fill="#00F5A0" filter="url(#softGlowOp)" />

    <line x1="48" y1="-42" x2="32" y2="-18" stroke="#00D9F5" stroke-width="1.4" class="conduit-stream" />
    <circle cx="48" cy="-42" r="3" fill="#00D9F5" filter="url(#softGlowOp)" />

    <line x1="-54" y1="28" x2="-32" y2="28" stroke="#00F5A0" stroke-width="1.4" class="conduit-stream" />
    <circle cx="-54" cy="28" r="3" fill="#00F5A0" filter="url(#softGlowOp)" />

    <line x1="54" y1="32" x2="32" y2="32" stroke="#00D9F5" stroke-width="1.4" class="conduit-stream" />
    <circle cx="54" cy="32" r="3" fill="#00D9F5" filter="url(#softGlowOp)" />
  </g>

  <!-- Bottom Tag Bar -->
  <g transform="translate(24, 172)">
    <circle cx="4" cy="5" r="3" fill="#00F5A0" />
    <text x="14" y="8" fill="#64748b" font-size="9" font-weight="600" class="mono">PARSER: ZERO-COPY</text>
    <text x="160" y="8" fill="#64748b" font-size="9" font-weight="600" class="mono">XOLVERLABS ECOSYSTEM</text>
  </g>
</svg>
