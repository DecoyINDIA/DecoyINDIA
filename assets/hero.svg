<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="920" height="320" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Dark Architectural Canvas Gradient -->
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0F" />
      <stop offset="50%" stop-color="#0D0F18" />
      <stop offset="100%" stop-color="#06070B" />
    </linearGradient>

    <!-- Subtle Technical Grid Pattern -->
    <pattern id="archGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#151926" stroke-width="0.75" />
      <circle cx="32" cy="32" r="0.9" fill="#1E2436" />
    </pattern>

    <!-- Warm Phosphor Accent Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF5522" />
      <stop offset="100%" stop-color="#FFAA44" />
    </linearGradient>

    <!-- Specular Hairline Gradient -->
    <linearGradient id="hairline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1B2030" />
      <stop offset="35%" stop-color="#323B54" />
      <stop offset="50%" stop-color="#FF5522" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#323B54" />
      <stop offset="100%" stop-color="#1B2030" />
    </linearGradient>

    <!-- Ambient Radial Glow Behind Kinetic Instrument -->
    <radialGradient id="centerGlow" cx="72%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#FF5522" stop-opacity="0.14" />
      <stop offset="45%" stop-color="#38BDF8" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#080A0F" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', 'Inter', Roboto, sans-serif; }
    
    @keyframes spinClockwise {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes spinCounter {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes pulseCoreGlow {
      0%, 100% { opacity: 0.35; transform: scale(0.96); }
      50% { opacity: 0.95; transform: scale(1.04); }
    }
    @keyframes waveDash {
      to { stroke-dashoffset: -120; }
    }
    
    .spin-slow { transform-origin: 710px 160px; animation: spinClockwise 48s linear infinite; }
    .spin-mid { transform-origin: 710px 160px; animation: spinCounter 32s linear infinite; }
    .spin-fast { transform-origin: 710px 160px; animation: spinClockwise 20s linear infinite; }
    .pulse-core { transform-origin: 710px 160px; animation: pulseCoreGlow 3.6s ease-in-out infinite; }
    .wave-flow { stroke-dasharray: 8 6; animation: waveDash 5s linear infinite; }
  </style>

  <!-- Canvas Surface -->
  <rect width="920" height="320" rx="8" fill="url(#heroBg)" />
  <rect width="920" height="320" rx="8" fill="url(#archGrid)" />
  <rect width="920" height="320" rx="8" fill="url(#centerGlow)" />
  <rect width="920" height="320" rx="8" fill="none" stroke="#1D2334" stroke-width="1.2" />

  <!-- Corner Precision Crosshairs -->
  <g stroke="#3A4460" stroke-width="1" opacity="0.65">
    <path d="M 12 18 L 24 18 M 18 12 L 18 24" />
    <path d="M 896 18 L 908 18 M 902 12 L 902 24" />
    <path d="M 12 302 L 24 302 M 18 296 L 18 308" />
    <path d="M 896 302 L 908 302 M 902 296 L 902 308" />
  </g>

  <!-- Top Specular Rule -->
  <line x1="24" y1="1" x2="896" y2="1" stroke="url(#hairline)" stroke-width="1.5" />

  <!-- ==================== LEFT COLUMN: EDITORIAL IDENTITY ==================== -->
  <g transform="translate(48, 42)">
    <!-- Metadata Eyebrow -->
    <g transform="translate(0, 0)">
      <circle cx="4" cy="4" r="3.5" fill="#FF5522">
        <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <text x="16" y="7" fill="#94A3B8" font-size="9" font-weight="600" letter-spacing="1.8" class="mono">DECOYINDIA // XOLVERLABS ATELIER</text>
      <text x="238" y="7" fill="#475569" font-size="9" font-weight="500" letter-spacing="1.2" class="mono">• 2026 SOVEREIGN SYSTEMS</text>
    </g>

    <!-- Primary Typography: Full Name -->
    <g transform="translate(0, 44)">
      <text x="0" y="0" fill="#F8FAFC" font-size="40" font-weight="800" letter-spacing="-1.2" class="sans">SUBHAM JENA</text>
    </g>

    <!-- Sub-heading / Operational Role -->
    <text x="0" y="72" fill="#E2E8F0" font-size="14.5" font-weight="600" letter-spacing="-0.2" class="sans">
      Systems Architect &amp; Product Founder
    </text>

    <!-- Core Mission Statement -->
    <text x="0" y="98" fill="#94A3B8" font-size="12" font-weight="400" letter-spacing="0.1" class="sans">
      Engineering deterministic software: low-latency concurrency in Rust &amp; Loom,
    </text>
    <text x="0" y="116" fill="#94A3B8" font-size="12" font-weight="400" letter-spacing="0.1" class="sans">
      un-hallucinated Indic vernacular voice pipelines, and air-gapped local-first runtimes.
    </text>

    <!-- 3 Engineered Specification Blocks -->
    <g transform="translate(0, 154)">
      <!-- Metric 1: Concurrency -->
      <g transform="translate(0, 0)">
        <rect width="134" height="48" rx="4" fill="#0C0E16" stroke="#1E2436" stroke-width="1" />
        <text x="12" y="18" fill="#64748B" font-size="8.5" font-weight="600" letter-spacing="1.2" class="mono">CONCURRENCY</text>
        <text x="12" y="36" fill="#F1F5F9" font-size="12.5" font-weight="600" class="mono">RUST · LOOM 21</text>
      </g>

      <!-- Metric 2: Vernacular Voice -->
      <g transform="translate(144, 0)">
        <rect width="144" height="48" rx="4" fill="#0C0E16" stroke="#1E2436" stroke-width="1" />
        <text x="12" y="18" fill="#64748B" font-size="8.5" font-weight="600" letter-spacing="1.2" class="mono">VOICE RUNTIME</text>
        <text x="12" y="36" fill="#38BDF8" font-size="12.5" font-weight="600" class="mono">LANGGRAPH · INDIC</text>
      </g>

      <!-- Metric 3: Sovereign Trust -->
      <g transform="translate(298, 0)">
        <rect width="138" height="48" rx="4" fill="#0C0E16" stroke="#1E2436" stroke-width="1" />
        <text x="12" y="18" fill="#64748B" font-size="8.5" font-weight="600" letter-spacing="1.2" class="mono">DATA INTEGRITY</text>
        <text x="12" y="36" fill="#10B981" font-size="12.5" font-weight="600" class="mono">ZERO-EGRESS · ESCROW</text>
      </g>
    </g>
  </g>

  <!-- ==================== RIGHT COLUMN: KINETIC ARCHITECTURAL INSTRUMENT ==================== -->
  <g id="instrument">
    <!-- Center coordinate: (710, 160) -->
    
    <!-- Outer Caliper Ring (48s rotation) -->
    <g class="spin-slow">
      <circle cx="710" cy="160" r="108" fill="none" stroke="#1B2130" stroke-width="1" stroke-dasharray="2 12" />
      <circle cx="710" cy="160" r="100" fill="none" stroke="#22293C" stroke-width="0.75" />
      <!-- Caliper Cardinal Ticks -->
      <line x1="710" y1="50" x2="710" y2="60" stroke="#FF5522" stroke-width="1.5" />
      <line x1="710" y1="260" x2="710" y2="270" stroke="#FF5522" stroke-width="1.5" />
      <line x1="600" y1="160" x2="610" y2="160" stroke="#64748B" stroke-width="1.5" />
      <line x1="810" y1="160" x2="820" y2="160" stroke="#64748B" stroke-width="1.5" />
      <text x="710" y="46" fill="#64748B" font-size="7.5" font-weight="600" text-anchor="middle" class="mono">000°</text>
      <text x="828" y="163" fill="#64748B" font-size="7.5" font-weight="600" class="mono">090°</text>
      <text x="710" y="280" fill="#64748B" font-size="7.5" font-weight="600" text-anchor="middle" class="mono">180°</text>
      <text x="584" y="163" fill="#64748B" font-size="7.5" font-weight="600" class="mono">270°</text>
    </g>

    <!-- Mid Gear Ring (32s Counter Rotation) -->
    <g class="spin-mid">
      <circle cx="710" cy="160" r="82" fill="none" stroke="#262F44" stroke-width="1" stroke-dasharray="14 10" />
      <circle cx="710" cy="160" r="68" fill="none" stroke="#1E2536" stroke-width="1" />
      <rect x="707" y="90" width="6" height="6" fill="#38BDF8" opacity="0.8" />
      <rect x="707" y="224" width="6" height="6" fill="#38BDF8" opacity="0.8" />
      <rect x="640" y="157" width="6" height="6" fill="#38BDF8" opacity="0.8" />
      <rect x="774" y="157" width="6" height="6" fill="#38BDF8" opacity="0.8" />
    </g>

    <!-- Harmonic Wave Orbit (Inner Voice / Frequency Simulation) -->
    <g class="spin-fast">
      <ellipse cx="710" cy="160" rx="52" ry="32" fill="none" stroke="#FF5522" stroke-width="1.2" opacity="0.55" stroke-dasharray="6 4" />
      <ellipse cx="710" cy="160" rx="32" ry="52" fill="none" stroke="#38BDF8" stroke-width="1" opacity="0.45" stroke-dasharray="4 6" />
    </g>

    <!-- Kinetic Lissajous Voice Waveform (Simulating Indic Speech) -->
    <path d="M 640 160 Q 658 120 675 160 T 710 160 T 745 160 T 780 160" fill="none" stroke="url(#amberGrad)" stroke-width="1.8" class="wave-flow">
      <animate attributeName="d" 
        values="M 640 160 Q 658 120 675 160 T 710 160 T 745 160 T 780 160;
                M 640 160 Q 658 190 675 160 T 710 160 T 745 160 T 780 160;
                M 640 160 Q 658 135 675 160 T 710 160 T 745 160 T 780 160;
                M 640 160 Q 658 120 675 160 T 710 160 T 745 160 T 780 160" 
        dur="5s" repeatCount="indefinite" />
    </path>

    <!-- Central Core Luminescence & Register Node -->
    <g class="pulse-core">
      <circle cx="710" cy="160" r="18" fill="#FF5522" opacity="0.25" />
      <circle cx="710" cy="160" r="8" fill="#FF5522" />
      <circle cx="710" cy="160" r="3" fill="#FFFFFF" />
    </g>

    <!-- Precision Horizontal Telemetry Axis -->
    <line x1="560" y1="160" x2="600" y2="160" stroke="#3A435E" stroke-width="1" stroke-dasharray="2 3" />
    <line x1="820" y1="160" x2="860" y2="160" stroke="#3A435E" stroke-width="1" stroke-dasharray="2 3" />
    <text x="710" y="298" fill="#475569" font-size="8.5" font-weight="500" letter-spacing="1.5" text-anchor="middle" class="mono">INSTRUMENT NO. 01 // CALIBRATED</text>
  </g>
</svg>