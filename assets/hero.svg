<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B12" />
      <stop offset="50%" stop-color="#0A0E18" />
      <stop offset="100%" stop-color="#06080E" />
    </linearGradient>

    <!-- Clean Typography and Accent Gradients (Zero Raster Filters) -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>

    <linearGradient id="cyanMint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#00F5A0" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#7F00FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00F5A0" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0" />
    </linearGradient>

    <!-- Pure Vector Radial Spotlight (Naturally blends with zero grey box artifacts) -->
    <radialGradient id="spotlight" cx="75%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.08" />
      <stop offset="50%" stop-color="#7F00FF" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#080B12" stop-opacity="0" />
    </radialGradient>

    <!-- Precision Dot Grid -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#1E293B" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', 'Inter', Roboto, sans-serif; }
  </style>

  <!-- Canvas Surface -->
  <rect width="900" height="300" rx="14" fill="url(#bgGrad)" />
  <rect width="900" height="300" rx="14" fill="url(#dotGrid)" />
  <rect width="900" height="300" rx="14" fill="url(#spotlight)" />
  <rect width="900" height="300" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="1.2" />

  <!-- Corner Brackets -->
  <path d="M 14 30 L 14 14 L 30 14" fill="none" stroke="#00F2FE" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 886 30 L 886 14 L 870 14" fill="none" stroke="#00F2FE" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 14 270 L 14 286 L 30 286" fill="none" stroke="#7F00FF" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 886 270 L 886 286 L 870 286" fill="none" stroke="#00F5A0" stroke-width="1.8" stroke-linecap="round" />

  <!-- Laser Scanning Line (Pure Vector) -->
  <line x1="20" y1="20" x2="880" y2="20" stroke="url(#laserGrad)" stroke-width="1.5">
    <animate attributeName="y1" values="20; 280; 20" dur="6.5s" repeatCount="indefinite" />
    <animate attributeName="y2" values="20; 280; 20" dur="6.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.2; 0.8; 0.2" dur="6.5s" repeatCount="indefinite" />
  </line>

  <!-- Left Content Column -->
  <g transform="translate(48, 40)">
    <!-- Status Pill -->
    <g transform="translate(0, 0)">
      <rect width="186" height="26" rx="13" fill="#0C1322" stroke="#1E2E48" stroke-width="1" />
      <circle cx="15" cy="13" r="4" fill="#00F5A0">
        <animate attributeName="opacity" values="1; 0.35; 1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="17" fill="#00F5A0" font-size="10" font-weight="700" letter-spacing="1.2" class="mono">SYSTEMS OPERATIONAL</text>
    </g>

    <!-- Sub-tag Protocol -->
    <text x="202" y="18" fill="#64748B" font-size="10.5" font-weight="600" letter-spacing="1.8" class="mono">// SOVEREIGN ARCHITECTURE</text>

    <!-- Main Title: DECOY (Crisp Single-Layer Vector) -->
    <g transform="translate(0, 68)">
      <text x="0" y="0" fill="url(#cyanGrad)" font-size="50" font-weight="900" letter-spacing="3" class="sans">DECOY</text>
      <!-- Sleek Year Badge -->
      <g transform="translate(186, -37)">
        <rect width="68" height="20" rx="4" fill="#111827" stroke="#374151" stroke-width="1" />
        <text x="34" y="14" fill="#9CA3AF" font-size="9.5" font-weight="700" text-anchor="middle" letter-spacing="1.5" class="mono">IN // 2026</text>
      </g>
    </g>

    <!-- Manifesto Headline -->
    <text x="0" y="98" fill="#FFFFFF" font-size="14.5" font-weight="700" letter-spacing="1.2" class="sans">ARCHITECTING NEXT-GEN SYSTEMS &amp; AGENTIC AI</text>

    <!-- Subtitle Description -->
    <text x="0" y="122" fill="#94A3B8" font-size="12" font-weight="400" letter-spacing="0.3" class="sans">High-throughput concurrency, autonomous voice pipelines &amp; sovereign data ledgers.</text>

    <!-- 4 Minimalist Telemetry Metric Boxes (Zero Overlaps, Clean 1px Borders) -->
    <g transform="translate(0, 150)">
      <!-- Tile 1 -->
      <g transform="translate(0, 0)">
        <rect width="112" height="42" rx="6" fill="#0A0F1D" stroke="#1E293B" stroke-width="1" />
        <text x="12" y="16" fill="#64748B" font-size="8.5" font-weight="600" letter-spacing="1" class="mono">CORE LATENCY</text>
        <text x="12" y="33" fill="#00F2FE" font-size="13" font-weight="700" class="mono">&lt; 0.18 ms</text>
      </g>

      <!-- Tile 2 -->
      <g transform="translate(122, 0)">
        <rect width="112" height="42" rx="6" fill="#0A0F1D" stroke="#1E293B" stroke-width="1" />
        <text x="12" y="16" fill="#64748B" font-size="8.5" font-weight="600" letter-spacing="1" class="mono">IO MODEL</text>
        <text x="12" y="33" fill="#00F5A0" font-size="13" font-weight="700" class="mono">NON-BLOCK</text>
      </g>

      <!-- Tile 3 -->
      <g transform="translate(244, 0)">
        <rect width="128" height="42" rx="6" fill="#0A0F1D" stroke="#1E293B" stroke-width="1" />
        <text x="12" y="16" fill="#64748B" font-size="8.5" font-weight="600" letter-spacing="1" class="mono">AI RUNTIME</text>
        <text x="12" y="33" fill="#A78BFA" font-size="13" font-weight="700" class="mono">MULTI-AGENTIC</text>
      </g>

      <!-- Tile 4 -->
      <g transform="translate(382, 0)">
        <rect width="108" height="42" rx="6" fill="#0A0F1D" stroke="#1E293B" stroke-width="1" />
        <text x="12" y="16" fill="#64748B" font-size="8.5" font-weight="600" letter-spacing="1" class="mono">NODES</text>
        <text x="12" y="33" fill="#FBBF24" font-size="13" font-weight="700" class="mono">6 DEPLOYED</text>
      </g>
    </g>
  </g>

  <!-- Right Visual: High-Precision Cybernetic Monogram (Centered at (720, 150)) -->
  <g transform="translate(720, 150)">
    <!-- Radar Ticks and Hairlines -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 6" />
    <circle cx="0" cy="0" r="78" fill="none" stroke="#1E2E48" stroke-width="1" />
    <circle cx="0" cy="0" r="50" fill="none" stroke="#253754" stroke-width="1" stroke-dasharray="2 4" />
    <line x1="-115" y1="0" x2="115" y2="0" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 6" />
    <line x1="0" y1="-115" x2="0" y2="115" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 6" />

    <!-- Rotating Outer Vector Ring -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite" />
      <circle cx="0" cy="0" r="90" fill="none" stroke="url(#borderGrad)" stroke-width="1.6" stroke-dasharray="35 70 15 50" />
      <circle cx="90" cy="0" r="4" fill="#00F2FE" />
      <circle cx="-90" cy="0" r="3" fill="#7F00FF" />
      <circle cx="0" cy="90" r="3.5" fill="#00F5A0" />
    </g>

    <!-- Counter-Rotating Inner Vector Ring -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="14s" repeatCount="indefinite" />
      <circle cx="0" cy="0" r="66" fill="none" stroke="#00F2FE" stroke-width="1.2" stroke-dasharray="24 36 12 40" stroke-opacity="0.6" />
      <polygon points="66,0 70,-4 74,0 70,4" fill="#00F2FE" />
      <polygon points="-66,0 -70,-4 -74,0 -70,4" fill="#7F00FF" />
    </g>

    <!-- Central Geometric Hexagon Core -->
    <polygon points="0,-36 31,-18 31,18 0,36 -31,18 -31,-18" fill="#080D1A" stroke="url(#cyanGrad)" stroke-width="2" />

    <!-- Inner Geometric 'D' Emblem -->
    <path d="M -14 -18 L 4 -18 C 16 -18 22 -10 22 0 C 22 10 16 18 4 18 L -14 18 Z M -6 -10 L -6 10 L 3 10 C 10 10 14 6 14 0 C 14 -6 10 -10 3 -10 Z" 
          fill="url(#cyanMint)" />

    <!-- Perimeter Nodes -->
    <circle cx="0" cy="-36" r="2.5" fill="#00F2FE" />
    <circle cx="31" cy="-18" r="2.5" fill="#7F00FF" />
    <circle cx="31" cy="18" r="2.5" fill="#00F5A0" />
    <circle cx="0" cy="36" r="2.5" fill="#00F2FE" />
    <circle cx="-31" cy="18" r="2.5" fill="#7F00FF" />
    <circle cx="-31" cy="-18" r="2.5" fill="#00F5A0" />

    <!-- Telemetry Coordinates -->
    <text x="0" y="116" fill="#64748B" font-size="8.5" font-weight="600" text-anchor="middle" letter-spacing="1.5" class="mono">DELHI-NCR // 28.6139°N 77.2090°E</text>
  </g>
</svg>
