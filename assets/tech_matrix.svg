<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="920" height="240" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="tmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0F" />
      <stop offset="100%" stop-color="#0C0E17" />
    </linearGradient>
    <pattern id="tmGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#141824" stroke-width="0.75" />
    </pattern>
  </defs>
  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', 'Inter', sans-serif; }
    @keyframes pulseWire {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -40; }
    }
    .wire-flow { stroke-dasharray: 4 6; animation: pulseWire 2.5s linear infinite; }
  </style>

  <rect width="920" height="240" rx="8" fill="url(#tmBg)" />
  <rect width="920" height="240" rx="8" fill="url(#tmGrid)" />
  <rect width="920" height="240" rx="8" fill="none" stroke="#1D2232" stroke-width="1.2" />

  <!-- Section Eyebrow -->
  <g transform="translate(36, 26)">
    <circle cx="4" cy="4" r="3" fill="#FF5522" />
    <text x="14" y="8" fill="#94A3B8" font-size="9.5" font-weight="600" letter-spacing="1.5" class="mono">SYSTEMS TOPOLOGY // ARCHITECTURAL STACK MATRIX</text>
  </g>

  <!-- 4 Architectural Layers (2x2 Grid with Precision 1px Borders) -->
  <g transform="translate(36, 52)">
    <!-- Column 1, Row 1: Low-Latency Systems -->
    <g transform="translate(0, 0)">
      <rect width="412" height="72" rx="4" fill="#0C0F17" stroke="#1E2436" stroke-width="1" />
      <text x="16" y="20" fill="#FF5522" font-size="9" font-weight="700" letter-spacing="1.2" class="mono">LAYER 01 // SYSTEMS &amp; RUNTIMES</text>
      <text x="16" y="38" fill="#F1F5F9" font-size="13" font-weight="600" class="sans">Rust · Java 21 (Loom) · C/C++ · Tokio Async</text>
      <text x="16" y="56" fill="#64748B" font-size="11" font-weight="400" class="sans">Lock-free queues, chunked byte allocation, memory-mapped I/O, zero-egress sandboxes.</text>
    </g>

    <!-- Column 2, Row 1: Vernacular AI -->
    <g transform="translate(436, 0)">
      <rect width="412" height="72" rx="4" fill="#0C0F17" stroke="#1E2436" stroke-width="1" />
      <text x="16" y="20" fill="#38BDF8" font-size="9" font-weight="700" letter-spacing="1.2" class="mono">LAYER 02 // VERNACULAR AI &amp; SPEECH</text>
      <text x="16" y="38" fill="#F1F5F9" font-size="13" font-weight="600" class="sans">LangGraph · FastAPI · Indic Whisper · Atlas Vector</text>
      <text x="16" y="56" fill="#64748B" font-size="11" font-weight="400" class="sans">Multi-agent DAG state machines, discrete token grounding, sub-3s voice dispatch.</text>
    </g>

    <!-- Column 1, Row 2: Persistence & Ledgers -->
    <g transform="translate(0, 88)">
      <rect width="412" height="72" rx="4" fill="#0C0F17" stroke="#1E2436" stroke-width="1" />
      <text x="16" y="20" fill="#10B981" font-size="9" font-weight="700" letter-spacing="1.2" class="mono">LAYER 03 // PERSISTENCE &amp; TRUST LEDGERS</text>
      <text x="16" y="38" fill="#F1F5F9" font-size="13" font-weight="600" class="sans">PostgreSQL Strict · MongoDB Replica · BullMQ · Redis</text>
      <text x="16" y="56" fill="#64748B" font-size="11" font-weight="400" class="sans">39-table relational migrations, advisory locks, cryptographic dual-consent escrows.</text>
    </g>

    <!-- Column 2, Row 2: Tactile Interface -->
    <g transform="translate(436, 88)">
      <rect width="412" height="72" rx="4" fill="#0C0F17" stroke="#1E2436" stroke-width="1" />
      <text x="16" y="20" fill="#E100FF" font-size="9" font-weight="700" letter-spacing="1.2" class="mono">LAYER 04 // TACTILE INTERACTION &amp; GRAPHICS</text>
      <text x="16" y="38" fill="#F1F5F9" font-size="13" font-weight="600" class="sans">TypeScript · Next.js · Canvas 2D · LivelyUI Springs</text>
      <text x="16" y="56" fill="#64748B" font-size="11" font-weight="400" class="sans">60fps kinetic micro-feedback, concentric radii, balanced typography, zero bloat.</text>
    </g>
  </g>
</svg>