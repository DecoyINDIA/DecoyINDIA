<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Base Canvas -->
    <linearGradient id="tmBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040711" />
      <stop offset="50%" stop-color="#070e1c" />
      <stop offset="100%" stop-color="#03050a" />
    </linearGradient>

    <!-- 1px Specular Border -->
    <linearGradient id="tmGlassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="25%" stop-color="#00F2FE" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#7F00FF" stop-opacity="0.3" />
      <stop offset="75%" stop-color="#FF6B00" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00F5A0" stop-opacity="0.6" />
    </linearGradient>

    <!-- Border Comet Gradient -->
    <linearGradient id="tmComet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0" />
      <stop offset="60%" stop-color="#00F2FE" stop-opacity="0.85" />
      <stop offset="90%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#7F00FF" stop-opacity="0" />
    </linearGradient>

    <!-- Aurora Wave Underglow -->
    <linearGradient id="tmAurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.14" />
      <stop offset="35%" stop-color="#7F00FF" stop-opacity="0.1" />
      <stop offset="70%" stop-color="#FF007F" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00F5A0" stop-opacity="0.12" />
    </linearGradient>

    <!-- Frosted Glass Card Faces -->
    <linearGradient id="glassCardFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#071224" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#040913" stop-opacity="0.8" />
    </linearGradient>

    <pattern id="tmGrid2" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#142135" stroke-width="0.5" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="0.75" fill="#00F2FE" fill-opacity="0.3" />
    </pattern>

    <!-- Liquid Glass Specular Filter -->
    <filter id="glassRefractTm" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur" />
      <feSpecularLighting in="blur" surfaceScale="2.5" specularConstant="1.4" specularExponent="24" lighting-color="#ffffff" result="specular">
        <feDistantLight azimuth="225" elevation="50" />
      </feSpecularLighting>
      <feComposite in="SourceGraphic" in2="specular" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" />
    </filter>

    <filter id="softGlowTm" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    @keyframes tmCometRun {
      0% { stroke-dashoffset: 2260; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes tmBusFlow {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes tmUnderglowDrift {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-16px) scale(1.05); }
    }

    .card-comet-tm {
      stroke-dasharray: 120 2140;
      animation: tmCometRun 7.2s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
    }
    .bus-stream {
      stroke-dasharray: 6 10;
      animation: tmBusFlow 1.6s linear infinite;
    }
    .aurora-underglow {
      animation: tmUnderglowDrift 11.3s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      transform-origin: 450px 130px;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="900" height="260" rx="14" fill="url(#tmBg2)" />
  <rect width="900" height="260" rx="14" fill="url(#tmGrid2)" />

  <!-- Shimmering Aurora Underglow -->
  <path d="M -50 140 Q 240 60 500 180 T 950 110 L 950 260 L -50 260 Z" fill="url(#tmAurora)" class="aurora-underglow" filter="url(#softGlowTm)" />

  <!-- 1px Specular Border -->
  <rect width="900" height="260" rx="14" fill="none" stroke="url(#tmGlassBorder)" stroke-width="1.2" />

  <!-- React-Bits Border Comet -->
  <rect width="900" height="260" rx="14" fill="none" stroke="url(#tmComet)" stroke-width="2.2" class="card-comet-tm" />

  <!-- Corner Brackets -->
  <path d="M 14 26 L 14 14 L 26 14" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-opacity="0.8" />
  <path d="M 886 26 L 886 14 L 874 14" fill="none" stroke="#00F5A0" stroke-width="1.6" />
  <path d="M 14 234 L 14 246 L 26 246" fill="none" stroke="#7F00FF" stroke-width="1.6" />
  <path d="M 886 234 L 886 246 L 874 246" fill="none" stroke="#FF6B00" stroke-width="1.6" />

  <!-- Header Bar -->
  <g transform="translate(32, 28)">
    <circle cx="5" cy="5" r="4" fill="#00F2FE" filter="url(#softGlowTm)" />
    <text x="18" y="9" fill="#00F2FE" font-size="11" font-weight="700" letter-spacing="1.5" class="mono">TECHNOLOGY ECOSYSTEM &amp; ARCHITECTURAL MATRIX</text>
    <text x="560" y="9" fill="#64748b" font-size="9.5" font-weight="600" class="mono">// 4 CORE SPECIALIZATIONS // HIGH-CONCURRENCY STACK</text>
  </g>

  <!-- Motherboard Active Data Bus Line -->
  <line x1="45" y1="52" x2="855" y2="52" stroke="#1b2a44" stroke-width="1" />
  <line x1="45" y1="52" x2="855" y2="52" stroke="#00F2FE" stroke-width="1.4" stroke-opacity="0.8" class="bus-stream" />

  <!-- Column 1: Low-Latency Systems -->
  <g transform="translate(32, 64)">
    <rect width="195" height="170" rx="8" fill="url(#glassCardFace)" stroke="url(#tmGlassBorder)" stroke-width="0.9" filter="url(#glassRefractTm)" />
    <path d="M 8 2 L 187 2" stroke="#ffffff" stroke-opacity="0.35" stroke-width="0.6" stroke-linecap="round" />
    
    <!-- Col Header with Crystal Chipset Node -->
    <g transform="translate(14, 16)">
      <polygon points="4,2 7,5 4,8 1,5" fill="#FF6B00" />
      <text x="14" y="9" fill="#FFAE00" font-size="10.5" font-weight="700" letter-spacing="0.8" class="mono">SYSTEMS CORE</text>
      <text x="0" y="24" fill="#ffffff" font-size="13" font-weight="800" class="sans">Low-Latency &amp; IO</text>
    </g>
    <!-- Tech List -->
    <g transform="translate(14, 52)">
      <g transform="translate(0, 0)">
        <rect width="167" height="24" rx="4" fill="#140903" stroke="#33180a" stroke-width="0.8" />
        <text x="8" y="16" fill="#FFAE00" font-size="10" font-weight="700" class="mono">Rust</text>
        <text x="55" y="15" fill="#94a3b8" font-size="9" class="mono">Tokio / Zero-Copy</text>
      </g>
      <g transform="translate(0, 29)">
        <rect width="167" height="24" rx="4" fill="#140903" stroke="#33180a" stroke-width="0.8" />
        <text x="8" y="16" fill="#FF6B00" font-size="10" font-weight="700" class="mono">Java 21+</text>
        <text x="65" y="15" fill="#94a3b8" font-size="9" class="mono">Virtual Threads</text>
      </g>
      <g transform="translate(0, 58)">
        <rect width="167" height="24" rx="4" fill="#140903" stroke="#33180a" stroke-width="0.8" />
        <text x="8" y="16" fill="#FFAE00" font-size="10" font-weight="700" class="mono">C / C++</text>
        <text x="60" y="15" fill="#94a3b8" font-size="9" class="mono">Memory Protocols</text>
      </g>
      <g transform="translate(0, 87)">
        <text x="0" y="15" fill="#64748b" font-size="8.5" font-weight="600" class="mono">METRIC: sub-millisecond IO</text>
      </g>
    </g>
  </g>

  <!-- Column 2: Interfaces and Frontend -->
  <g transform="translate(247, 64)">
    <rect width="195" height="170" rx="8" fill="url(#glassCardFace)" stroke="url(#tmGlassBorder)" stroke-width="0.9" filter="url(#glassRefractTm)" />
    <path d="M 8 2 L 187 2" stroke="#ffffff" stroke-opacity="0.35" stroke-width="0.6" stroke-linecap="round" />

    <!-- Col Header with Crystal Chipset Node -->
    <g transform="translate(14, 16)">
      <polygon points="4,2 7,5 4,8 1,5" fill="#00F2FE" />
      <text x="14" y="9" fill="#00F2FE" font-size="10.5" font-weight="700" letter-spacing="0.8" class="mono">INTERFACES</text>
      <text x="0" y="24" fill="#ffffff" font-size="13" font-weight="800" class="sans">Kinetic Telemetry</text>
    </g>
    <!-- Tech List -->
    <g transform="translate(14, 52)">
      <g transform="translate(0, 0)">
        <rect width="167" height="24" rx="4" fill="#071321" stroke="#122c47" stroke-width="0.8" />
        <text x="8" y="16" fill="#00F2FE" font-size="10" font-weight="700" class="mono">TypeScript</text>
        <text x="80" y="15" fill="#94a3b8" font-size="9" class="mono">Strict Typing</text>
      </g>
      <g transform="translate(0, 29)">
        <rect width="167" height="24" rx="4" fill="#071321" stroke="#122c47" stroke-width="0.8" />
        <text x="8" y="16" fill="#38bdf8" font-size="10" font-weight="700" class="mono">Next.js 15</text>
        <text x="75" y="15" fill="#94a3b8" font-size="9" class="mono">App Router / SSR</text>
      </g>
      <g transform="translate(0, 58)">
        <rect width="167" height="24" rx="4" fill="#071321" stroke="#122c47" stroke-width="0.8" />
        <text x="8" y="16" fill="#00F2FE" font-size="10" font-weight="700" class="mono">Tailwind</text>
        <text x="70" y="15" fill="#94a3b8" font-size="9" class="mono">Precision Tokens</text>
      </g>
      <g transform="translate(0, 87)">
        <text x="0" y="15" fill="#64748b" font-size="8.5" font-weight="600" class="mono">METRIC: 60fps kinetic visual UI</text>
      </g>
    </g>
  </g>

  <!-- Column 3: AI and Agentic Intelligence -->
  <g transform="translate(462, 64)">
    <rect width="195" height="170" rx="8" fill="url(#glassCardFace)" stroke="url(#tmGlassBorder)" stroke-width="0.9" filter="url(#glassRefractTm)" />
    <path d="M 8 2 L 187 2" stroke="#ffffff" stroke-opacity="0.35" stroke-width="0.6" stroke-linecap="round" />

    <!-- Col Header with Crystal Chipset Node -->
    <g transform="translate(14, 16)">
      <polygon points="4,2 7,5 4,8 1,5" fill="#E100FF" />
      <text x="14" y="9" fill="#c084fc" font-size="10.5" font-weight="700" letter-spacing="0.8" class="mono">AGENTIC INTELLIGENCE</text>
      <text x="0" y="24" fill="#ffffff" font-size="13" font-weight="800" class="sans">Voice, CV &amp; LLM</text>
    </g>
    <!-- Tech List -->
    <g transform="translate(14, 52)">
      <g transform="translate(0, 0)">
        <rect width="167" height="24" rx="4" fill="#140a26" stroke="#2c174f" stroke-width="0.8" />
        <text x="8" y="16" fill="#c084fc" font-size="10" font-weight="700" class="mono">Python</text>
        <text x="60" y="15" fill="#94a3b8" font-size="9" class="mono">FastAPI / PyTorch</text>
      </g>
      <g transform="translate(0, 29)">
        <rect width="167" height="24" rx="4" fill="#140a26" stroke="#2c174f" stroke-width="0.8" />
        <text x="8" y="16" fill="#E100FF" font-size="10" font-weight="700" class="mono">Voice / CV</text>
        <text x="75" y="15" fill="#94a3b8" font-size="9" class="mono">Whisper / YOLO</text>
      </g>
      <g transform="translate(0, 58)">
        <rect width="167" height="24" rx="4" fill="#140a26" stroke="#2c174f" stroke-width="0.8" />
        <text x="8" y="16" fill="#a855f7" font-size="10" font-weight="700" class="mono">Agentic</text>
        <text x="65" y="15" fill="#94a3b8" font-size="9" class="mono">Tool Use / Swarms</text>
      </g>
      <g transform="translate(0, 87)">
        <text x="0" y="15" fill="#64748b" font-size="8.5" font-weight="600" class="mono">METRIC: 140ms voice inference</text>
      </g>
    </g>
  </g>

  <!-- Column 4: Cloud and Data Sovereignty -->
  <g transform="translate(677, 64)">
    <rect width="191" height="170" rx="8" fill="url(#glassCardFace)" stroke="url(#tmGlassBorder)" stroke-width="0.9" filter="url(#glassRefractTm)" />
    <path d="M 8 2 L 183 2" stroke="#ffffff" stroke-opacity="0.35" stroke-width="0.6" stroke-linecap="round" />

    <!-- Col Header with Crystal Chipset Node -->
    <g transform="translate(14, 16)">
      <polygon points="4,2 7,5 4,8 1,5" fill="#00F5A0" />
      <text x="14" y="9" fill="#00F5A0" font-size="10.5" font-weight="700" letter-spacing="0.8" class="mono">DATA &amp; INFRA</text>
      <text x="0" y="24" fill="#ffffff" font-size="13" font-weight="800" class="sans">Sovereign Cloud</text>
    </g>
    <!-- Tech List -->
    <g transform="translate(14, 52)">
      <g transform="translate(0, 0)">
        <rect width="163" height="24" rx="4" fill="#071c15" stroke="#123b2c" stroke-width="0.8" />
        <text x="8" y="16" fill="#00F5A0" font-size="10" font-weight="700" class="mono">PostgreSQL</text>
        <text x="78" y="15" fill="#94a3b8" font-size="9" class="mono">JSONB / pgvector</text>
      </g>
      <g transform="translate(0, 29)">
        <rect width="163" height="24" rx="4" fill="#071c15" stroke="#123b2c" stroke-width="0.8" />
        <text x="8" y="16" fill="#2dd4bf" font-size="10" font-weight="700" class="mono">Docker / K8s</text>
        <text x="88" y="15" fill="#94a3b8" font-size="9" class="mono">Container Mesh</text>
      </g>
      <g transform="translate(0, 58)">
        <rect width="163" height="24" rx="4" fill="#071c15" stroke="#123b2c" stroke-width="0.8" />
        <text x="8" y="16" fill="#00F5A0" font-size="10" font-weight="700" class="mono">WebSockets</text>
        <text x="82" y="15" fill="#94a3b8" font-size="9" class="mono">Real-time PubSub</text>
      </g>
      <g transform="translate(0, 87)">
        <text x="0" y="15" fill="#64748b" font-size="8.5" font-weight="600" class="mono">METRIC: Zero-loss persistence</text>
      </g>
    </g>
  </g>
</svg>
