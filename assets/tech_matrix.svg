<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="tmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="50%" stop-color="#0a101f" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>

    <linearGradient id="tmBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.6" />
      <stop offset="33%" stop-color="#7F00FF" stop-opacity="0.3" />
      <stop offset="66%" stop-color="#FF6B00" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00F5A0" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FF6B00" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7F00FF" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#7F00FF" stop-opacity="0.02" />
    </linearGradient>

    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F5A0" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00F5A0" stop-opacity="0.02" />
    </linearGradient>

    <pattern id="tmGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#172338" stroke-width="0.6" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="0.75" fill="#4FACFE" fill-opacity="0.3" />
    </pattern>

    <filter id="tmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    @keyframes busPulse {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes cardBreathe {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }

    .bus-line {
      stroke-dasharray: 6 8;
      animation: busPulse 2s linear infinite;
    }
    .card-pulse {
      animation: cardBreathe 3s ease-in-out infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="900" height="260" rx="14" fill="url(#tmBg)" />
  <rect width="900" height="260" rx="14" fill="url(#tmGrid)" />
  <rect width="900" height="260" rx="14" fill="none" stroke="url(#tmBorder)" stroke-width="1.2" />

  <!-- Corner Brackets -->
  <path d="M 14 28 L 14 14 L 28 14" fill="none" stroke="#00F2FE" stroke-width="1.5" />
  <path d="M 886 28 L 886 14 L 872 14" fill="none" stroke="#00F5A0" stroke-width="1.5" />
  <path d="M 14 232 L 14 246 L 28 246" fill="none" stroke="#7F00FF" stroke-width="1.5" />
  <path d="M 886 232 L 886 246 L 872 246" fill="none" stroke="#FF6B00" stroke-width="1.5" />

  <!-- Header Bar -->
  <g transform="translate(32, 28)">
    <circle cx="5" cy="5" r="4" fill="#00F2FE" filter="url(#tmGlow)" />
    <text x="18" y="9" fill="#00F2FE" font-size="11" font-weight="700" letter-spacing="1.5" class="mono">TECHNOLOGY ECOSYSTEM &amp; ARCHITECTURAL MATRIX</text>
    <text x="560" y="9" fill="#64748b" font-size="9.5" font-weight="600" class="mono">// 4 CORE SPECIALIZATIONS // HIGH-CONCURRENCY STACK</text>
  </g>

  <!-- Data Bus Connecting Columns -->
  <line x1="45" y1="52" x2="855" y2="52" stroke="#1e2d47" stroke-width="1" />
  <line x1="45" y1="52" x2="855" y2="52" stroke="#00F2FE" stroke-width="1" stroke-opacity="0.6" class="bus-line" />

  <!-- Column 1: Low-Latency Systems -->
  <g transform="translate(32, 64)">
    <rect width="195" height="170" rx="8" fill="url(#cardGrad1)" stroke="#FF6B00" stroke-opacity="0.3" stroke-width="1" />
    <!-- Col Header -->
    <g transform="translate(14, 16)">
      <circle cx="4" cy="5" r="3.5" fill="#FF6B00" />
      <text x="14" y="9" fill="#FFAE00" font-size="10.5" font-weight="700" letter-spacing="0.8" class="mono">SYSTEMS CORE</text>
      <text x="0" y="24" fill="#e2e8f0" font-size="13" font-weight="700" class="sans">Low-Latency &amp; IO</text>
    </g>
    <!-- Tech List -->
    <g transform="translate(14, 52)">
      <!-- Tech 1 -->
      <g transform="translate(0, 0)">
        <rect width="167" height="24" rx="4" fill="#140a04" stroke="#33180a" stroke-width="0.8" />
        <text x="8" y="16" fill="#FFAE00" font-size="10" font-weight="700" class="mono">Rust</text>
        <text x="55" y="15" fill="#94a3b8" font-size="9" class="mono">Tokio / Zero-Copy</text>
      </g>
      <!-- Tech 2 -->
      <g transform="translate(0, 29)">
        <rect width="167" height="24" rx="4" fill="#140a04" stroke="#33180a" stroke-width="0.8" />
        <text x="8" y="16" fill="#FF6B00" font-size="10" font-weight="700" class="mono">Java 21+</text>
        <text x="65" y="15" fill="#94a3b8" font-size="9" class="mono">Virtual Threads</text>
      </g>
      <!-- Tech 3 -->
      <g transform="translate(0, 58)">
        <rect width="167" height="24" rx="4" fill="#140a04" stroke="#33180a" stroke-width="0.8" />
        <text x="8" y="16" fill="#FFAE00" font-size="10" font-weight="700" class="mono">C / C++</text>
        <text x="60" y="15" fill="#94a3b8" font-size="9" class="mono">Memory Protocols</text>
      </g>
      <!-- Tech 4 -->
      <g transform="translate(0, 87)">
        <text x="0" y="15" fill="#64748b" font-size="8.5" font-weight="600" class="mono">METRIC: sub-millisecond IO</text>
      </g>
    </g>
  </g>

  <!-- Column 2: Interfaces & Frontend -->
  <g transform="translate(247, 64)">
    <rect width="195" height="170" rx="8" fill="url(#cardGrad2)" stroke="#00F2FE" stroke-opacity="0.3" stroke-width="1" />
    <!-- Col Header -->
    <g transform="translate(14, 16)">
      <circle cx="4" cy="5" r="3.5" fill="#00F2FE" />
      <text x="14" y="9" fill="#00F2FE" font-size="10.5" font-weight="700" letter-spacing="0.8" class="mono">INTERFACES</text>
      <text x="0" y="24" fill="#e2e8f0" font-size="13" font-weight="700" class="sans">Kinetic Telemetry</text>
    </g>
    <!-- Tech List -->
    <g transform="translate(14, 52)">
      <!-- Tech 1 -->
      <g transform="translate(0, 0)">
        <rect width="167" height="24" rx="4" fill="#071321" stroke="#122c47" stroke-width="0.8" />
        <text x="8" y="16" fill="#00F2FE" font-size="10" font-weight="700" class="mono">TypeScript</text>
        <text x="80" y="15" fill="#94a3b8" font-size="9" class="mono">Strict Typing</text>
      </g>
      <!-- Tech 2 -->
      <g transform="translate(0, 29)">
        <rect width="167" height="24" rx="4" fill="#071321" stroke="#122c47" stroke-width="0.8" />
        <text x="8" y="16" fill="#38bdf8" font-size="10" font-weight="700" class="mono">Next.js 15</text>
        <text x="75" y="15" fill="#94a3b8" font-size="9" class="mono">App Router / SSR</text>
      </g>
      <!-- Tech 3 -->
      <g transform="translate(0, 58)">
        <rect width="167" height="24" rx="4" fill="#071321" stroke="#122c47" stroke-width="0.8" />
        <text x="8" y="16" fill="#00F2FE" font-size="10" font-weight="700" class="mono">Tailwind</text>
        <text x="70" y="15" fill="#94a3b8" font-size="9" class="mono">Precision Tokens</text>
      </g>
      <!-- Tech 4 -->
      <g transform="translate(0, 87)">
        <text x="0" y="15" fill="#64748b" font-size="8.5" font-weight="600" class="mono">METRIC: 60fps kinetic visual UI</text>
      </g>
    </g>
  </g>

  <!-- Column 3: AI & Agentic Intelligence -->
  <g transform="translate(462, 64)">
    <rect width="195" height="170" rx="8" fill="url(#cardGrad3)" stroke="#7F00FF" stroke-opacity="0.3" stroke-width="1" />
    <!-- Col Header -->
    <g transform="translate(14, 16)">
      <circle cx="4" cy="5" r="3.5" fill="#E100FF" />
      <text x="14" y="9" fill="#c084fc" font-size="10.5" font-weight="700" letter-spacing="0.8" class="mono">AGENTIC INTELLIGENCE</text>
      <text x="0" y="24" fill="#e2e8f0" font-size="13" font-weight="700" class="sans">Voice, CV &amp; LLM</text>
    </g>
    <!-- Tech List -->
    <g transform="translate(14, 52)">
      <!-- Tech 1 -->
      <g transform="translate(0, 0)">
        <rect width="167" height="24" rx="4" fill="#140a26" stroke="#2c174f" stroke-width="0.8" />
        <text x="8" y="16" fill="#c084fc" font-size="10" font-weight="700" class="mono">Python</text>
        <text x="60" y="15" fill="#94a3b8" font-size="9" class="mono">FastAPI / PyTorch</text>
      </g>
      <!-- Tech 2 -->
      <g transform="translate(0, 29)">
        <rect width="167" height="24" rx="4" fill="#140a26" stroke="#2c174f" stroke-width="0.8" />
        <text x="8" y="16" fill="#E100FF" font-size="10" font-weight="700" class="mono">Voice / CV</text>
        <text x="75" y="15" fill="#94a3b8" font-size="9" class="mono">Whisper / YOLO</text>
      </g>
      <!-- Tech 3 -->
      <g transform="translate(0, 58)">
        <rect width="167" height="24" rx="4" fill="#140a26" stroke="#2c174f" stroke-width="0.8" />
        <text x="8" y="16" fill="#a855f7" font-size="10" font-weight="700" class="mono">Agentic</text>
        <text x="65" y="15" fill="#94a3b8" font-size="9" class="mono">Tool Use / Swarms</text>
      </g>
      <!-- Tech 4 -->
      <g transform="translate(0, 87)">
        <text x="0" y="15" fill="#64748b" font-size="8.5" font-weight="600" class="mono">METRIC: 140ms voice inference</text>
      </g>
    </g>
  </g>

  <!-- Column 4: Cloud & Data Sovereignty -->
  <g transform="translate(677, 64)">
    <rect width="191" height="170" rx="8" fill="url(#cardGrad4)" stroke="#00F5A0" stroke-opacity="0.3" stroke-width="1" />
    <!-- Col Header -->
    <g transform="translate(14, 16)">
      <circle cx="4" cy="5" r="3.5" fill="#00F5A0" />
      <text x="14" y="9" fill="#00F5A0" font-size="10.5" font-weight="700" letter-spacing="0.8" class="mono">DATA &amp; INFRA</text>
      <text x="0" y="24" fill="#e2e8f0" font-size="13" font-weight="700" class="sans">Sovereign Cloud</text>
    </g>
    <!-- Tech List -->
    <g transform="translate(14, 52)">
      <!-- Tech 1 -->
      <g transform="translate(0, 0)">
        <rect width="163" height="24" rx="4" fill="#071c15" stroke="#123b2c" stroke-width="0.8" />
        <text x="8" y="16" fill="#00F5A0" font-size="10" font-weight="700" class="mono">PostgreSQL</text>
        <text x="78" y="15" fill="#94a3b8" font-size="9" class="mono">JSONB / pgvector</text>
      </g>
      <!-- Tech 2 -->
      <g transform="translate(0, 29)">
        <rect width="163" height="24" rx="4" fill="#071c15" stroke="#123b2c" stroke-width="0.8" />
        <text x="8" y="16" fill="#2dd4bf" font-size="10" font-weight="700" class="mono">Docker / K8s</text>
        <text x="88" y="15" fill="#94a3b8" font-size="9" class="mono">Container Mesh</text>
      </g>
      <!-- Tech 3 -->
      <g transform="translate(0, 58)">
        <rect width="163" height="24" rx="4" fill="#071c15" stroke="#123b2c" stroke-width="0.8" />
        <text x="8" y="16" fill="#00F5A0" font-size="10" font-weight="700" class="mono">WebSockets</text>
        <text x="82" y="15" fill="#94a3b8" font-size="9" class="mono">Real-time PubSub</text>
      </g>
      <!-- Tech 4 -->
      <g transform="translate(0, 87)">
        <text x="0" y="15" fill="#64748b" font-size="8.5" font-weight="600" class="mono">METRIC: Zero-loss persistence</text>
      </g>
    </g>
  </g>
</svg>
