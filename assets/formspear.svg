<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" width="440" height="200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Base Canvas -->
    <linearGradient id="fsBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060514" />
      <stop offset="55%" stop-color="#0f0c29" />
      <stop offset="100%" stop-color="#04030d" />
    </linearGradient>

    <!-- 1px Specular Border -->
    <linearGradient id="fsGlassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="30%" stop-color="#6366F1" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#00F2FE" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.5" />
    </linearGradient>

    <!-- Border Comet Gradient -->
    <linearGradient id="fsComet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0" />
      <stop offset="60%" stop-color="#00F2FE" stop-opacity="0.85" />
      <stop offset="90%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </linearGradient>

    <!-- Glass Terminal Face -->
    <linearGradient id="glassDashFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14" />
      <stop offset="40%" stop-color="#6366F1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00F2FE" stop-opacity="0.04" />
    </linearGradient>

    <pattern id="fsGrid2" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1d1945" stroke-width="0.5" stroke-opacity="0.5" />
      <circle cx="0" cy="0" r="0.7" fill="#6366F1" fill-opacity="0.3" />
    </pattern>

    <!-- Liquid Glass Specular Filter -->
    <filter id="glassRefractFs" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur" />
      <feSpecularLighting in="blur" surfaceScale="2.5" specularConstant="1.5" specularExponent="24" lighting-color="#ffffff" result="specular">
        <feDistantLight azimuth="225" elevation="50" />
      </feSpecularLighting>
      <feComposite in="SourceGraphic" in2="specular" operator="arithmetic" k1="0" k2="1" k3="1" k4="0" />
    </filter>

    <filter id="softGlowFs" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    @keyframes fsCometRun {
      0% { stroke-dashoffset: 1240; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes barFluid1 { 0%, 100% { height: 16px; y: 16px; } 50% { height: 34px; y: -2px; } }
    @keyframes barFluid2 { 0%, 100% { height: 30px; y: 2px; } 50% { height: 14px; y: 18px; } }
    @keyframes barFluid3 { 0%, 100% { height: 22px; y: 10px; } 50% { height: 38px; y: -6px; } }
    @keyframes barFluid4 { 0%, 100% { height: 36px; y: -4px; } 50% { height: 20px; y: 12px; } }

    @keyframes sparkDashFlow {
      0% { stroke-dashoffset: 130; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes aiCoreBreathe {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px #10B981); }
      50% { transform: scale(1.1); filter: drop-shadow(0 0 8px #00F2FE); }
    }

    .card-comet-fs {
      stroke-dasharray: 80 1160;
      animation: fsCometRun 5.8s cubic-bezier(0.25, 0.1, 0.25, 1) infinite;
    }
    .gbar-1 { animation: barFluid1 2.2s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .gbar-2 { animation: barFluid2 2.6s cubic-bezier(0.16, 1, 0.3, 1) infinite 0.2s; }
    .gbar-3 { animation: barFluid3 1.9s cubic-bezier(0.16, 1, 0.3, 1) infinite 0.4s; }
    .gbar-4 { animation: barFluid4 2.4s cubic-bezier(0.16, 1, 0.3, 1) infinite 0.1s; }
    .spark-flow { stroke-dasharray: 6 4; animation: sparkDashFlow 1.8s linear infinite; }
    .ai-core {
      animation: aiCoreBreathe 2.9s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      transform-origin: 383px 97px;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="440" height="200" rx="12" fill="url(#fsBg2)" />
  <rect width="440" height="200" rx="12" fill="url(#fsGrid2)" />
  <rect width="440" height="200" rx="12" fill="none" stroke="url(#fsGlassBorder)" stroke-width="1.2" />

  <!-- React-Bits Border Comet -->
  <rect width="440" height="200" rx="12" fill="none" stroke="url(#fsComet)" stroke-width="2" class="card-comet-fs" />

  <!-- Corner Brackets -->
  <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8" />
  <path d="M 428 24 L 428 12 L 416 12" fill="none" stroke="#00F2FE" stroke-width="1.5" />
  <path d="M 12 176 L 12 188 L 24 188" fill="none" stroke="#8B5CF6" stroke-width="1.5" />
  <path d="M 428 176 L 428 188 L 416 188" fill="none" stroke="#6366F1" stroke-width="1.5" />

  <!-- Ambient Light Spotlight -->
  <circle cx="345" cy="75" r="70" fill="#6366F1" opacity="0.1" filter="url(#softGlowFs)" />

  <!-- Left Header and Info -->
  <g transform="translate(24, 26)">
    <!-- Glass Category Pill -->
    <rect width="144" height="22" rx="6" fill="#16123e" fill-opacity="0.85" stroke="url(#fsGlassBorder)" stroke-width="0.9" filter="url(#glassRefractFs)" />
    <path d="M 6 2 L 138 2" stroke="#ffffff" stroke-opacity="0.4" stroke-width="0.6" stroke-linecap="round" />
    <text x="72" y="15" fill="#a5b4fc" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1" class="mono">FORMS // AI ANALYTICS</text>

    <!-- Title with Specular Lighting -->
    <text x="0" y="52" fill="#ffffff" font-size="24" font-weight="900" letter-spacing="0.5" class="sans" filter="url(#glassRefractFs)">Formspear</text>
    <text x="130" y="50" fill="#64748b" font-size="11" font-weight="600" class="mono">v2.1</text>

    <!-- Description -->
    <text x="0" y="73" fill="#94a3b8" font-size="11.5" font-weight="400" class="sans">Dynamic schema builder &amp; live AI telemetry</text>

    <!-- Frosted Glass Telemetry Box -->
    <g transform="translate(0, 92)">
      <rect width="210" height="48" rx="7" fill="#0b0920" fill-opacity="0.8" stroke="url(#fsGlassBorder)" stroke-width="0.9" filter="url(#glassRefractFs)" />
      <path d="M 6 2 L 204 2" stroke="#ffffff" stroke-opacity="0.3" stroke-width="0.6" stroke-linecap="round" />
      
      <text x="10" y="16" fill="#64748b" font-size="8.5" font-weight="600" letter-spacing="0.8" class="mono">INGESTION LATENCY</text>
      <text x="10" y="36" fill="#00F2FE" font-size="13" font-weight="700" class="mono">12 ms</text>
      <text x="64" y="35" fill="#a5b4fc" font-size="9.5" font-weight="600" class="mono">| SCHEMA: DYNAMIC</text>
      <text x="10" y="45" fill="#64748b" font-size="8" font-weight="500" class="mono">AI AGENT FORM AUTOMATION</text>
    </g>
  </g>

  <!-- Right Visual: Translucent Glass Dashboard and Floating Sparklines -->
  <g transform="translate(345, 75)">
    <!-- Glass Terminal Window -->
    <g filter="url(#glassRefractFs)">
      <rect x="-56" y="-36" width="112" height="76" rx="7" fill="url(#glassDashFace)" stroke="url(#fsGlassBorder)" stroke-width="1.3" />
      <!-- Window Title Bar -->
      <rect x="-56" y="-36" width="112" height="15" rx="7 7 0 0" fill="#14103c" />
      <circle cx="-47" cy="-29" r="2.2" fill="#ef4444" />
      <circle cx="-41" cy="-29" r="2.2" fill="#eab308" />
      <circle cx="-35" cy="-29" r="2.2" fill="#22c55e" />
      <text x="6" y="-25" fill="#a5b4fc" font-size="7.5" font-weight="600" text-anchor="middle" class="mono">SCHEMA.STREAM</text>
    </g>

    <!-- Dynamic Telemetry Bars -->
    <g transform="translate(-46, -4)">
      <rect x="0" y="16" width="11" height="16" rx="2" fill="#6366F1" class="gbar-1" />
      <rect x="16" y="2" width="11" height="30" rx="2" fill="#8B5CF6" class="gbar-2" />
      <rect x="32" y="10" width="11" height="22" rx="2" fill="#00F2FE" class="gbar-3" />
      <rect x="48" y="-4" width="11" height="36" rx="2" fill="#10B981" class="gbar-4" />
    </g>

    <!-- Floating Analytic Sparkline Wave -->
    <path d="M -46 16 Q -26 -12 -6 6 T 36 -16" fill="none" stroke="#00F2FE" stroke-width="1.6" class="spark-flow" />
    <circle cx="36" cy="-16" r="3.2" fill="#00F2FE" filter="url(#softGlowFs)" />

    <!-- AI Intelligence Check Core -->
    <g class="ai-core" transform="translate(38, 22)">
      <circle cx="0" cy="0" r="11" fill="#09281e" stroke="#10B981" stroke-width="1.2" />
      <path d="M -4 0 L -1 3 L 4 -3" fill="none" stroke="#10B981" stroke-width="1.4" stroke-linecap="round" />
    </g>

    <!-- Telemetry Coordinates -->
    <text x="0" y="54" fill="#64748b" font-size="8" font-weight="600" text-anchor="middle" class="mono">REAL-TIME TELEMETRY</text>
  </g>

  <!-- Bottom Tag Bar -->
  <g transform="translate(24, 172)">
    <circle cx="4" cy="5" r="3" fill="#6366F1" />
    <text x="14" y="8" fill="#64748b" font-size="9" font-weight="600" class="mono">FULLSTACK SCHEMA ARCHITECTURE</text>
    <text x="210" y="8" fill="#64748b" font-size="9" font-weight="600" class="mono">LIVE ANALYTICS</text>
  </g>
</svg>
