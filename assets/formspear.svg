<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" width="440" height="200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="fsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080718" />
      <stop offset="60%" stop-color="#100d2b" />
      <stop offset="100%" stop-color="#050410" />
    </linearGradient>

    <linearGradient id="fsBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00F2FE" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="indigoCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>

    <pattern id="fsGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1d1945" stroke-width="0.5" stroke-opacity="0.6" />
    </pattern>

    <filter id="fsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    @keyframes barOscillate1 { 0%, 100% { height: 16px; y: 16px; } 50% { height: 32px; y: 0px; } }
    @keyframes barOscillate2 { 0%, 100% { height: 28px; y: 4px; } 50% { height: 14px; y: 18px; } }
    @keyframes barOscillate3 { 0%, 100% { height: 22px; y: 10px; } 50% { height: 36px; y: -4px; } }
    @keyframes barOscillate4 { 0%, 100% { height: 34px; y: -2px; } 50% { height: 20px; y: 12px; } }

    @keyframes sparkDash {
      0% { stroke-dashoffset: 120; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes schemaPulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.06); opacity: 1; }
    }

    .fbar-1 { animation: barOscillate1 2s ease-in-out infinite; }
    .fbar-2 { animation: barOscillate2 2.4s ease-in-out infinite 0.2s; }
    .fbar-3 { animation: barOscillate3 1.8s ease-in-out infinite 0.4s; }
    .fbar-4 { animation: barOscillate4 2.2s ease-in-out infinite 0.1s; }
    .spark-line { stroke-dasharray: 6 4; animation: sparkDash 2s linear infinite; }
    .schema-node { animation: schemaPulse 2.8s ease-in-out infinite; transform-origin: 345px 75px; }
  </style>

  <!-- Background Canvas -->
  <rect width="440" height="200" rx="12" fill="url(#fsBg)" />
  <rect width="440" height="200" rx="12" fill="url(#fsGrid)" />
  <rect width="440" height="200" rx="12" fill="none" stroke="url(#fsBorder)" stroke-width="1.2" />

  <!-- Corner Brackets -->
  <path d="M 12 25 L 12 12 L 25 12" fill="none" stroke="#6366F1" stroke-width="1.5" />
  <path d="M 428 25 L 428 12 L 415 12" fill="none" stroke="#00F2FE" stroke-width="1.5" />
  <path d="M 12 175 L 12 188 L 25 188" fill="none" stroke="#8B5CF6" stroke-width="1.5" />
  <path d="M 428 175 L 428 188 L 415 188" fill="none" stroke="#6366F1" stroke-width="1.5" />

  <!-- Ambient Light Orbs -->
  <circle cx="345" cy="75" r="55" fill="#6366F1" opacity="0.1" filter="url(#fsGlow)" />

  <!-- Left Header & Info -->
  <g transform="translate(24, 28)">
    <!-- Category Pill -->
    <rect width="144" height="20" rx="4" fill="#15123d" stroke="#6366F1" stroke-width="0.8" />
    <text x="72" y="14" fill="#a5b4fc" font-size="9" font-weight="700" text-anchor="middle" letter-spacing="1" class="mono">FORMS // AI ANALYTICS</text>

    <!-- Title -->
    <text x="0" y="48" fill="#ffffff" font-size="22" font-weight="800" letter-spacing="0.5" class="sans">Formspear</text>
    <text x="120" y="47" fill="#64748b" font-size="11" font-weight="600" class="mono">v2.1</text>

    <!-- Description -->
    <text x="0" y="70" fill="#94a3b8" font-size="11.5" font-weight="400" class="sans">Dynamic schema builder &amp; live AI telemetry</text>

    <!-- Telemetry Box -->
    <g transform="translate(0, 92)">
      <rect width="210" height="48" rx="6" fill="#0b0a1f" stroke="#221e54" stroke-width="1" />
      
      <text x="10" y="16" fill="#64748b" font-size="8.5" font-weight="600" letter-spacing="0.8" class="mono">INGESTION LATENCY</text>
      <text x="10" y="36" fill="#00F2FE" font-size="13" font-weight="700" class="mono">12 ms</text>
      <text x="64" y="35" fill="#a5b4fc" font-size="9.5" font-weight="600" class="mono">| SCHEMA: DYNAMIC</text>
      <text x="10" y="45" fill="#64748b" font-size="8" font-weight="500" class="mono">AI AGENT FORM AUTOMATION</text>
    </g>
  </g>

  <!-- Right Visual: Reactive Form Schema & Live Analytics Dashboard -->
  <g transform="translate(345, 75)">
    <!-- Schema Window Frame -->
    <rect x="-55" y="-35" width="110" height="74" rx="6" fill="#0a0820" stroke="#3730a3" stroke-width="1.2" />
    <!-- Window Header -->
    <rect x="-55" y="-35" width="110" height="14" rx="6" fill="#14113b" />
    <circle cx="-47" cy="-28" r="2" fill="#ef4444" />
    <circle cx="-41" cy="-28" r="2" fill="#eab308" />
    <circle cx="-35" cy="-28" r="2" fill="#22c55e" />
    <text x="5" y="-25" fill="#a5b4fc" font-size="7" font-weight="600" text-anchor="middle" class="mono">SCHEMA.STREAM</text>

    <!-- Live Bar Chart in Frame -->
    <g transform="translate(-45, -5)">
      <rect x="0" y="16" width="10" height="16" rx="2" fill="#6366F1" class="fbar-1" />
      <rect x="15" y="4" width="10" height="28" rx="2" fill="#8B5CF6" class="fbar-2" />
      <rect x="30" y="10" width="10" height="22" rx="2" fill="#00F2FE" class="fbar-3" />
      <rect x="45" y="-2" width="10" height="34" rx="2" fill="#10B981" class="fbar-4" />
    </g>

    <!-- Sparkline Overlay -->
    <path d="M -45 15 Q -25 -10 -5 5 T 35 -15" fill="none" stroke="#00F2FE" stroke-width="1.5" class="spark-line" />
    <circle cx="35" cy="-15" r="3" fill="#00F2FE" filter="url(#fsGlow)" />

    <!-- Schema Validation Checkmark -->
    <g class="schema-node" transform="translate(38, 22)">
      <circle cx="0" cy="0" r="10" fill="#082b20" stroke="#10B981" stroke-width="1" />
      <path d="M -4 0 L -1 3 L 4 -3" fill="none" stroke="#10B981" stroke-width="1.3" stroke-linecap="round" />
    </g>

    <!-- Coordinates / Tag -->
    <text x="0" y="52" fill="#64748b" font-size="8" font-weight="600" text-anchor="middle" class="mono">REAL-TIME TELEMETRY</text>
  </g>

  <!-- Bottom Tag Bar -->
  <g transform="translate(24, 172)">
    <circle cx="4" cy="5" r="3" fill="#6366F1" />
    <text x="14" y="8" fill="#64748b" font-size="9" font-weight="600" class="mono">FULLSTACK SCHEMA ARCHITECTURE</text>
    <text x="210" y="8" fill="#64748b" font-size="9" font-weight="600" class="mono">LIVE ANALYTICS</text>
  </g>
</svg>
