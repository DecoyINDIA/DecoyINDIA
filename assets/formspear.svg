<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 220" width="440" height="220" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="fBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090B10" />
      <stop offset="100%" stop-color="#0E121A" />
    </linearGradient>
    <pattern id="fGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#141824" stroke-width="0.75" />
    </pattern>
  </defs>
  <style>
    .mono { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Consolas', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', 'Inter', sans-serif; }
  </style>

  <rect width="440" height="220" rx="8" fill="url(#fBg)" />
  <rect width="440" height="220" rx="8" fill="url(#fGrid)" />
  <rect width="440" height="220" rx="8" fill="none" stroke="#1E2435" stroke-width="1.2" />

  <!-- Header Section -->
  <g transform="translate(24, 28)">
    <circle cx="4" cy="4" r="3.5" fill="#E100FF" />
    <text x="14" y="8" fill="#94A3B8" font-size="9" font-weight="600" letter-spacing="1.5" class="mono">SYSTEM // 04 · ENTERPRISE FEEDBACK OS</text>
    <text x="0" y="32" fill="#F8FAFC" font-size="18" font-weight="700" letter-spacing="-0.3" class="sans">Formspear</text>
    <text x="96" y="32" fill="#E100FF" font-size="11" font-weight="600" letter-spacing="1" class="mono">[39 SQL TABLES]</text>
  </g>

  <!-- Relational Schema Nodes & BullMQ Engine -->
  <g transform="translate(24, 82)">
    <text x="0" y="0" fill="#64748B" font-size="8.5" font-weight="600" letter-spacing="1.2" class="mono">RELATIONAL DATA MODEL // BULLMQ PIPELINE</text>
    <text x="270" y="0" fill="#E100FF" font-size="8.5" font-weight="600" letter-spacing="0.8" class="mono">INDEXES: 13 OPTIMIZED</text>

    <!-- Schema Topology Graph Visual -->
    <g transform="translate(0, 16)">
      <!-- Node: Form Def -->
      <rect x="0" y="6" width="76" height="32" rx="4" fill="#121624" stroke="#252E46" stroke-width="1" />
      <text x="38" y="26" fill="#F1F5F9" font-size="9" font-weight="600" text-anchor="middle" class="mono">SCHEMAS</text>

      <line x1="76" y1="22" x2="108" y2="22" stroke="#E100FF" stroke-width="1.2" stroke-dasharray="2 2" />

      <!-- Node: Respondent Sessions -->
      <rect x="108" y="6" width="84" height="32" rx="4" fill="#121624" stroke="#252E46" stroke-width="1" />
      <text x="150" y="26" fill="#F1F5F9" font-size="9" font-weight="600" text-anchor="middle" class="mono">SESSIONS</text>

      <line x1="192" y1="22" x2="224" y2="22" stroke="#E100FF" stroke-width="1.2" stroke-dasharray="2 2" />

      <!-- Node: BullMQ Synthesis -->
      <rect x="224" y="6" width="82" height="32" rx="4" fill="#121624" stroke="#E100FF" stroke-width="1" />
      <text x="265" y="26" fill="#E100FF" font-size="9" font-weight="600" text-anchor="middle" class="mono">BULLMQ</text>

      <line x1="306" y1="22" x2="334" y2="22" stroke="#10B981" stroke-width="1.2" stroke-dasharray="2 2" />

      <!-- Node: AI Synthesis -->
      <rect x="334" y="6" width="58" height="32" rx="4" fill="#121624" stroke="#10B981" stroke-width="1" />
      <text x="363" y="26" fill="#10B981" font-size="9" font-weight="600" text-anchor="middle" class="mono">LLM</text>
    </g>
  </g>

  <!-- Technical Spec Footer -->
  <g transform="translate(24, 180)">
    <line x1="0" y1="0" x2="392" y2="0" stroke="#1B2130" stroke-width="1" />
    <text x="0" y="18" fill="#64748B" font-size="8.5" font-weight="500" class="mono">
      PostgreSQL Strict Relational · BullMQ · Redis · LLM Insight Synthesis · Zero-Dep SDK
    </text>
  </g>
</svg>